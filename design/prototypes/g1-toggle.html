<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G1 レッスン帳</title>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="flows.css">
<style>
/* G1：Cの画面構成（種類ごとに1画面・宿題を大きく・個人練ボタン）を、メモ帳式の見た目で。曲ページは「まとめ」と「チャット」を切り替え */
:root {
  --desk: #e7e7ec; --bg: #f2f2f7; --card: #ffffff; --fg: #1c1c1e; --muted: #8a8a8e; --line: #dcdce1;
  --accent: #d29b00; --accent-d: #a87a00; --on-accent: #fff; --rec: #ff3b30; --field: #ffffff; --sheet: #f2f2f7; --bullet: #c7c7cc;
  --t-bg: #ffffff; --me-bg: #fff3c4; --teacher: #3a6ea5; --hl: #e5e5ea; --seg: #e3e3e8;
}
[hidden] { display: none !important; }
/* 動き：遷移はゆっくりめ、押したら見える手応え */
.screen { transition: opacity .42s ease, transform .42s ease; }
button { transition: opacity .15s ease, background-color .2s ease, transform .15s ease; }
button:active { opacity: .55; }
.fade { animation: fade .38s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.head { padding: 54px 16px 4px; display: flex; gap: 8px; align-items: center; }
.seg { position: relative; flex: 1; display: flex; background: var(--seg); border-radius: 10px; padding: 2px; }
.seg .knob { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 8px; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: transform .38s cubic-bezier(.3,.8,.3,1), width .38s; }
.seg button { position: relative; flex: 1; padding: 7px 0; font-size: 14px; font-weight: 600; color: var(--fg); z-index: 1; }
.seg button:active { opacity: 1; }
.seg.sm button { padding: 6px 0; font-size: 13px; }
.ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); flex: none; }
.ic svg { width: 20px; height: 20px; }
.lh { display: flex; justify-content: space-between; align-items: center; width: calc(100% - 32px); margin: 12px 16px 0; padding: 12px 16px; border-radius: 12px; background: var(--card); text-align: left; }
.lh b { font-size: 16px; }
.lh span { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 2px; }
.lh span svg { color: #c4c4c7; }
.grp { margin: 0 16px; background: var(--card); border-radius: 12px; padding: 4px 16px; }
.hw li { font-size: 19px; font-weight: 700; line-height: 1.45; padding: 11px 0; border-bottom: .5px solid var(--line); list-style: none; }
.hw li:last-child { border-bottom: 0; }
.hw, .lr { margin: 0; padding: 0; }
.lr li { list-style: none; padding: 8px 0; font-size: 16px; line-height: 1.5; border-bottom: .5px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
.lr li:last-child { border-bottom: 0; }
.who { flex: none; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; line-height: 1.6; }
.who.t { color: var(--teacher); background: #e6eef7; }
.who.m { color: #8a6500; background: var(--me-bg); }
.dock { padding: 10px 16px 12px; background: linear-gradient(to top, var(--bg) 75%, rgba(242,242,247,0)); }
.go { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 4px 0 var(--accent-d); transition: transform .14s ease, box-shadow .14s ease; }
.go:active { opacity: 1; transform: translateY(4px); box-shadow: 0 0 0 var(--accent-d); }
.tabbar { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: .5px solid var(--line); background: rgba(249,249,249,.94); padding: 6px 0 28px; }
.sw-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border-radius: 14px; background: var(--field, var(--card)); font-size: 16px; text-align: left; }
.sw { position: relative; width: 51px; height: 31px; border-radius: 16px; background: #e3e3e8; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.sw.on { background: #34c759; }
.sw.on::after { transform: translateX(20px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); }
.tab.on { color: var(--accent); }
.nav { padding: 54px 16px 4px; display: flex; align-items: center; justify-content: space-between; min-height: 92px; }
.nav .bk { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; margin-left: -6px; }
.ttl { padding: 0 20px; }
.ttl b { display: block; font-size: 28px; font-weight: 700; line-height: 1.25; }
.ttl span { color: var(--muted); font-size: 15px; }
.songs { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px 0; }
.songs button { padding: 6px 12px; border-radius: 8px; background: var(--card); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.songs button svg { color: var(--accent); width: 15px; height: 15px; }
.sec { font-size: 13px; color: var(--muted); padding: 22px 32px 7px; display: flex; justify-content: space-between; align-items: baseline; }
.sec button { color: var(--accent); font-size: 14px; }
.recbox { margin: 0 16px; background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.recbox .wave { flex: 1; color: var(--fg); overflow: hidden; }
.recbtn { width: calc(100% - 32px); margin: 0 16px; background: var(--card); border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--rec); font-weight: 600; font-size: 16px; }
.recbar { display: flex; align-items: center; gap: 10px; margin: 0 16px 6px; padding: 10px 14px; border-radius: 12px; background: #fff0ef; color: var(--rec); font-weight: 600; }
.recbar .tm { flex: 1; font-variant-numeric: tabular-nums; }
/* 帯には停止を置かない。帯をタップして大きな録音画面を開き、そこで止める（1タップで止めてしまわないように） */
.recbar { width: calc(100% - 32px); text-align: left; cursor: pointer; }
.recbar svg { width: 16px; height: 16px; opacity: .7; }
.player { position: absolute; left: 12px; right: 12px; bottom: 26px; z-index: 30; padding: 10px 14px 8px; border-radius: 18px; background: rgba(30,30,32,.95); color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: fade .35s ease both; }
.player .pl-top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.player .pl-top span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
.player .pl-x { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; color: #fff; flex: none; }
.player .pl-x svg { width: 14px; height: 14px; }
.player .bar { position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin-top: 10px; cursor: pointer; }
.player .bar::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; bottom: -10px; }
.player .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.player .pl-tm { display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
.player .pl-ctl { display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: center; justify-items: center; margin-top: 2px; }
.player .pl-ctl button { min-width: 48px; height: 44px; display: grid; place-items: center; color: #fff; }
.player .pl-rate { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.player .pl-pp { width: 48px; height: 48px !important; min-width: 0 !important; border-radius: 50%; background: #fff !important; color: #1c1c1e !important; }
.player .pl-pp svg { width: 20px; height: 20px; }
.player .pl-mark { height: 32px !important; padding: 0 12px; border-radius: 16px; background: rgba(210,155,0,.28); color: #ffd25e !important; font-size: 14px; font-weight: 700; }
/* 編集できる箇条書き */
.el { margin: 0 16px; background: var(--card); border-radius: 12px; overflow: hidden; overflow: clip; }
.el ul { list-style: none; margin: 0; padding: 0; }
.el li { position: relative; overflow: hidden; border-bottom: .5px solid var(--line); }
.el .row { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; background: var(--card); transition: transform .3s cubic-bezier(.3,.8,.3,1), margin-right .3s cubic-bezier(.3,.8,.3,1), background-color .2s; touch-action: pan-y; }
.el .row.hl { background: var(--hl); }
.el .row .tx { flex: 1; min-width: 0; font-size: 16px; line-height: 1.5; cursor: text; }
.el .row .tx.big { font-size: 17px; font-weight: 600; }
.el .row .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; font-size: 12px; color: var(--muted); }
.el .row .meta button { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
.el .row .meta .at { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.el .row .meta .at.live { color: var(--rec); }
.el .row .meta .at svg { width: 10px; height: 10px; }
.el .row .meta .none { color: var(--accent); }
.el .row input.ed { width: 100%; border: 0; outline: none; background: transparent; font-size: 16px; line-height: 1.5; padding: 0; }
.el .del { position: absolute; z-index: 0; top: 0; bottom: 0; right: 0; width: 80px; background: var(--rec); color: #fff; font-weight: 600; font-size: 15px; display: grid; place-items: center; border-radius: 0; }
.el .del:active { opacity: .8; }
.el .grip { flex: none; align-self: center; color: #c4c4c7; padding: 2px 0 2px 8px; cursor: grab; touch-action: none; }
.el .minus { flex: none; align-self: center; width: 22px; height: 22px; border-radius: 50%; background: var(--rec); color: #fff; display: grid; place-items: center; font-weight: 700; line-height: 1; transition: transform .25s; }
/* 並べ替え中に「−」を押した行：iPhone と同じく「−」が縦になり、右に赤い「削除」が出る（押すまでは消さない） */
.el li.rm .minus { transform: rotate(90deg); }
.el li.rm .row { margin-right: 80px; }
.el li.rm .grip { display: none; }
.el li:not(.swp) .del { visibility: hidden; }
.el li.drag { z-index: 3; overflow: visible; }
.el li.drag .row { background: var(--hl); box-shadow: 0 4px 14px rgba(0,0,0,.12); position: relative; z-index: 2; transition: none; }
.el li.ind { height: 0; border: 0; overflow: visible; z-index: 4; }
.el li.ind::after { content: ""; position: absolute; left: 12px; right: 12px; top: -2px; height: 3px; border-radius: 2px; background: var(--accent); }
.el .slot { margin: 2px 14px 10px; padding: 9px 12px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; text-align: center; }
.el .tk-none { color: var(--muted); font-weight: 600; }
.el .add { display: flex; align-items: center; gap: 8px; padding: 9px 14px; }
.el .add input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; padding: 3px 0; }
.el .add input::placeholder { color: var(--muted); }
.el .tk-h { display: block; width: 100%; text-align: left; padding: 14px 14px 4px; font-size: 14px; font-weight: 700; color: var(--fg); border-top: .5px solid var(--line); }
.el section:first-child > .tk-h { border-top: 0; }
/* 題の見出しは、その題の行を見ている間は画面の上に貼り付ける（書いている題がいつも見えるように） */
.el section > .tk-h { position: sticky; top: 0; z-index: 2; background: var(--card); }
.el section > .tk-h.stuck { border-top-color: transparent; box-shadow: 0 .5px 0 var(--line); }
/* 行や追加欄へスクロールで送るとき（検索の結果・フォーカス）、貼り付いた見出しの下に隠れないように上をあける */
.scroll:has(.tk-h) { scroll-padding-top: 44px; }
.el .tk-add { display: block; width: 100%; text-align: left; padding: 12px 14px; color: var(--accent); font-size: 15px; border-top: .5px solid var(--line); }
.pr { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: .5px solid var(--line); }
.pr:last-child { border-bottom: 0; }
.pr .d { width: 44px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.pr .n { flex: 1; min-width: 0; font-size: 15px; line-height: 1.45; }
.pr .n small { display: block; color: var(--muted); font-size: 12px; }
.addpr { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 16px; padding: 10px 0; }
.list { margin: 0 16px; background: var(--card); border-radius: 12px; overflow: hidden; }
.list button { display: flex; width: 100%; align-items: center; justify-content: space-between; text-align: left; padding: 12px 16px; border-bottom: .5px solid var(--line); }
.list button:active { opacity: 1; background: var(--hl); }
.list button:last-child { border-bottom: 0; }
.list small { display: block; color: var(--muted); font-size: 14px; }
.list svg { color: #c4c4c7; flex: none; }
.plus { position: absolute; right: 18px; bottom: 96px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 var(--accent-d); z-index: 20; transition: transform .14s, box-shadow .14s; }
.plus:active { opacity: 1; transform: translateY(4px); box-shadow: 0 0 0 var(--accent-d); }
/* 曲ページ */
.tr li { display: flex; flex-direction: column; padding: 9px 0; border-bottom: .5px solid var(--line); list-style: none; }
.tr li:last-child { border-bottom: 0; }
.tr .d { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.tr .t { font-size: 15px; line-height: 1.5; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tr .at { flex: none; font-size: 12px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 3px; }
.tr .at svg { width: 10px; height: 10px; }
.tr { margin: 0; padding: 0; }
.memo-in { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: .5px solid var(--line); }
.memo-in input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; }
.memo-in .ok { color: var(--accent); font-weight: 600; }
.log { padding: 10px 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.div { align-self: center; font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
.lmark { align-self: center; display: flex; align-items: center; gap: 4px; background: var(--seg); border-radius: 14px; padding: 5px 12px; font-size: 12px; color: var(--fg); font-weight: 600; margin: 2px 0; }
.lb { align-self: flex-start; max-width: 80%; }
.lb .nm { font-size: 11px; color: var(--muted); margin: 0 0 2px 10px; }
.lb .bb { background: var(--t-bg); padding: 9px 13px; border-radius: 18px 18px 18px 6px; font-size: 15px; line-height: 1.45; }
.lb .bb .at { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 12px; color: var(--accent); font-weight: 600; }
.lb .bb .at svg { width: 10px; height: 10px; }
.rb { align-self: flex-end; max-width: 80%; background: var(--me-bg); padding: 9px 13px; border-radius: 18px 18px 6px 18px; font-size: 15px; line-height: 1.45; }
.rb small { display: block; font-size: 11px; color: #8a6500; margin-bottom: 1px; }
.rrec { align-self: flex-end; max-width: 82%; background: var(--card); padding: 8px 12px 8px 8px; border-radius: 18px 18px 6px 18px; display: flex; flex-direction: column; gap: 4px; }
.rrec .rl { font-size: 11px; color: var(--muted); padding-left: 4px; }
.rrec .rt { font-size: 14px; padding-left: 4px; }
.rrec .rr { display: flex; align-items: center; gap: 8px; }
.rrec .pb { background: var(--bg); }
.rrec .wave { color: var(--accent); }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 12px 30px; border-top: .5px solid var(--line); background: rgba(249,249,249,.96); }
.composer input { flex: 1; min-width: 0; height: 40px; border-radius: 20px; border: .5px solid var(--line); padding: 0 14px; font-size: 16px; outline: none; background: var(--card); }
.composer .send { flex: none; color: var(--accent); font-weight: 700; padding: 0 6px; }
.composer .rec { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--card); color: var(--rec); display: grid; place-items: center; }
.composer .who { flex: none; font-size: 12px; padding: 5px 8px; border-radius: 8px; }
.tg { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--card); font-size: 15px; text-align: left; }
.tg .bx { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; flex: none; }
.tg.on .bx { background: var(--accent); border-color: var(--accent); }
.empty { color: var(--muted); font-size: 15px; padding: 10px 0; }
.grp > .empty, .list > .empty { font-size: 14px; line-height: 1.55; }
.more { display: block; width: 100%; text-align: center; padding: 10px 0 8px; color: var(--accent); font-size: 14px; }
#app:has(.player) .toast { bottom: 200px; }
/* 付箋（個人練などの録音） */
.mks { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.mk { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--fg); line-height: 1.45; text-align: left; }
.mk .at { flex: none; display: inline-flex; align-items: center; gap: 3px; color: var(--accent); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
.mk .at svg { width: 10px; height: 10px; }
/* レッスン録音中で押せない録音ボタン */
.busy { opacity: .4; }
.go.busy { box-shadow: none; }
.tp-p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); }
/* 次のレッスンで聞くこと */
.ask-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: .5px solid var(--line); }
.ask-row .q { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.ask-row .tx { flex: 1; min-width: 0; font-size: 16px; line-height: 1.5; }
.ask-row .tx small { display: block; font-size: 12px; color: var(--muted); }
.ask-row .done { flex: none; font-size: 13px; color: var(--accent); font-weight: 600; padding: 4px 10px; border-radius: 12px; background: #fff6d6; }
.home-ask { display: block; width: calc(100% - 32px); margin: 14px 16px 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); text-align: left; }
.home-ask .k { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; }
.home-ask .k svg { width: 14px; height: 14px; color: #c4c4c7; }
.home-ask li { list-style: none; position: relative; padding: 3px 0 3px 16px; font-size: 15px; line-height: 1.5; color: #3a3a3c; }
.home-ask li::before { content: "？"; position: absolute; left: 0; top: 3px; font-size: 12px; color: var(--muted); }
.home-ask ul { margin: 4px 0 0; padding: 0; }
.ttl .dt { display: inline-flex; align-items: center; gap: 4px; font-size: 28px; font-weight: 700; line-height: 1.25; text-align: left; }
.ttl .dt svg { width: 16px; height: 16px; color: var(--muted); transform: rotate(90deg); }
.nav .mo { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); }
.sec .sub { font-size: 14px; color: var(--accent); }
/* 録音の行：タップで直す、左スワイプで削除（学んだことの行と同じ操作） */
.swr { position: relative; overflow: hidden; margin: 0 -16px; }
.swr-in { position: relative; z-index: 1; padding: 0 16px; background: var(--card); transition: transform .3s cubic-bezier(.3,.8,.3,1); touch-action: pan-y; cursor: pointer; }
.swr .del { position: absolute; z-index: 0; top: 0; bottom: 0; right: 0; width: 80px; background: var(--rec); color: #fff; font-weight: 600; font-size: 15px; display: grid; place-items: center; }
.swr:not(.swp) .del { visibility: hidden; }
.swr .pr { border-bottom: .5px solid var(--line); }
.grp:has(.swr) { overflow: hidden; }
.tr li.rli { padding: 0; }
.rrow { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; padding: 9px 0; }
.rrec { cursor: pointer; }
.mk-ed { display: flex; flex-direction: column; background: var(--field); border-radius: 12px; padding: 2px 4px 2px 14px; }
.mk-ed .mk { padding: 6px 0; font-size: 15px; align-items: center; border-bottom: .5px solid var(--line); }
.mk-ed .mk:last-child { border-bottom: 0; }
.mk-ed .mk .tx { flex: 1; min-width: 0; }
.mk-ed .mk button { flex: none; width: 36px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.mk-ed .mk button svg { width: 16px; height: 16px; }
/* 曲ページのメモ：タップで直す・左スワイプで削除 */
.tr li.mli .swr-in .t { padding: 3px 0; }
.lb, .rb { cursor: pointer; }

<script>
const { D, Rec, Play, makeNav, esc, h, I, toast, sheet } = LM;

// ── データ：学んだこと・宿題を「1行＝1つの物」にする ──
// 学んだことは「題」ごとにまとめる。題は曲か、自由な言葉（例：手首が固まってしまう）
// 題：{ k, songId(曲の題) | title(自由な言葉) }  行：{ text, by: 't'(先生)|'m'(自分), tk: 題のk(題なしはnull), songId: 題の曲, at: レッスン録音の何秒目に書いたか }
let tkSeq = 0;
const sampleNotes = {

  L3: [['移弦は肘の高さから先に変える', 't', 's2', 880]],

const topicOf = (l, k) => (k ? l.topics.find((t) => t.k === k) : null);

const normNotes = (l) => { const o = (k) => (k ? l.topics.findIndex((t) => t.k === k) : -1); const s2 = [...l.notes].sort((a, b) => o(a.tk) - o(b.tk)); l.notes.splice(0, l.notes.length, ...s2); };
D.S.lessons.forEach((l) => {
  l.topics = [];
  l.notes = (sampleNotes[l.id] || []).map(([text, by, key, at]) => {
    let t = key ? l.topics.find((x) => x.songId === key || x.title === key) : null;

D.S.lessons.forEach(sync);
D.S.memos.forEach((m) => { m.by = /（先生）/.test(m.text) ? 't' : 'm'; m.text = m.text.replace('（先生）', ''); });
const newLesson = (typeId) => { const l = D.addLesson(typeId); l.topics = []; l.notes = []; l.hw = []; return l; };

const notesOfSong = (sid) => D.S.lessons.flatMap((l) => l.notes.filter((n) => n.songId === sid).map((n) => ({ ...n, date: l.date, lesson: l, src: n })));

const HV = new URLSearchParams(location.search).get('v'); if (HV) document.body.classList.add('hv-' + HV);

let cur = D.S.types[0] ? D.S.types[0].id : null; let tab = 'home'; let recTarget = null; let songView = 'sum';

// ── 共通部品 ──
let homeRec = true; // 設定：「いま」に「個人練を録音」を出す（人によって要る・要らないが分かれるので切り替えられるようにする）

function segment(items, value, onPick, cls) {

  const knob = el.querySelector('.knob'); const n = items.length;
  const place = (k, anim) => { const i = Math.max(0, items.findIndex((x) => x[0] === k)); if (!anim) knob.style.transition = 'none'; knob.style.width = 'calc((100% - 4px) / ' + n + ')'; knob.style.transform = 'translateX(' + (i * 100) + '%)'; if (!anim) requestAnimationFrame(() => (knob.style.transition = '')); };

}
const fadeIn = () => requestAnimationFrame(() => { const s = document.querySelector('.screen.in .scroll'); if (s) { s.classList.remove('fade'); void s.offsetWidth; s.classList.add('fade'); } });
function recBar(nav, here) {
  if (!Rec.on || !recTarget) return null;
  // 帯には「停止」を置かない（記入中ずっと上にあり、親指が触れて1タップで止めると、そのレッスンでは録り直せないため）

    onStop: (dur) => {

// 扱った曲 → ほかの曲（N）… → ＋ 新しい曲、そして曲以外の題。扱った曲から選べる曲がないとき（新しいレッスンなど）は、
// 最近の動きの新しい順に5曲までを最初から並べて「ほかの曲…」を挟まない（毎週弾いている曲でも1タップ増えるため）。

  const rest = D.songsByActivity(l.typeId).map((sg) => sg.id).filter((id) => id !== o.exclude && !l.songIds.includes(id)); // 最近の動きの新しい順

  // 並べた曲がどれも扱った曲に入っていないときは、「扱った曲にも入る」を1つずつ付けず、上に1行だけ出す
  // 曲を変えるときは、扱った曲の元の曲と入れ替わる（変えたあとの画面で見える）ので、「扱った曲にも入る」は出さない
  const allNew = !inLesson.length && inline.length > 0 && !o.change;
  const item = (id) => '<button class="tp-item" data-s="' + id + '"><b>♪ ' + esc(D.song(id).title) + '</b>' + (o.change && has(id) ? '<span>この題にまとめる</span>' : o.change || l.songIds.includes(id) || (allNew && inline.includes(id)) ? '' : '<span>扱った曲にも入る</span>') + '</button>';

    const sub = [o.sub, allNew ? '選んだ曲は扱った曲にも入ります' : ''].filter(Boolean).join('。');
    el.innerHTML = '<div class="tp"><div class="tp-title">' + esc(o.title) + '</div>' + (sub ? '<div class="ap-sub" style="margin:-6px 0 0">' + esc(sub) + '</div>' : '') +
      [...inLesson, ...inline].map(item).join('') +
      (others.length ? '<button class="tp-item" data-act="others"><b>ほかの曲（' + others.length + '）…</b></button>' : '') +
      '<button class="tp-add" data-act="newsong" style="align-self:flex-start;padding:4px 0">＋ 新しい曲</button>' +
      '<div class="sp-new" data-new hidden><input id="tk-song" class="ap-note" placeholder="曲名" autocomplete="off"><button class="sp-add" data-act="songok">' + esc(o.ok) + '</button></div>' +
      '<div class="ap-k">曲以外の題</div><input id="tk-new" class="ap-note" placeholder="例：手首が固まってしまう" autocomplete="off"><button class="ap-save" data-act="ok">' + esc(o.ok) + '</button></div>';
    bindSongs();

    // 同じ名前の曲があれば、作らずにその曲を使う
    const songOk = () => { const v = si.value.trim(); if (!v) { si.focus(); return; } const r = D.songByName(l.typeId, v); if (r.song.id === o.exclude) { toast(app, '今と同じ曲です'); return; } o.onSong(r.song.id, r); };
    el.querySelector('[data-act=songok]').onclick = songOk; si.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) songOk(); };

// 曲の題を、別の曲か言葉の題に付け替える。行はそのまま新しい題に入る。付け替え先の題がそのレッスンにもうあれば、行をそちらへ移して1つにまとめる
// 扱った曲も合わせて直す：新しい曲を入れ（元の曲の位置に）、元の曲はこのレッスンのほかの題で使っていなければ外す
// 題・行・扱った曲を今の状態に戻す関数を返す（曲を変える・題を外すの「取り消す」で共通）
function topicSnap(l) {
  const snap = { topics: l.topics.map((x) => [x, x.songId, x.title]), notes: l.notes.map((n) => [n, n.tk, n.songId]), songIds: l.songIds.slice() };
  return () => {
    snap.topics.forEach(([x, sid, ti]) => { x.songId = sid; x.title = ti; });
    l.topics.splice(0, l.topics.length, ...snap.topics.map((x) => x[0]));
    snap.notes.forEach(([n, tk, sid]) => { if (l.notes.includes(n)) { n.tk = tk; n.songId = sid; } });
    l.songIds.splice(0, l.songIds.length, ...snap.songIds);

  };
}
function retopic(l, t, to) {

  if (dest) { l.notes.forEach((n) => { if (n.tk === t.k) { n.tk = dest.k; n.songId = dest.songId; } }); l.topics.splice(l.topics.indexOf(t), 1); }
  else { t.songId = to.songId || null; t.title = to.songId ? null : to.title; l.notes.forEach((n) => { if (n.tk === t.k) n.songId = t.songId; }); }

  if (to.songId && !l.songIds.includes(to.songId)) { if (i >= 0 && !keepOld) l.songIds[i] = to.songId; else l.songIds.push(to.songId); }

  toast(app, dest ? '「' + nm + '」の題にまとめました' : '「' + nm + '」に変えました', { label: '取り消す', fn: undo });

  songs.forEach((s) => {
    // このレッスンのために作った曲（このレッスンの日以降に作り、ほかで使っていない曲）は、元のフォルダに残さない
    const usedElse = D.S.recs.some((r) => r.songId === s.id && !moved(r)) || D.S.memos.some((m) => m.songId === s.id) || D.S.asks.some((a) => a.songId === s.id && !moved(a)) ||
      D.S.lessons.some((x) => x !== l && (x.songIds.includes(s.id) || x.topics.some((tp) => tp.songId === s.id)));
    const mine = !usedElse && s.created && s.created >= l.date;
    const same = D.findSong(tid, s.title);
    if (same) { map.set(s.id, same.id); if (!same.sub && s.sub) same.sub = s.sub; if (mine) D.S.songs.splice(D.S.songs.indexOf(s), 1); }
    else if (mine) s.typeId = tid;
    else map.set(s.id, D.addSong(tid, s.title, s.sub).id);
  });
  const m = (id) => (id && map.has(id) ? map.get(id) : id);
  l.typeId = tid;
  l.songIds.splice(0, l.songIds.length, ...l.songIds.map(m).filter((id, i, a) => a.indexOf(id) === i));
  l.topics.forEach((x) => (x.songId = m(x.songId))); l.notes.forEach((x) => (x.songId = m(x.songId)));
  recs.forEach((r) => (r.songId = m(r.songId))); asks.forEach((a) => { a.typeId = tid; a.songId = m(a.songId); });
  // 2つの曲が移す先の同じ曲になったときは、題を1つにまとめる
  l.topics.slice().forEach((x) => { const f = x.songId && l.topics.find((y) => y !== x && y.songId === x.songId); if (f && l.topics.indexOf(f) < l.topics.indexOf(x)) { l.notes.forEach((n) => { if (n.tk === x.k) n.tk = f.k; }); l.topics.splice(l.topics.indexOf(x), 1); } });
  normNotes(l); sync(l);
}

const recTypeId = (r) => (r.lessonId && D.lesson(r.lessonId) ? D.lesson(r.lessonId).typeId : D.song(r.songId).typeId);
let openSw = null;
const closeSw = () => { if (!openSw) return; const r = openSw; openSw = null; r.style.transform = ''; setTimeout(() => r.parentElement && r.parentElement.classList.remove('swp'), 320); };
// wrap：.swr（中に .swr-in と .del）。スワイプ・タップ・削除をつなぐ（録音・曲ページのメモで共通）
const recRow = (wrap, r) => swRow(wrap, () => recEditSheet(r), () => recDelConfirm(r));
function swRow(wrap, onTap, onDel) {
  const row = wrap.querySelector('.swr-in');
  let x0 = null, y0 = 0, dx = 0, moved = false, skip = false;
  // 右端の再生ボタンの上から始めてもスワイプになる（動かさずに離せば再生）
  row.addEventListener('pointerdown', (e) => { skip = false; if (e.target.closest('input')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; row.style.transition = 'none'; });
  row.addEventListener('pointermove', (e) => {
    if (x0 == null) return; const ddx = e.clientX - x0; if (!moved && Math.abs(e.clientY - y0) > Math.abs(ddx)) { x0 = null; row.style.transition = ''; return; }
    if (Math.abs(ddx) > 6) { moved = true; row.setPointerCapture(e.pointerId); wrap.classList.add('swp'); }
    const base = openSw === row ? -80 : 0; dx = Math.min(0, Math.max(-110, base + ddx)); if (moved) row.style.transform = 'translateX(' + dx + 'px)';
  });
  const end = () => {
    if (x0 == null) return; x0 = null; row.style.transition = ''; skip = moved;
    if (!moved) return;
    if (dx < -40) { if (openSw && openSw !== row) closeSw(); row.style.transform = 'translateX(-80px)'; openSw = row; }
    else { row.style.transform = ''; if (openSw === row) openSw = null; setTimeout(() => wrap.classList.remove('swp'), 320); }
  };
  row.addEventListener('pointerup', end); row.addEventListener('pointercancel', end);
  row.addEventListener('click', (e) => { if (skip) { skip = false; return; } if (e.target.closest('button')) return; if (openSw) { closeSw(); return; } onTap(); });
  wrap.querySelector('.del').onclick = (e) => { e.stopPropagation(); onDel(); };
}

      el.querySelector('[data-act=ok]').onclick = ok; inp.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) ok(); };
      const go = el.querySelector('[data-act=go]'); if (go) go.onclick = () => { close(); Play.stop(); nav.push('lesson', { id: l.id }); };
      el.querySelector('[data-act=del]').onclick = () => { close(); memoDel(x); };

}
// 行・メモを確かめずに消し、短い通知の「取り消す」で元の位置に戻す（レッスンページの学んだこと・宿題、曲ページのメモで共通）
// l：レッスンの行のとき、そのレッスン。戻すときに題が外されていたら題なしに戻す
function delWithUndo(arr, o, msg, redraw, l) {
  const i = arr.indexOf(o); if (i < 0) return;
  arr.splice(i, 1); if (l) sync(l); redraw();
  toast(app, msg, { label: '取り消す', fn: () => {
    if (arr.includes(o)) return;
    // 1行だけのレッスンで消してすぐ戻ると、空のレッスンとして捨てられている。そのときはレッスンごと戻す
    if (l && !D.S.lessons.includes(l)) { if (!l.blankDropped) return; l.blankDropped = false; D.S.lessons.push(l); }
    if (l && o.tk && !topicOf(l, o.tk)) { o.tk = null; o.songId = null; }
    arr.splice(Math.min(i, arr.length), 0, o); if (l) sync(l); redraw();
  } });
}
// 学んだことの行と同じく、確かめずに消す。押し間違えたときのために、短い通知から取り消せる
function memoDel(x) {
  delWithUndo(x.m ? D.S.memos : x.lesson.notes, x.m || x.n, x.lesson ? D.md(x.lesson.date) + 'のレッスンの行を削除しました' : 'メモを削除しました', () => { openSw = null; nav.refresh(); }, x.lesson);
}
// まとめの1行（タップで直す、左スワイプで削除）
const memoRow = (inner, x) => { const w = h('<div class="swr"><div class="swr-in">' + inner + '</div><button class="del">削除</button></div>'); swRow(w, () => memoSheet(x), () => memoDel(x)); return w; };

// 名前を変えて同じ名前になった曲を、すでにある曲 f にまとめる。打ち間違えて別の曲ができたときに、録音やメモが2つの曲ページに分かれたままにならないように
const mergeCounts = (s) => {
  const ls = D.S.lessons.filter((l) => l.typeId === s.typeId);
  return { recs: D.S.recs.filter((r) => r.songId === s.id).length, memos: D.S.memos.filter((m) => m.songId === s.id).length,
    topics: ls.reduce((n, l) => n + l.topics.filter((t) => t.songId === s.id).length, 0), notes: ls.reduce((n, l) => n + l.notes.filter((x) => x.songId === s.id).length, 0),
    lessons: ls.filter((l) => l.songIds.includes(s.id)).length, asks: D.S.asks.filter((a) => a.songId === s.id).length };
};
function mergeAsk(el, close, s, f, sub) {
  const c = mergeCounts(s);
  const parts = [c.recs ? '録音' + c.recs + '件' : '', c.memos ? 'メモ' + c.memos + '件' : '', c.topics ? '学んだことの題' + c.topics + 'つ（' + c.notes + '行）' : '',
    c.lessons ? '扱った曲（レッスン' + c.lessons + '回分）' : '', c.asks ? '聞くこと' + c.asks + '件' : ''].filter(Boolean);
  el.innerHTML = '<div class="tp"><div class="tp-title">すでに「' + esc(f.title) + '」があります。1つにまとめますか？</div>' +
    '<p class="tp-p">' + (parts.length ? '「' + esc(s.title) + '」の' + parts.join('・') + 'を「' + esc(f.title) + '」へ移し、' : '移すものはありません。') + '「' + esc(s.title) + '」は消えます。元に戻せません。</p>' +
    '<button class="ap-save" data-act="yes">まとめる</button><button class="tp-add" data-act="no">やめる</button></div>';
  el.querySelector('[data-act=no]').onclick = close; // やめたら名前は変えない
  el.querySelector('[data-act=yes]').onclick = () => { mergeSong(s, f, sub); close(); nav.replace('song', { id: f.id }); toast(app, '「' + shortName(f.title) + '」にまとめました'); };
}
function mergeSong(s, f, sub) {
  D.S.recs.forEach((r) => { if (r.songId === s.id) r.songId = f.id; });
  D.S.memos.forEach((m) => { if (m.songId === s.id) m.songId = f.id; });
  D.S.asks.forEach((a) => { if (a.songId === s.id) a.songId = f.id; });
  D.S.lessons.forEach((l) => {
    const j = l.songIds.indexOf(s.id); if (j >= 0) { if (l.songIds.includes(f.id)) l.songIds.splice(j, 1); else l.songIds[j] = f.id; }
    // 曲の題：同じレッスンに f の題がすでにあれば、行をそちらへ移して題を1つにする
    l.topics.filter((t) => t.songId === s.id).forEach((t) => {
      const ft = l.topics.find((x) => x.songId === f.id);
      if (ft) { l.notes.forEach((n) => { if (n.tk === t.k) n.tk = ft.k; }); l.topics.splice(l.topics.indexOf(t), 1); } else t.songId = f.id;
    });
    l.notes.forEach((n) => { if (n.songId === s.id) n.songId = f.id; });
    normNotes(l); sync(l);
  });
  if (!f.sub && (sub || s.sub)) f.sub = sub || s.sub;
  D.S.songs.splice(D.S.songs.indexOf(s), 1);
}

// ── レッスン（タブ）の検索：学んだこと・宿題を、題・曲名でも探す。結果は行ごと ──
let lessonQ = ''; let lessonsTop = null; // 検索の文字と、レッスンページから戻ったときのスクロール位置（タブを替えたら消す）
const mag = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
const normQ = (t) => String(t).normalize('NFKC').toLowerCase();
const qWords = (q) => normQ(q).split(/\s+/).filter(Boolean);
const topicName = (t) => (t ? (t.songId ? '♪ ' + D.song(t.songId).title : t.title) : '');
// 空白で区切った言葉をすべて含む行（行の文と題を合わせて見る。「ヴィヴァルディ 付点」でも探せる）
function searchLessons(tid, q) {
  const ws = qWords(q); if (!ws.length) return [];
  const hit = (...ts) => { const x = normQ(ts.join(' ')); return ws.every((w) => x.includes(w)); };
  const out = [];
  D.lessonsOf(tid).forEach((l) => {
    l.notes.forEach((n) => { const lab = topicName(topicOf(l, n.tk)); if (hit(n.text, lab)) out.push({ l, f: 'notes', o: n, lab }); });
    l.hw.forEach((n) => { if (hit(n.text)) out.push({ l, f: 'hw', o: n, lab: '' }); });
  });
  return out;
}
// 録音の行の日付の欄（幅の決まった欄に入れる）。年が付くときは年のあとで折り返せるようにする
const dCell = (d) => esc(D.md(d)).replace(/^(\d{4}\/)/, '$1<wbr>');
const markQ = (text, q) => {
  const ws = qWords(q).map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')); const t = esc(text);
  return ws.length ? t.replace(new RegExp('(' + ws.join('|') + ')', 'gi'), '<mark>$1</mark>') : t;
};
// レッスン一覧の行の小さな字：扱った曲と題（題で覚えていることが多いので、一覧をなぞるだけで見当がつく）
const lessonSub = (l) => { const ps = [...l.songIds.filter(D.song).map((id) => '♪ ' + D.song(id).title), ...l.topics.filter((t) => !t.songId).map((t) => t.title)]; return ps.length ? ps.join(' · ') : (l.learned[0] || '（まだ何もありません）'); };

    sc.appendChild(log);
    let by = 'm';
    const cp = h('<div class="composer"><button class="rec' + (lessonRecOn() ? ' busy' : '') + '" aria-label="録音">' + I.mic + '</button><button class="who m" data-act="by">自分</button><input id="g-chat" placeholder="メモ" autocomplete="off"><button class="send">追加</button></div>');
    cp.querySelector('[data-act=by]').onclick = (e) => { by = by === 'm' ? 't' : 'm'; e.currentTarget.className = 'who ' + by; e.currentTarget.textContent = by === 't' ? '先生' : '自分'; };
    const add = () => { const m = D.addMemo(s.id, cp.querySelector('input').value); if (m) { m.by = by; nav.refresh(); } };
    cp.querySelector('.send').onclick = add; cp.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) add(); };
    cp.querySelector('.rec').onclick = () => recordSong(s, nav);
    el.appendChild(cp);
    pl.style.cssText = 'position:absolute;left:0;right:0;bottom:70px'; el.appendChild(pl);
    requestAnimationFrame(() => { sc.scrollTop = sc.scrollHeight; });
  },
};
const nav = makeNav(stage, screens);
// 上部の経過時間をタップすると、録音中のレッスンページへ戻る
LM.chrome(app, () => goRecLesson());
nav.root(D.S.types.length ? 'home' : 'hello');
window.__nav = nav;
</script>
</body>
