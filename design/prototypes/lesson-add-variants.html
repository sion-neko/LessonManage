<title>レッスン画面の書き方案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 録音を画面の下にまとめる（録る前＝大きな録音ボタン、録音中＝下のパネル、録り終わり＝2案）。再生画面のトピック一覧は、チャプター名の真下に出る暗いメニューに */
:root {
  --page: #e9e9ee; --paper: #ffffff; --soft: #f4f3ef; --fg: #1c1c1e; --sub: #48484a; --muted: #8a8a8e; --line: #e8e6e0;
  --accent: #d29b00; --accent-d: #a87a00; --rec: #ff3b30; --teacher: #3a6ea5; --me-dot: #e3b400; --flash: #fff3cc; --dock: #f7f6f3;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #121214; --paper: #1c1c1e; --soft: #2a2a2c; --fg: #f2f2f7; --sub: #c7c7cc; --muted: #8e8e93; --line: #38383a;
  --teacher: #7fb0e6; --flash: #3a3014; --dock: #232325; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #121214; --paper: #1c1c1e; --soft: #2a2a2c; --fg: #f2f2f7; --sub: #c7c7cc; --muted: #8e8e93; --line: #38383a;
  --teacher: #7fb0e6; --flash: #3a3014; --dock: #232325; color-scheme: dark }
body { background: var(--page); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
.wrap { max-width: 1340px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 24px; margin: 0 0 6px; }
h2.sec { font-size: 18px; margin: 34px 0 6px; padding-top: 22px; border-top: 1px solid var(--line); }
.lead { color: var(--sub); font-size: 14px; line-height: 1.75; margin: 0 0 18px; max-width: 74ch; }
.phones { display: flex; flex-wrap: wrap; gap: 20px; }
.fr { width: 300px; max-width: 100%; }
.fr > b { display: block; font-size: 14px; margin: 0 0 2px 4px; }
.fr > p { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 0 0 8px 4px; min-height: 58px; }
.scr { position: relative; height: 640px; border-radius: 30px; border: 7px solid #1c1c1e; overflow: hidden; font-size: 14px; background: var(--paper); }

/* レッスン画面 */
.nav { display: flex; justify-content: space-between; padding: 30px 16px 0; color: var(--accent); font-size: 15px; }
.ttl { padding: 4px 20px 0; }
.ttl b { display: block; font-size: 23px; line-height: 1.3; }
.ttl span { color: var(--muted); font-size: 12px; }
.songs { padding: 6px 20px 0; font-size: 12px; color: var(--sub); display: flex; gap: 10px; }
.h { margin: 18px 20px 2px; padding-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--accent-d); font-size: 15px; font-weight: 700; }
ul.l { margin: 0; padding: 0; list-style: none; }
.li { display: flex; gap: 8px; align-items: baseline; padding: 5px 20px; line-height: 1.55; }
.li .tx { flex: 1; min-width: 0; }
.li.m .tx { color: var(--sub); }
.dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--teacher); align-self: center; margin-right: 4px; }
.dot.m { background: var(--me-dot); }
.at { flex: none; font-size: 11px; color: var(--accent-d); font-weight: 700; font-variant-numeric: tabular-nums; }
.at.live { color: var(--rec); }
.hw { font-size: 16px; font-weight: 700; }
.tk { font-size: 12px; font-weight: 700; color: var(--sub); padding: 8px 20px 0; }
.tk.new { color: var(--accent); font-weight: 600; }
.gap { height: 26px; }
.inl { display: flex; align-items: center; gap: 8px; padding: 6px 20px; background: var(--flash); }
.inl .caret { flex: 1; font-size: 14px; }
.inl .caret::after { content: "｜"; color: var(--accent); }
/* 下の録音 */
.dockr { position: absolute; left: 0; right: 0; bottom: 0; background: var(--dock); border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 12px 0 24px; }
.dockr small { font-size: 11px; color: var(--muted); margin-top: 6px; }
.rbtn { width: 62px; height: 62px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; background: var(--paper); }
.rbtn i { width: 48px; height: 48px; border-radius: 50%; background: var(--rec); }
.rbtn.stop i { width: 22px; height: 22px; border-radius: 5px; }
.recp { position: absolute; left: 0; right: 0; bottom: 0; background: var(--dock); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 14px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
.recp .tm { font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; }
.recp .lw { width: 100%; height: 34px; display: flex; align-items: center; gap: 2px; }
.recp .lw i { flex: 1; background: var(--rec); border-radius: 1px; opacity: .75; }
.recp .lw i.q { opacity: .2; }
.recp .st { font-size: 11px; color: var(--rec); font-weight: 700; }
/* 書いているときの細い録音帯（キーボードの上） */
.kb { position: absolute; left: 0; right: 0; bottom: 0; height: 180px; background: var(--soft); border-top: 1px solid var(--line); }
.slim { position: absolute; left: 0; right: 0; bottom: 180px; display: flex; align-items: center; gap: 10px; padding: 7px 14px; background: var(--dock); border-top: 1px solid var(--line); font-size: 13px; }
.slim .r { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
.slim .t { flex: 1; color: var(--rec); font-weight: 700; font-variant-numeric: tabular-nums; }
.slim .ok { color: var(--accent-d); font-weight: 700; }
/* 録り終わり：下のプレーヤー */
.pbar { position: absolute; left: 10px; right: 10px; bottom: 18px; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 18px; background: var(--dock); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.pb { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.pb svg { width: 13px; height: 13px; }
.pbar .wv { position: relative; flex: 1; height: 26px; display: flex; align-items: center; gap: 2px; }
.pbar .wv i { flex: 1; background: var(--muted); opacity: .4; border-radius: 1px; }
.pbar .wv b { position: absolute; top: -4px; width: 6px; height: 7px; background: var(--accent); clip-path: polygon(0 0,100% 0,100% 100%,50% 72%,0 100%); }
.pbar .d { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* 録り終わり：上の1行 */
.rline { margin: 12px 20px 0; display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.rline .pb { width: 28px; height: 28px; }
.rline .pb svg { width: 10px; height: 10px; }
.rline .n { flex: 1; font-size: 14px; }
.rline .n small { color: var(--muted); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
.rline svg.ch { width: 14px; height: 14px; color: var(--muted); }

/* 再生画面 */
.pv { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); }
.pv .top { position: relative; background: #18181a; color: #fff; padding: 30px 16px 16px; }
.pv .bar1 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 14px; color: rgba(255,255,255,.8); }
.pv .bar1 .cl { display: inline-flex; align-items: center; gap: 2px; }
.pv .bar1 .cl svg { width: 18px; height: 18px; }
.pv .bar1 b { color: #fff; font-size: 15px; }
.pv .bar1 .sp { justify-self: end; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 2px 7px; }
.pv .now { text-align: center; font-size: 38px; font-weight: 300; font-variant-numeric: tabular-nums; margin: 10px 0 0; }
.pv .chap { display: flex; justify-content: center; margin-top: 4px; }
.pv .chap span { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #fff; background: rgba(255,255,255,.14); border-radius: 14px; padding: 4px 8px 4px 12px; }
.pv .chap svg { width: 12px; height: 12px; opacity: .7; }
.pv .wv { position: relative; height: 56px; margin: 18px 0 0; display: flex; align-items: center; gap: 2px; }
.pv .wv i { flex: 1; border-radius: 1px; background: rgba(255,255,255,.25); }
.pv .wv i.p { background: var(--accent); }
.pv .head { position: absolute; top: -6px; bottom: -6px; width: 2px; background: #fff; }
.pv .head::after { content: ""; position: absolute; left: -6px; bottom: -7px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.pv .fl { position: absolute; top: -12px; width: 8px; height: 9px; background: var(--accent); clip-path: polygon(0 0,100% 0,100% 100%,50% 72%,0 100%); }
.pv .cuts { position: relative; height: 16px; margin-top: 10px; }
.pv .cuts span { position: absolute; top: 0; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); }
.pv .cuts span.on { background: rgba(255,255,255,.7); }
.pv .cuts small { position: absolute; top: 6px; font-size: 9px; color: rgba(255,255,255,.5); white-space: nowrap; }
.pv .ends { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; margin-top: 2px; }
.pv .ctl { display: flex; justify-content: center; align-items: center; gap: 34px; margin-top: 10px; color: #fff; }
.pv .ctl svg.sk { width: 34px; height: 34px; }
.pv .ctl .pp { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; gap: 5px; align-items: center; justify-content: center; }
.pv .ctl .pp i { width: 4px; height: 17px; background: #18181a; border-radius: 1px; }
.pv .cmh { font-size: 11px; color: var(--muted); padding: 10px 16px 2px; }
.pv .cm { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 2px 0 6px; }
.pv .c { display: flex; gap: 8px; align-items: baseline; padding: 5px 16px; line-height: 1.5; font-size: 13px; }
.pv .c .tm { flex: none; width: 36px; font-size: 11px; color: var(--accent-d); font-weight: 700; font-variant-numeric: tabular-nums; }
.pv .c .tx { flex: 1; min-width: 0; }
.pv .c.cur { background: var(--flash); }
.pv .c.old { opacity: .5; }
.pv .c.cg { font-size: 11px; color: var(--muted); font-weight: 700; padding-bottom: 0; }
.ipt { border-top: 1px solid var(--line); padding: 8px 10px 22px; display: flex; gap: 8px; align-items: center; background: var(--paper); }
.ipt .f { flex: 1; min-width: 0; height: 36px; border-radius: 18px; background: var(--soft); display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; }
.ipt .go { flex: none; background: var(--accent); color: #fff; font-weight: 700; border-radius: 18px; padding: 9px 14px; font-size: 13px; }
/* チャプターのメニュー：チップの真下に、暗い面になじむ形で */
.cmenu { position: absolute; left: 50%; top: 132px; transform: translateX(-50%); width: 236px; background: rgba(58,58,62,.97); border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,.45); overflow: hidden; z-index: 5; color: #fff; }
.cmenu::before { content: ""; position: absolute; }
.cmenu .o { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-size: 14px; border-top: .5px solid rgba(255,255,255,.12); }
.cmenu .o:first-child { border-top: 0; }
.cmenu .o .ck { width: 14px; flex: none; color: var(--accent); font-weight: 700; }
.cmenu .o .n { flex: 1; min-width: 0; }
.cmenu .o small { font-size: 11px; color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; }
.cmenu .o.new { color: var(--accent); }
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.18); z-index: 4; }
</style>

<div class="wrap">
<h1>レッスン画面：録音を下に、チャプターのメニュー</h1>

<h2 class="sec">レッスン画面の録音（画面の下にまとめる）</h2>
<p class="lead">録音はいつも画面の下に置く。録る前は大きな録音ボタン、録音中は下のパネル（時間と波形）、書いているあいだはキーボードの上の細い帯になる。録り終わったあとの置き場所は2案。</p>
<div class="phones" id="pl"></div>

<h2 class="sec">再生画面：チャプターのメニュー</h2>
<p class="lead">一覧を画面の真ん中に出していたのをやめて、チャプター名の真下に、暗い面になじむメニューとして出す。各チャプターの時間の範囲も添える。</p>
<div class="phones" id="pp"></div>
</div>

<script>
const play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>';
const right = '<svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const down = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const skip = (fwd) => '<svg class="sk" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (fwd ? ' style="transform:scaleX(-1)"' : '') + '><path d="M9 9.5A10 10 0 1 1 6 16"/><path d="M9 4v5.5h-5.5"/><text x="16" y="20" font-size="9" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none"' + (fwd ? ' transform="scale(-1,1) translate(-32,0)"' : '') + '>15</text></svg>';
const hs = [5,9,6,12,8,11,7,10,12,9,6,11,10,7,12,9,5,12,8,10,11,6,9,12,7,11,8,12,6,10,9,7,11,6,12,8,10,7,9,11,6,12,8,10];
const fr = ([b, p, html]) => '<div class="fr"><b>' + b + '</b><p>' + p + '</p><div class="scr">' + html + '</div></div>';

// ── レッスン画面 ──
const head = (date) => '<div class="nav"><span>‹ 戻る</span><span></span></div><div class="ttl"><b>' + (date || '11/17（月）') + '</b><span>バイオリン · ブライアン先生</span></div><div class="songs"><span>♪ ヴィヴァルディ 協奏曲 イ短調</span><span>♪ スケール</span></div>';
const row = (by, tx, t, live) => '<li class="li ' + (by === 'm' ? 'm' : '') + '"><span class="dot' + (by === 'm' ? ' m' : '') + '"></span><span class="tx">' + tx + '</span>' + (t ? '<span class="at' + (live ? ' live' : '') + '">' + t + '</span>' : '') + '</li>';
const empty = '<div class="h">やること</div><div class="gap"></div><div class="h">学んだこと</div><div class="gap"></div><div class="tk new">＋ 新しいトピック</div>';
const during = (insert) => '<div class="h">やること</div><div class="gap"></div><div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ 協奏曲</div><ul class="l">' + row('t', '冒頭の付点はもっと軽く', '7:02', true) + row('t', '弓は根元から', '19:20', true) + '</ul>' + (insert || '<div class="gap"></div><div class="tk new">＋ 新しいトピック</div>');
const full = '<div class="h">やること</div><ul class="l"><li class="li hw">ヴィヴァルディ 20〜36小節をゆっくり</li><li class="li hw">スケールをテンポ60で</li></ul><div class="gap"></div>' +
  '<div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ 協奏曲</div><ul class="l">' + row('t', '3ポジへの移動は親指を先に', '12:40') + row('m', '親指を意識すると音程が安定') + '</ul><div class="gap"></div>' +
  '<div class="tk">手首が固まってしまう</div><ul class="l">' + row('t', '肩を意識して動かす', '3:10') + '</ul>';
const liveWave = '<div class="lw">' + hs.slice(0, 36).map((h, i) => '<i class="' + (i > 30 ? 'q' : '') + '" style="height:' + (h * 2.6) + 'px"></i>').join('') + '</div>';
const L = [
  ['録る前', '画面の下に大きな録音ボタンだけ。押せばすぐ録音が始まる。',
    head('11/24（月）') + empty + '<div class="dockr"><span class="rbtn"><i></i></span><small>レッスンを録音</small></div>'],
  ['録音中', '下のパネルに時間と波形。停止ボタンも同じ場所。上の画面はそのまま書ける。',
    head('11/24（月）') + during() + '<div class="recp"><span class="st">● 録音中</span><span class="tm">24:31</span>' + liveWave + '<span class="rbtn stop"><i></i></span></div>'],
  ['録音中に書いているとき', 'キーボードが出ているあいだは、録音はキーボードの上の細い帯になる。書いた行には赤い時間が付く。',
    head('11/24（月）') + during('<div class="inl"><span class="dot"></span><span class="caret">左手は指板に近づける</span></div>') + '<div class="slim"><span class="r"></span><span class="t">録音中 24:31</span><span class="ok">完了</span></div><div class="kb"></div>'],
  ['録り終わり：案1 下にプレーヤー', '録音ボタンがあった場所が、そのままプレーヤーになる。録音はいつも下、と覚えればいい。タップで再生画面。',
    head() + full + '<div class="pbar"><span class="pb">' + play + '</span><div class="wv">' + hs.slice(0, 26).map((h) => '<i style="height:' + (h * 2) + 'px"></i>').join('') + '<b style="left:7%"></b><b style="left:26%"></b><b style="left:42%"></b><b style="left:69%"></b></div><span class="d">48:12</span></div>'],
  ['録り終わり：案2 上に1行だけ', '録音は日付の下に1行だけ。画面の下は空く。いちばんすっきりするが、録音中と置き場所が変わる。',
    head() + '<div class="rline"><span class="pb">' + play + '</span><span class="n">レッスン録音<small>48:12 · しおり4</small></span>' + right + '</div>' + full],
];

// ── 再生画面 ──
const chapters = [[0, 22, '手首'], [22, 64, '♪ ヴィヴァルディ'], [64, 100, '♪ スケール']];
const flagsAt = [7, 26, 42, 69];
function pv(now, pct, chapName, comments, extra) {
  const bars = hs.map((h, i) => '<i class="' + ((i + .5) / hs.length * 100 < pct ? 'p' : '') + '" style="height:' + (h * 4) + 'px"></i>').join('');
  const cuts = chapters.map(([a, b, n]) => '<span class="' + (pct >= a && pct < b ? 'on' : '') + '" style="left:calc(' + a + '% + 1px);width:calc(' + (b - a) + '% - 2px)"></span><small style="left:' + a + '%">' + n + '</small>').join('');
  return '<div class="pv"><div class="top"><div class="bar1"><span class="cl">' + down + '閉じる</span><b>11/17のレッスン</b><span class="sp">1.0x</span></div>' +
    '<div class="now">' + now + '</div><div class="chap"><span>' + chapName + chev + '</span></div>' +
    '<div class="wv">' + bars + flagsAt.map((x) => '<b class="fl" style="left:' + x + '%"></b>').join('') + '<b class="head" style="left:' + pct + '%"></b></div>' +
    '<div class="cuts">' + cuts + '</div><div class="ends"><span>0:00</span><span>48:12</span></div>' +
    '<div class="ctl">' + skip(false) + '<span class="pp"><i></i><i></i></span>' + skip(true) + '</div></div>' +
    '<div class="cmh">ここまでのしおり</div><div class="cm">' + comments + '</div>' +
    '<div class="ipt"><span class="f">16:05 にしおり（名前はなくてもいい）</span><span class="go">追加</span></div>' + (extra || '') + '</div>';
}
const c = (t, tx, cls) => '<div class="c ' + (cls || '') + '"><span class="tm">' + t + '</span><span class="tx">' + tx + '</span></div>';
const cg = (n) => '<div class="c cg">' + n + '</div>';
const cm = cg('手首が固まってしまう') + c('3:10', '肩を意識して動かすといい', 'old') + c('4:20', '弓を返すときに手首を固めない', 'old') + cg('♪ ヴィヴァルディ 協奏曲') + c('12:40', '3ポジへの移動は親指を先に動かす');
const menu = '<div class="dim"></div><div class="cmenu">' +
  [['手首が固まってしまう', '0:00–10:36'], ['♪ ヴィヴァルディ 協奏曲', '10:36–30:50', true], ['♪ スケール', '30:50–48:12'], ['トピックなし', '']].map(([n, r, on]) => '<div class="o"><span class="ck">' + (on ? '✓' : '') + '</span><span class="n">' + n + '</span><small>' + r + '</small></div>').join('') +
  '<div class="o new"><span class="ck">＋</span><span class="n">新しいトピック</span></div></div>';
const P = [
