<title>レッスン画面の書き方案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* メモ帳・C案にとらわれず、レッスン画面の作りを5通り。ほかのアプリの型を下敷きにしている */
:root {
  --page: #e9e9ee; --bg: #f6f5f2; --paper: #ffffff; --fg: #1c1c1e; --sub: #48484a; --muted: #8a8a8e; --line: #e4e2dc;
  --accent: #d29b00; --accent-d: #a87a00; --rec: #ff3b30; --rec-bg: #fff0ef; --teacher: #3a6ea5; --t-bg: #e8eff8; --me: #8a6500; --me-bg: #fff3c4;
  --hero: #fff3cc; --chip: #ffffff; --shade: rgba(0,0,0,.25); --dark: #1c1c1e; --on-dark: #fff;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #121214; --bg: #0e0e0f; --paper: #1c1c1e; --fg: #f2f2f7; --sub: #c7c7cc; --muted: #8e8e93; --line: #38383a;
  --rec-bg: #3a1614; --teacher: #7fb0e6; --t-bg: #1f2c3b; --me: #f0c040; --me-bg: #3a3014; --hero: #2e2810; --chip: #2c2c2e; --shade: rgba(0,0,0,.55); --dark: #f2f2f7; --on-dark: #1c1c1e; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #121214; --bg: #0e0e0f; --paper: #1c1c1e; --fg: #f2f2f7; --sub: #c7c7cc; --muted: #8e8e93; --line: #38383a;
  --rec-bg: #3a1614; --teacher: #7fb0e6; --t-bg: #1f2c3b; --me: #f0c040; --me-bg: #3a3014; --hero: #2e2810; --chip: #2c2c2e; --shade: rgba(0,0,0,.55); --dark: #f2f2f7; --on-dark: #1c1c1e; color-scheme: dark }
body { background: var(--page); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 24px; margin: 0 0 6px; }
.lead { color: var(--sub); font-size: 14px; line-height: 1.75; margin: 0 0 8px; max-width: 66ch; }
.v { display: grid; grid-template-columns: minmax(0, 270px) 1fr; gap: 24px; padding: 28px 0; border-top: 1px solid var(--line); }
@media (max-width: 760px) { .v { grid-template-columns: 1fr; } }
.v h2 { font-size: 19px; margin: 0 0 4px; }
.v h2 span { color: var(--accent-d); margin-right: 6px; }
.v .from { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.v p { margin: 0 0 10px; font-size: 14px; line-height: 1.7; }
.pc { font-size: 13px; line-height: 1.7; margin: 0; padding: 0; list-style: none; }
.pc li { padding-left: 1.3em; text-indent: -1.3em; }
.pc .g::before { content: "○ "; color: #34a853; }
.pc .b::before { content: "△ "; color: var(--rec); }
.phones { display: flex; flex-wrap: wrap; gap: 18px; }
.ph { width: 300px; max-width: 100%; }
.ph > small { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px 4px; }
.scr { position: relative; height: 620px; border-radius: 30px; border: 7px solid #1c1c1e; overflow: hidden; font-size: 14px; background: var(--bg); display: flex; flex-direction: column; }
.in { flex: 1; overflow: hidden; }
.src { font-size: 12px; color: var(--muted); margin-top: 30px; }
.src a { color: var(--accent-d); }

/* 共通 */
.nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 16px 0; color: var(--accent); font-size: 15px; }
.ttl { padding: 4px 20px 0; }
.ttl b { display: block; font-size: 23px; line-height: 1.3; }
.ttl span { color: var(--muted); font-size: 12px; }
.h { font-size: 13px; font-weight: 700; padding: 18px 20px 6px; display: flex; justify-content: space-between; align-items: baseline; }
.h small { color: var(--muted); font-weight: 400; font-size: 12px; }
ul { margin: 0; padding: 0; list-style: none; }
.li { display: flex; gap: 8px; align-items: baseline; padding: 5px 20px; line-height: 1.55; }
.li .tx { flex: 1; min-width: 0; }
.li.m .tx { color: var(--muted); }
.t { flex: none; font-size: 11px; color: var(--accent-d); font-weight: 700; font-variant-numeric: tabular-nums; width: 36px; }
.hw { font-size: 16px; font-weight: 700; }
.wave { height: 34px; display: flex; align-items: center; gap: 2px; }
.wave i { flex: 1; background: var(--muted); opacity: .45; border-radius: 1px; }
.pb { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.pb svg { width: 13px; height: 13px; }
.who { flex: none; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; line-height: 1.7; color: var(--teacher); background: var(--t-bg); }
.who.m { color: var(--me); background: var(--me-bg); }

/* 1 しおり */
.live { margin: 8px 16px 0; text-align: center; }
.live .tm { font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.live .st { color: var(--rec); font-size: 12px; font-weight: 700; }
.track { position: relative; margin: 10px 16px 0; }
.track .wave i { background: var(--rec); opacity: .55; }
.flags { position: absolute; inset: -6px 0 auto 0; height: 46px; pointer-events: none; }
.flags b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.flags b::before { content: ""; position: absolute; top: 0; left: 0; width: 9px; height: 7px; background: var(--accent); clip-path: polygon(0 0,100% 50%,0 100%); }
.track.done .wave i { background: var(--muted); }
.track.done .wave i.p { background: var(--accent); opacity: .9; }
.bm { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: 10px 14px 22px; display: flex; flex-direction: column; gap: 10px; }
.bm .row { display: flex; gap: 10px; align-items: center; }
.bm .stop { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; flex: none; }
.bm .stop i { width: 16px; height: 16px; border-radius: 3px; background: var(--rec); }
.bm .mark { flex: 1; height: 46px; border-radius: 23px; background: var(--accent); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; }
.bm .field { height: 36px; border-radius: 18px; background: var(--bg); display: flex; align-items: center; padding: 0 12px; color: var(--fg); font-size: 13px; gap: 6px; }

/* 2 ひとつの＋ */
.v2s .in { background: var(--paper); }
.v2s .h { color: var(--accent-d); font-size: 15px; padding: 20px 20px 4px; border-bottom: 1px solid var(--line); margin: 0 20px 4px; padding-left: 0; padding-right: 0; }
.v2s .tk { font-size: 12px; font-weight: 700; color: var(--sub); padding: 8px 20px 0; }
.ck { flex: none; width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--muted); align-self: center; }
.dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--teacher); align-self: center; margin: 0 5px; }
.dot.m { background: #e3b400; }
.mini { margin: 12px 20px 0; display: flex; align-items: center; gap: 10px; }
.mini .wave { height: 22px; flex: 1; }
.mini span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fab { position: absolute; right: 18px; bottom: 26px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 300; box-shadow: 0 6px 16px rgba(160,110,0,.35); }
.shade { position: absolute; inset: 0; background: var(--shade); }
.menu { position: absolute; right: 18px; bottom: 92px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.menu span { background: var(--paper); border-radius: 20px; padding: 9px 16px; font-weight: 600; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
.drop { margin: 2px 20px; height: 3px; border-radius: 2px; background: var(--accent); position: relative; }
.drop::before { content: ""; position: absolute; left: -4px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.ghost { position: absolute; right: 80px; top: 300px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 300; opacity: .9; box-shadow: 0 10px 22px rgba(160,110,0,.4); }

/* 3 宿題が主役 */
.as { margin: 10px 14px 0; background: var(--paper); border-radius: 18px; padding: 14px 16px 12px; }
.as .q { font-size: 16px; font-weight: 700; line-height: 1.45; }
.as .tips { margin: 8px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line); }
.as .tips div { font-size: 13px; color: var(--sub); line-height: 1.55; padding: 2px 0 2px 12px; position: relative; }
.as .tips div::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--teacher); }
.as .tips div.m::before { background: #e3b400; }
.as .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.as .days { display: flex; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
.as .days i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.as .days i.on { background: var(--accent); }
.as .go { font-size: 12px; font-weight: 700; color: var(--rec); background: var(--rec-bg); border-radius: 14px; padding: 5px 10px; }
.recline { margin: 8px 20px 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.recline .pb { width: 26px; height: 26px; }
.recline .pb svg { width: 10px; height: 10px; }

/* 4 曲ごとにめくる */
.tabs { display: flex; gap: 6px; padding: 12px 16px 0; overflow: hidden; white-space: nowrap; }
.tabs span { padding: 7px 13px; border-radius: 18px; background: var(--chip); font-size: 13px; font-weight: 600; color: var(--sub); }
.tabs span.on { background: var(--dark); color: var(--on-dark); }
.sheet4 { margin: 12px 14px 0; background: var(--paper); border-radius: 22px; padding: 16px 16px 10px; height: 330px; position: relative; }
.sheet4 .st { font-size: 18px; font-weight: 800; }
.sheet4 .ss { font-size: 12px; color: var(--muted); }
.sheet4 .hwb { margin: 12px 0 6px; background: var(--hero); border-radius: 12px; padding: 9px 12px; font-weight: 700; line-height: 1.5; }
.sheet4 .hwb small { display: block; font-size: 11px; color: var(--me); }
.sheet4 .li { padding: 5px 0; }
.sheet4 .act { position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; gap: 8px; }
.sheet4 .act span { flex: 1; text-align: center; padding: 9px; border-radius: 12px; background: var(--bg); font-size: 13px; font-weight: 600; color: var(--accent-d); }
.sheet4 .act span.r { color: var(--rec); }
.pager { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
.pager i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.pager i.on { background: var(--fg); }
.peek { position: absolute; right: -9px; top: 228px; width: 18px; height: 330px; border-radius: 22px 0 0 22px; background: var(--paper); opacity: .7; }

/* 5 会話 */
.pin { margin: 8px 12px 0; background: var(--hero); border-radius: 14px; padding: 9px 12px; }
.pin small { font-size: 11px; font-weight: 700; color: var(--me); }
.pin div { font-weight: 700; font-size: 14px; line-height: 1.5; }
.rp { margin: 8px 12px 0; display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 22px; padding: 4px 12px 4px 4px; }
.rp .wave { height: 18px; flex: 1; }
.rp span { font-size: 11px; color: var(--muted); }
.chat { padding: 8px 12px; display: flex; flex-direction: column; gap: 7px; }
.who5 { display: flex; gap: 6px; align-items: flex-end; }
.av { width: 26px; height: 26px; border-radius: 50%; background: var(--t-bg); color: var(--teacher); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.bb { background: var(--paper); border-radius: 16px 16px 16px 5px; padding: 8px 11px; line-height: 1.45; max-width: 78%; }
.bb .tt { display: block; font-size: 10px; color: var(--accent-d); font-weight: 700; }
.mb { align-self: flex-end; background: var(--me-bg); border-radius: 16px 16px 5px 16px; padding: 8px 11px; line-height: 1.45; max-width: 78%; }
.daydiv { align-self: center; font-size: 11px; color: var(--muted); }
.cmp { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: 8px 10px 20px; display: flex; gap: 6px; align-items: center; }
.cmp .tg { font-size: 11px; font-weight: 700; padding: 6px 8px; border-radius: 14px; background: var(--t-bg); color: var(--teacher); flex: none; }
.cmp .tg.hw { background: var(--bg); color: var(--muted); }
.cmp .f { flex: 1; height: 34px; border-radius: 17px; background: var(--bg); color: var(--muted); display: flex; align-items: center; padding: 0 12px; font-size: 13px; }
.cmp .mic { width: 34px; height: 34px; border-radius: 50%; background: var(--rec-bg); color: var(--rec); display: grid; place-items: center; flex: none; font-size: 14px; }
</style>

<div class="wrap">
<h1>レッスン画面：5つの考え方</h1>
<p class="lead">メモ帳やC案にとらわれず、レッスン画面の作りを考え直した。レッスン画面を使う場面は2つある。レッスン中に「書きとめる」場面と、練習の前に「何をやるか見る」場面。案ごとに、どちらを主役にするかが違う。どれもほかのアプリの型を下敷きにしている。</p>
<div id="vs"></div>
<p class="src">参考：<a href="https://culturedcode.com/things/support/articles/2803582/">Things 3 のMagic Plus</a> ／ <a href="https://leilaviss.com/blog/transition-from-tonara-to-practice-space">Practice Space（Tonaraからの移行）</a> ／ <a href="https://colourfulkeys.ie/piano-practice-apps/">ピアノの練習アプリ比較</a> ／ <a href="https://apps.apple.com/us/app/otter-ai-voice-notes/id1276437113">Otter</a></p>
</div>

<script>
const play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const hs = [5,9,6,12,8,14,7,10,16,9,6,11,13,7,15,9,5,12,8,10,14,6,9,13,7,11,8,15,6,10,12,7,9,14,8,6,11,9,13,7];
const wave = (n, playedTo) => '<div class="wave">' + hs.slice(0, n || 40).map((h, i) => '<i class="' + (playedTo != null && i < playedTo ? 'p' : '') + '" style="height:' + (h * 2) + 'px"></i>').join('') + '</div>';
const nav = (r) => '<div class="nav"><span>‹ 戻る</span><span style="font-weight:600">' + (r || '') + '</span></div>';
const ttl = '<div class="ttl"><b>11/17（月）</b><span>バイオリン · ブライアン先生</span></div>';
const flags = (ps) => '<div class="flags">' + ps.map((p) => '<b style="left:' + p + '%"></b>').join('') + '</div>';

const V = [
  { n: '1', name: '録音にしおりを挟む', from: '下敷き：iPhoneのボイスメモ、Otter（文字をタップするとその位置から再生）',
    desc: 'レッスン画面の主役を録音にする。レッスン中は大きな「しおり」ボタンを押すだけで、その瞬間に印が付く。言葉は書いても書かなくてもいい。あとで印をタップすると、先生の説明をそこから聞き直せる。',
    pc: [['g', 'レッスン中に文字を打たなくていい。弓を持ったままでも押せる'], ['g', '40〜50分の録音から説明を探す手間がなくなる'], ['b', '録音しないレッスンでは使いどころがない'], ['b', '言葉を書かなかったしおりは、あとで聞かないと中身が分からない']],
    frames: [['レッスン中', '<div class="in">' + nav() + '<div class="live"><div class="st">● 録音中</div><div class="tm">24:31</div></div><div class="track">' + wave() + flags([7, 26, 52]) + '</div>' +
      '<div class="h" style="padding-top:20px">しおり<small>3</small></div><ul>' +
      '<li class="li"><span class="t">20:15</span><span class="tx">弓を多めに</span></li><li class="li"><span class="t">12:40</span><span class="tx">親指を先に動かす</span></li><li class="li"><span class="t">3:10</span><span class="tx" style="color:var(--muted)">（言葉なし）</span></li></ul></div>' +
      '<div class="bm"><div class="field">ひとこと（なくてもいい）</div><div class="row"><span class="stop"><i></i></span><span class="mark">しおりを挟む</span></div></div>'],
      ['終わったあと', '<div class="in">' + nav('編集') + ttl + '<div class="track done" style="margin-top:14px">' + wave(40, 11) + flags([7, 26, 52, 70]) + '</div>' +
      '<div style="display:flex;justify-content:space-between;margin:4px 16px 0;font-size:11px;color:var(--muted)"><span>12:40</span><span>48:12</span></div>' +
      '<div class="h">宿題</div><ul><li class="li hw">ヴィヴァルディ 20〜36小節をゆっくり</li><li class="li hw">スケールをテンポ60で</li></ul>' +
      '<div class="h">しおり</div><ul><li class="li"><span class="t">3:10</span><span class="tx">肩を意識して動かすといい</span></li><li class="li" style="background:var(--hero)"><span class="t">12:40</span><span class="tx">3ポジへの移動は親指を先に動かす</span></li><li class="li"><span class="t">25:05</span><span class="tx">20小節目からは弓を多めに</span></li><li class="li m"><span class="t">33:30</span><span class="tx">移弦の前に左手を準備</span></li></ul></div>']] },

  { n: '2', name: 'ひとつの＋で書く', from: '下敷き：Things 3 の「Magic Plus」（＋を押すか、入れたい場所までドラッグする）',
    desc: '画面には読むものだけを並べ、書く入口は右下の＋ひとつにする。押すと「宿題・学んだこと・題」を選べる。＋を入れたい場所までドラッグすると、その位置に行が入る。白一色で、見出しは色の文字と細い線だけ。',
    pc: [['g', '書く場所がひとつに決まっていて、普段の画面はすっきり'], ['g', 'ドラッグで「この題の下に」が1動作でできる'], ['b', 'ドラッグはあることに気づきにくい（押すだけでも使えるようにする）'], ['b', 'レッスン中に続けて書くときは、毎回＋を押す']],
    frames: [['普段', '<div class="in">' + nav() + ttl + '<div class="mini"><span class="pb">' + play + '</span>' + wave(30) + '<span>48:12</span></div>' +
      '<div class="h">宿題</div><ul><li class="li hw">ヴィヴァルディ 20〜36小節をゆっくり</li><li class="li hw">スケールをテンポ60で</li></ul>' +
      '<div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ</div><ul><li class="li"><span class="dot"></span><span class="tx">3ポジへの移動は親指を先に</span></li><li class="li m"><span class="dot m"></span><span class="tx">親指を意識すると音程が安定</span></li></ul><div class="tk">手首が固まってしまう</div><ul><li class="li"><span class="dot"></span><span class="tx">肩を意識して動かす</span></li></ul></div><span class="fab">＋</span>'],
      ['＋をドラッグしているところ', '<div class="in">' + nav() + ttl + '<div class="mini"><span class="pb">' + play + '</span>' + wave(30) + '<span>48:12</span></div>' +
      '<div class="h">宿題</div><ul><li class="li hw">ヴィヴァルディ 20〜36小節をゆっくり</li><li class="li hw">スケールをテンポ60で</li></ul>' +
      '<div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ</div><ul><li class="li"><span class="dot"></span><span class="tx">3ポジへの移動は親指を先に</span></li><li class="li m"><span class="dot m"></span><span class="tx">親指を意識すると音程が安定</span></li></ul><div class="drop"></div><div class="tk">手首が固まってしまう</div><ul><li class="li"><span class="dot"></span><span class="tx">肩を意識して動かす</span></li></ul></div><span class="ghost">＋</span>'],
      ['＋を押したところ', '<div class="in">' + nav() + ttl + '<div class="h">宿題</div><ul><li class="li hw">ヴィヴァルディ 20〜36小節</li></ul></div><div class="shade"></div><div class="menu"><span>宿題</span><span>学んだこと</span><span>題</span></div><span class="fab">×</span>']] },
