<title>レッスン画面の書き方案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 普段の画面で「どこに書くか」を直感的にする4案。どれも選ぶ操作をなくすか、1回にする */
:root {
  --page: #e9e9ee; --paper: #ffffff; --soft: #f4f3ef; --fg: #1c1c1e; --sub: #48484a; --muted: #8a8a8e; --faint: #c4c4c7; --line: #e8e6e0;
  --accent: #d29b00; --accent-d: #a87a00; --teacher: #3a6ea5; --me-dot: #e3b400; --flash: #fff3cc; --shade: rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #121214; --paper: #1c1c1e; --soft: #2a2a2c; --fg: #f2f2f7; --sub: #c7c7cc; --muted: #8e8e93; --faint: #48484a; --line: #38383a;
  --teacher: #7fb0e6; --flash: #3a3014; --shade: rgba(0,0,0,.55); color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #121214; --paper: #1c1c1e; --soft: #2a2a2c; --fg: #f2f2f7; --sub: #c7c7cc; --muted: #8e8e93; --faint: #48484a; --line: #38383a;
  --teacher: #7fb0e6; --flash: #3a3014; --shade: rgba(0,0,0,.55); color-scheme: dark }
body { background: var(--page); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 24px; margin: 0 0 6px; }
.lead { color: var(--sub); font-size: 14px; line-height: 1.75; margin: 0 0 8px; max-width: 72ch; }
.v { display: grid; grid-template-columns: minmax(0, 270px) 1fr; gap: 24px; padding: 28px 0; border-top: 1px solid var(--line); }
@media (max-width: 760px) { .v { grid-template-columns: 1fr; } }
.v h2 { font-size: 19px; margin: 0 0 4px; }
.v h2 span { color: var(--accent-d); margin-right: 6px; }
.v .from { font-size: 12px; color: var(--muted); margin: 0 0 10px; line-height: 1.6; }
.v p { margin: 0 0 10px; font-size: 14px; line-height: 1.7; }
.pc { font-size: 13px; line-height: 1.7; margin: 0; padding: 0; list-style: none; }
.pc li { padding-left: 1.3em; text-indent: -1.3em; }
.pc .g::before { content: "○ "; color: #34a853; }
.pc .b::before { content: "△ "; color: #ff3b30; }
.phones { display: flex; flex-wrap: wrap; gap: 18px; }
.fr { width: 290px; max-width: 100%; }
.fr > small { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px 4px; }
.scr { position: relative; height: 600px; border-radius: 30px; border: 7px solid #1c1c1e; overflow: hidden; font-size: 14px; background: var(--paper); }
.src { font-size: 12px; color: var(--muted); margin-top: 24px; line-height: 1.8; }
.src a { color: var(--accent-d); }

.nav { display: flex; justify-content: space-between; padding: 30px 16px 0; color: var(--accent); font-size: 15px; }
.ttl { padding: 4px 20px 0; }
.ttl b { display: block; font-size: 22px; line-height: 1.3; }
.ttl span { color: var(--muted); font-size: 12px; }
.h { margin: 16px 20px 2px; padding-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--accent-d); font-size: 15px; font-weight: 700; }
ul.l { margin: 0; padding: 0; list-style: none; }
.li { display: flex; gap: 8px; align-items: baseline; padding: 5px 20px; line-height: 1.55; }
.li .tx { flex: 1; min-width: 0; }
.li.m .tx { color: var(--sub); }
.dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--teacher); align-self: center; margin-right: 4px; }
.dot.m { background: var(--me-dot); }
.at { flex: none; font-size: 11px; color: var(--accent-d); font-weight: 700; font-variant-numeric: tabular-nums; }
.hw { font-size: 16px; font-weight: 700; }
.tk { font-size: 12px; font-weight: 700; color: var(--sub); padding: 8px 20px 0; }
.gap { height: 30px; margin: 0 20px; }
.gap.tap { border-radius: 8px; background: var(--flash); position: relative; }
.finger { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: rgba(210,155,0,.35); border: 2px solid var(--accent); }
.inl { display: flex; align-items: center; gap: 8px; padding: 6px 20px; background: var(--flash); }
.inl .caret { flex: 1; font-size: 14px; }
.inl .caret::after { content: "｜"; color: var(--accent); }
.inl.hwi .caret { font-size: 16px; font-weight: 700; }
.kb { position: absolute; left: 0; right: 0; bottom: 0; height: 180px; background: var(--soft); border-top: 1px solid var(--line); }
.kb .bar { display: flex; justify-content: space-between; padding: 8px 14px; font-size: 13px; color: var(--accent-d); font-weight: 600; background: var(--paper); border-bottom: 1px solid var(--line); }
.fab { position: absolute; right: 16px; bottom: 22px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 300; box-shadow: 0 6px 16px rgba(160,110,0,.35); }
.hint { margin: 10px 20px 0; font-size: 11px; color: var(--muted); }
/* B 下の入力欄 */
.dock { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: 8px 10px 20px; display: flex; gap: 6px; align-items: center; }
.dock .f { flex: 1; height: 36px; border-radius: 18px; background: var(--soft); display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-size: 13px; }
.dock .f.on { color: var(--fg); }
.dock .go { background: var(--accent); color: #fff; font-weight: 700; border-radius: 18px; padding: 9px 13px; font-size: 13px; }
.inbox { margin: 12px 14px 0; border-radius: 12px; background: var(--soft); padding: 6px 0 4px; }
.inbox .k { font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 12px 2px; display: flex; justify-content: space-between; }
.inbox .li { padding: 5px 12px; }
.inbox .mv { flex: none; font-size: 11px; color: var(--accent-d); font-weight: 700; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; background: var(--paper); }
/* C トピックを開く */
.tl { margin: 0 14px; }
.trow { display: flex; align-items: center; gap: 10px; padding: 11px 6px; border-bottom: 1px solid var(--line); }
.trow .n { flex: 1; min-width: 0; }
.trow .n b { display: block; font-size: 15px; }
.trow .n small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .c { font-size: 12px; color: var(--muted); }
.trow svg { width: 14px; height: 14px; color: var(--faint); flex: none; }
.addt { color: var(--accent); font-size: 14px; padding: 11px 6px; }
.big { padding: 4px 20px 0; font-size: 22px; font-weight: 800; }
.sub { padding: 0 20px; font-size: 12px; color: var(--muted); }
/* D 行から続ける */
.li.edit { background: var(--flash); }
.li.edit .tx::after { content: "｜"; color: var(--accent); }
.menu { position: absolute; right: 16px; bottom: 82px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.menu span { background: var(--paper); border-radius: 20px; padding: 9px 16px; font-weight: 600; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
.shade { position: absolute; inset: 0; background: var(--shade); }
</style>

<div class="wrap">
<h1>レッスン画面：書く場所の4案</h1>
<p class="lead">前の案（＋を押してから行き先を選ぶ）は、書く前に1手間あって直感的でなかった。よく使われているアプリが「どこに足すか」をどう決めているかを調べて、選ぶ操作をなくすか1回だけにした4案。</p>
<div id="vs"></div>
<p class="src">調べたもの：
<a href="https://www.todoist.com/help/articles/use-the-dynamic-add-button-in-todoist-ysybl2M1">Todoist の追加ボタン（ドラッグで場所を決める）</a> ／
<a href="https://www.engadget.com/2019/10/22/todoist-foundations-update/">Todoist が右下の大きな＋をやめた経緯</a> ／
<a href="https://piunikaweb.com/2024/03/20/how-to-create-a-checklist-in-google-keep">Google Keep（一覧の最後の「＋ 項目」から書き、Enterで次の行）</a> ／
<a href="https://iphone-mania.jp/manual/convenient-392866/">iPhone のリマインダー</a></p>
</div>

<script>
const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const head = '<div class="nav"><span>‹ 戻る</span><span></span></div><div class="ttl"><b>11/17（月）</b><span>バイオリン · ブライアン先生</span></div>';
const row = (by, tx, t, cls) => '<li class="li ' + (by === 'm' ? 'm ' : '') + (cls || '') + '"><span class="dot' + (by === 'm' ? ' m' : '') + '"></span><span class="tx">' + tx + '</span>' + (t ? '<span class="at">' + t + '</span>' : '') + '</li>';
const hwRows = '<li class="li hw">ヴィヴァルディ 20〜36小節をゆっくり</li><li class="li hw">スケールをテンポ60で</li>';
const vivRows = row('t', '3ポジへの移動は親指を先に', '12:40') + row('m', '親指を意識すると音程が安定', '');
const wriRows = row('t', '肩を意識して動かす', '3:10');
const kb = (bar) => '<div class="kb">' + (bar ? '<div class="bar">' + bar + '</div>' : '') + '</div>';

const V = [
  { n: 'A', name: '空いたところをタップして書く', from: '下敷き：iPhoneのリマインダー、Google Keep（一覧の最後に書く場所があり、Enterで次の行）',
    desc: '＋ボタンは置かない。やることや各トピックのいちばん下の余白をタップすると、そこに新しい行が出る。Enterで同じ場所に続けて書ける。新しいトピックだけは一番下の「新しいトピック」から作る。',
    pc: [['g', '書きたい場所を直接さわるだけ。選ぶ操作がない'], ['g', 'ボタンが増えないので画面がすっきりしたまま'], ['b', '余白をさわれると気づきにくい（最初だけ案内を出す）']],
    f: [['普段', head + '<div class="h">やること</div><ul class="l">' + hwRows + '</ul><div class="gap"></div><div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ 協奏曲</div><ul class="l">' + vivRows + '</ul><div class="gap"></div><div class="tk">手首が固まってしまう</div><ul class="l">' + wriRows + '</ul><div class="gap"></div><div class="tk" style="color:var(--accent);font-weight:600">＋ 新しいトピック</div>'],
      ['ヴィヴァルディの下の余白をタップ', head + '<div class="h">やること</div><ul class="l">' + hwRows + '</ul><div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ 協奏曲</div><ul class="l">' + vivRows + '</ul><div class="inl"><span class="dot"></span><span class="caret">冒頭の付点はもっと軽く</span></div><div class="tk">手首が固まってしまう</div><ul class="l">' + wriRows + '</ul>' + kb('<span></span><span>完了</span>')]] },

  { n: 'B', name: '下の入力欄に書いて、あとで仕分ける', from: '下敷き：Microsoft To Do や LINE の、画面下にいつもある入力欄',
    desc: '画面の下にいつも入力欄がある。書いたものはまず上の「未整理」にたまる。あとで各行の「移す」からやることやトピックへ。書くときに何も考えなくていい。',
    pc: [['g', '書くのはいちばん気楽。レッスン直後のメモ書きに向く'], ['g', '入力欄が見えているので迷わない'], ['b', '仕分けを忘れると「未整理」がたまる'], ['b', '入力欄のぶん、画面が少し狭くなる']],
    f: [['普段（未整理が2つある）', head + '<div class="inbox"><div class="k"><span>未整理</span><span>2</span></div><ul class="l">' + '<li class="li"><span class="tx">冒頭の付点はもっと軽く</span><span class="mv">移す</span></li><li class="li"><span class="tx">カイザー8番をテンポ72で</span><span class="mv">移す</span></li></ul></div>' +
      '<div class="h">やること</div><ul class="l">' + hwRows + '</ul><div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ 協奏曲</div><ul class="l">' + vivRows + '</ul>' +
      '<div class="dock"><span class="f">メモ</span><span class="go">追加</span></div>']] },

  { n: 'C', name: 'トピックを開いて、その中で書く', from: '下敷き：iPhoneのリマインダー（リストを開いて、その中に足す）、メッセージアプリ',
    desc: 'レッスン画面にはやることとトピックの一覧だけを置く。トピックをタップするとそのトピックのページが開き、下の入力欄に書くだけで、そのトピックに入る。1つの画面に書く場所が1つしかない。',
    pc: [['g', '開いたトピックに書くので、行き先を選ぶ必要がない'], ['g', '1画面あたりの情報が少なくシンプル'], ['b', 'レッスン画面で学んだことの中身が一目で見えない（先頭の1行だけ）'], ['b', '画面の行き来が1回増える']],
    f: [['レッスン画面', head + '<div class="h">やること</div><ul class="l">' + hwRows + '</ul><div class="h">学んだこと</div><div class="tl">' +
      [['♪ ヴィヴァルディ 協奏曲', '3ポジへの移動は親指を先に', 3], ['手首が固まってしまう', '肩を意識して動かす', 2], ['♪ スケール', '移弦の前に左手を準備', 1]].map(([t, s, c]) => '<div class="trow"><span class="n"><b>' + t + '</b><small>' + s + '</small></span><span class="c">' + c + '</span>' + chev + '</div>').join('') +
      '<div class="addt">＋ 新しいトピック</div></div>'],
      ['♪ ヴィヴァルディ を開いたところ', '<div class="nav"><span>‹ 11/17</span><span></span></div><div class="big">♪ ヴィヴァルディ 協奏曲</div><div class="sub">11/17（月）のレッスン</div><ul class="l" style="margin-top:12px">' + vivRows + row('t', '20小節目からは弓を多めに', '20:15') + '</ul>' +
      '<div class="dock"><span class="f on">冒頭の付点はもっと軽く｜</span><span class="go">追加</span></div>']] },

  { n: 'D', name: '行のあとに続けて書く', from: '下敷き：iPhoneのメモ、Notion（行の終わりでEnterを押すと次の行）',
    desc: '書いてある行をタップして直している途中でEnterを押すと、すぐ下に新しい行ができる。同じトピックに続けて書くのはこれだけでいい。右下の＋は「やること」と「新しいトピック」を始めるときだけ使う。',
    pc: [['g', 'メモ帳と同じ感覚で、続きを書くのが自然'], ['g', '＋を押す回数が少ない'], ['b', 'まだ何も書いていないトピックには、＋から始める必要がある'], ['b', '「Enterで次の行」を知らないと使いにくい']],
    f: [['行の終わりでEnter', head + '<div class="h">やること</div><ul class="l">' + hwRows + '</ul><div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ 協奏曲</div><ul class="l">' + row('t', '3ポジへの移動は親指を先に', '12:40') + row('m', '親指を意識すると音程が安定') + row('t', '冒頭の付点はもっと軽く', '', 'edit') + '</ul><div class="tk">手首が固まってしまう</div><ul class="l">' + wriRows + '</ul>' + kb('<span></span><span>完了</span>')],
      ['＋を押したとき', head + '<div class="h">やること</div><ul class="l">' + hwRows + '</ul><div class="h">学んだこと</div><div class="tk">♪ ヴィヴァルディ 協奏曲</div><ul class="l">' + vivRows + '</ul><div class="shade"></div><div class="menu"><span>やることを書く</span><span>新しいトピック</span></div><span class="fab">×</span>']] },
];
document.getElementById('vs').innerHTML = V.map((v) =>
  '<section class="v"><div><h2><span>' + v.n + '</span>' + v.name + '</h2><div class="from">' + v.from + '</div><p>' + v.desc + '</p><ul class="pc">' + v.pc.map(([c, t]) => '<li class="' + c + '">' + t + '</li>').join('') + '</ul></div>' +
  '<div class="phones">' + v.f.map(([cap, html]) => '<div class="fr"><small>' + cap + '</small><div class="scr">' + html + '</div></div>').join('') + '</div></section>').join('');
</script>
