<title>レッスン画面の書き方案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* C案（普段は読むだけ・「編集」で書く）を、カードを減らした見た目3通りで。並びは 録音 → 宿題 → 学んだこと → 個人練 */
:root {
  --page: #e9e9ee; --bg: #f2f2f7; --paper: #ffffff; --warm: #fbfaf5; --fg: #1c1c1e; --sub: #48484a; --muted: #8a8a8e; --line: #e2e2e6; --rule: #e9e4d6;
  --accent: #d29b00; --accent-d: #a87a00; --rec: #ff3b30; --teacher: #3a6ea5; --t-bg: #e6eef7; --me: #8a6500; --me-bg: #fff3c4;
  --hero: #fff6d6; --mark: #ffe68a; --dot-m: #e3b400; --chip: #ffffff;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #121214; --bg: #000; --paper: #1c1c1e; --warm: #1b1a17; --fg: #f2f2f7; --sub: #c7c7cc; --muted: #8e8e93; --line: #38383a; --rule: #34312a;
  --teacher: #7fb0e6; --t-bg: #1f2c3b; --me: #f0c040; --me-bg: #3a3014; --hero: #2e2810; --mark: #6b5510; --chip: #2c2c2e; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #121214; --bg: #000; --paper: #1c1c1e; --warm: #1b1a17; --fg: #f2f2f7; --sub: #c7c7cc; --muted: #8e8e93; --line: #38383a; --rule: #34312a;
  --teacher: #7fb0e6; --t-bg: #1f2c3b; --me: #f0c040; --me-bg: #3a3014; --hero: #2e2810; --mark: #6b5510; --chip: #2c2c2e; color-scheme: dark }
body { background: var(--page); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 24px; margin: 0 0 6px; }
.lead { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 0 0 24px; max-width: 64ch; }
.v { display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 24px; padding: 28px 0; border-top: 1px solid var(--line); }
@media (max-width: 760px) { .v { grid-template-columns: 1fr; } }
.v h2 { font-size: 19px; margin: 0 0 8px; }
.v h2 span { color: var(--accent-d); margin-right: 6px; }
.v p { margin: 0 0 10px; font-size: 14px; line-height: 1.7; }
.phones { display: flex; flex-wrap: wrap; gap: 18px; }
.ph { width: 300px; max-width: 100%; }
.ph > small { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px 4px; }
.scr { position: relative; height: 640px; border-radius: 30px; border: 7px solid #1c1c1e; overflow: hidden; font-size: 14px; background: var(--bg); }
.in { height: 100%; overflow-y: auto; padding-bottom: 30px; }

/* ── 共通の骨組み ── */
.nav { display: flex; justify-content: space-between; padding: 30px 16px 0; color: var(--accent); font-size: 15px; }
.ttl { padding: 6px 20px 0; }
.ttl b { display: block; font-size: 24px; line-height: 1.3; }
.ttl span { color: var(--muted); font-size: 12px; }
.songs { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px 0; font-size: 12px; }
.songs span { color: var(--sub); }
.songs .ed { color: var(--accent); }
.h { font-size: 13px; font-weight: 700; padding: 22px 20px 6px; display: flex; justify-content: space-between; align-items: baseline; }
.h small { color: var(--muted); font-weight: 400; font-size: 12px; }
ul { margin: 0; padding: 0; list-style: none; }
.list { padding: 0 20px; }
.it { position: relative; display: flex; gap: 8px; align-items: baseline; padding: 4px 0; line-height: 1.55; }
.it .tx { flex: 1; min-width: 0; }
.it.m .tx { color: var(--muted); }
.it .me { font-size: 10px; color: var(--me); background: var(--me-bg); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
.it .at { flex: none; font-size: 11px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.tk { font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 0 2px; }
.tk:first-child { padding-top: 0; }
.hw .it { font-size: 16px; font-weight: 700; padding: 5px 0; }
.rec { margin: 14px 20px 0; display: flex; align-items: center; gap: 10px; }
.rec .pb { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.rec .pb svg { width: 14px; height: 14px; }
.rec .wv { flex: 1; height: 22px; background: repeating-linear-gradient(90deg, var(--muted) 0 2px, transparent 2px 5px); opacity: .45; -webkit-mask: linear-gradient(90deg, #000 0 100%); border-radius: 2px; clip-path: polygon(0 40%,5% 20%,10% 55%,15% 10%,20% 45%,25% 25%,30% 60%,35% 15%,40% 50%,45% 30%,50% 5%,55% 45%,60% 20%,65% 55%,70% 25%,75% 40%,80% 10%,85% 50%,90% 30%,95% 45%,100% 20%,100% 100%,0 100%); }
.rec .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pr .it { font-size: 13px; }
.pr .it .dt { flex: none; width: 34px; color: var(--muted); font-variant-numeric: tabular-nums; }
.addpr { color: var(--accent); font-size: 13px; padding: 6px 0; }
/* 編集のとき */
.minus { flex: none; align-self: center; width: 18px; height: 18px; border-radius: 50%; background: var(--rec); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; line-height: 1; }
.grip { flex: none; align-self: center; color: var(--muted); font-size: 14px; }
.who { flex: none; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; line-height: 1.7; color: var(--teacher); background: var(--t-bg); }
.who.m { color: var(--me); background: var(--me-bg); }
.add { display: flex; align-items: center; gap: 8px; padding: 6px 0; color: var(--accent); font-size: 14px; }
.add b { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; line-height: 1; flex: none; }
.add.tp { font-weight: 600; padding-top: 10px; }
.edit .it.m .tx { color: var(--fg); }

/* ── 1：ノート ── 画面全体を白い紙1枚。線も枠もなく、見出しと「・」だけ */
.v1 { background: var(--paper); }
.v1 .it:not(.ed)::before { content: "・"; flex: none; color: var(--muted); margin-right: -6px; }
.v1 .hw .it::before { color: var(--accent); }
.v1 .h { color: var(--fg); font-size: 15px; }

/* ── 2：罫線ノート ── あたたかい白に罫線。宿題は蛍光ペン */
.v2 { background: var(--warm); }
.v2 .h { font-size: 12px; color: var(--muted); letter-spacing: .08em; border-bottom: 1.5px solid var(--fg); margin: 0 20px; padding: 22px 0 4px; }
.v2 .list .it { border-bottom: 1px solid var(--rule); padding: 7px 0; }
.v2 .hw .tx span { background: linear-gradient(transparent 58%, var(--mark) 58%); }
.v2 .tk { padding-top: 12px; color: var(--fg); }
.v2 .add { border-bottom: 1px solid var(--rule); padding: 8px 0; }

/* ── 3：やわらか ── 灰色の地。宿題だけホームと同じ黄色の面。学んだことは色の点で先生/自分 */
.v3 { background: var(--bg); }
.v3 .hwbox { margin: 18px 12px 0; padding: 4px 8px 10px; background: var(--hero); border-radius: 16px; }
.v3 .hwbox .h { color: var(--me); padding-top: 12px; }
.v3 .list.lr .it:not(.ed) { padding-left: 14px; }
.v3 .list.lr .it:not(.ed)::before { content: ""; position: absolute; left: 1px; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--teacher); }
.v3 .list.lr .it.m:not(.ed)::before { background: var(--dot-m); }
.v3 .it .me { display: none; }
.v3 .lgd { font-size: 11px; color: var(--muted); font-weight: 400; display: flex; gap: 10px; }
.v3 .lgd i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--teacher); margin-right: 4px; vertical-align: 1px; }
.v3 .lgd i.m { background: var(--dot-m); }
.v3 .songs span { background: var(--chip); border-radius: 12px; padding: 3px 9px; }
.v3 .rec { background: var(--chip); border-radius: 22px; padding: 5px 14px 5px 5px; margin: 14px 12px 0; }
</style>

<div class="wrap">
<h1>レッスン画面：C案を見た目3通りで</h1>
<p class="lead">普段は読むだけで、右上の「編集」を押したときだけ追加・並べ替え・削除が出る。並びは 録音 → 宿題 → 学んだこと → 個人練。白いカードをやめて、ノートやメモのように見せる方向で3通り。左が普段、右が「編集」を押したところ。</p>
<div id="vs"></div>
</div>

<script>
const L = {
  date: '11/17（月）', sub: 'バイオリン · ブライアン先生', songs: ['ヴィヴァルディ 協奏曲 イ短調', 'スケール'], dur: '48:12',
  hw: ['ヴィヴァルディ 20〜36小節をゆっくり', 'スケールは3オクターブをテンポ60で'],
  topics: [
    ['♪ ヴィヴァルディ 協奏曲 イ短調', [['t', '3ポジへの移動は親指を先に動かす', '12:40'], ['t', '20小節目からは弓を多めに使ってフレーズを大きく', '25:05'], ['m', '親指を意識すると音程が安定する気がする', '39:50']]],
    ['手首が固まってしまう', [['t', '肩を意識して動かすといい', '3:10'], ['t', '弓を返すときに手首を固めない', '4:20']]],
    ['♪ スケール', [['t', '移弦の前に左手を準備', '33:30']]],
  ],
  pr: [['11/18', 'テンポ60で通せた', 'ヴィヴァルディ']],
};
const V = [
  ['1', 'ノート', '画面全体を白い紙1枚にして、枠も線もなくす。見出しと「・」だけで並べる。自分の気づきは灰色の文字と小さな「自分」。いちばん素朴。'],
  ['2', '罫線ノート', '少しあたたかい白に、ノートの罫線。見出しの下に太めの線。宿題は蛍光ペンを引いたように見せる。紙のノートに近い。'],
  ['3', 'やわらか', '灰色の地はそのままで、宿題だけホームと同じ黄色の面にする。学んだことは先生=青・自分=黄の点で見分ける（ホームの案と同じ）。録音と曲は丸いタグ。'],
];
const play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
function screen(v, edit) {
  const row = (tx, extra) => edit ? '<li class="it ed"><span class="minus">−</span>' + (extra || '') + '<span class="tx">' + tx + '</span><span class="grip">≡</span></li>' : '';
  const add = (t) => edit ? '<li class="add' + (t ? ' tp' : '') + '"><b>＋</b>' + (t || '追加') + '</li>' : '';
  const hwItems = L.hw.map((x) => edit ? row(x) : '<li class="it"><span class="tx"><span>' + x + '</span></span></li>').join('') + add();
  const hwSec = '<div class="h">宿題' + (edit ? '<small>並べ替え・削除</small>' : '') + '</div><ul class="list hw">' + hwItems + '</ul>';
  const lr = L.topics.map(([tk, ns]) => '<li class="tk">' + tk + '</li>' + ns.map(([by, tx, at]) => edit
    ? row(tx, '<span class="who ' + by + '">' + (by === 't' ? '先生' : '自分') + '</span>')
    : '<li class="it ' + by + '"><span class="tx">' + tx + (by === 'm' ? '<span class="me">自分</span>' : '') + '</span><span class="at">▶ ' + at + '</span></li>').join('') + add()).join('') + add('題を追加');
  const lgd = v === '3' && !edit ? '<span class="lgd"><span><i></i>先生</span><span><i class="m"></i>自分</span></span>' : '';
  return '<div class="scr v' + v + (edit ? ' edit' : '') + '"><div class="in">' +
    '<div class="nav"><span>' + (edit ? '' : '‹ 戻る') + '</span><span style="font-weight:600">' + (edit ? '完了' : '編集') + '</span></div>' +
    '<div class="ttl"><b>' + L.date + '</b><span>' + L.sub + '</span></div>' +
    '<div class="songs">' + L.songs.map((s) => '<span>♪ ' + s + '</span>').join('') + (edit ? '<span class="ed">曲を編集</span>' : '') + '</div>' +
    '<div class="rec"><span class="pb">' + play + '</span><span class="wv"></span><span class="d">' + L.dur + '</span></div>' +
    (v === '3' ? '<div class="hwbox">' + hwSec + '</div>' : hwSec) +
    '<div class="h">学んだこと' + lgd + '</div><ul class="list lr">' + lr + '</ul>' +
    '<div class="h">このレッスン後の個人練</div><ul class="list pr">' + L.pr.map(([d, n, s]) => '<li class="it"><span class="dt">' + d + '</span><span class="tx">' + n + '<br><small style="color:var(--muted)">' + s + '</small></span></li>').join('') + '<li class="addpr">● 個人練を録音</li></ul>' +
    '</div></div>';
}
document.getElementById('vs').innerHTML = V.map(([v, name, desc]) =>
  '<section class="v"><div><h2><span>' + v + '</span>' + name + '</h2><p>' + desc + '</p></div><div class="phones">' +
  '<div class="ph"><small>普段</small>' + screen(v, false) + '</div><div class="ph"><small>「編集」を押したとき</small>' + screen(v, true) + '</div></div></section>').join('');
</script>
