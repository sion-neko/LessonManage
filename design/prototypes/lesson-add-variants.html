<title>レッスン画面の書き方案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* レッスン画面の読みやすさ：今の画面に A（左端をそろえる）→ B（行の間）→ C（色を減らす）→ ♪をやめる、を1つずつ足して並べる */
:root {
  --page: #e9e9ee; --paper: #ffffff; --soft: #f2f2f7; --fg: #1c1c1e; --sub: #48484a; --muted: #8a8a8e; --line: #e5e5ea;
  --accent: #d29b00; --accent-d: #a87a00; --teacher: #3a6ea5; --me-dot: #e3b400;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #121214; color-scheme: dark } }
:root[data-theme="dark"] { --page: #121214; color-scheme: dark }
body { background: var(--page); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
.wrap { max-width: 2000px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 24px; margin: 0 0 6px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h1, :root:not([data-theme="light"]) .lead, :root:not([data-theme="light"]) .fr > b, :root:not([data-theme="light"]) .fr > p { color: #f2f2f7; } }
:root[data-theme="dark"] h1, :root[data-theme="dark"] .lead, :root[data-theme="dark"] .fr > b, :root[data-theme="dark"] .fr > p { color: #f2f2f7; }
.lead { color: var(--sub); font-size: 14px; line-height: 1.75; margin: 0 0 20px; max-width: 76ch; }
.phones { display: flex; flex-wrap: wrap; gap: 18px; }
.fr { width: 300px; max-width: 100%; }
.fr > b { display: block; font-size: 14px; margin: 0 0 2px 4px; }
.fr > p { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 0 0 8px 4px; min-height: 40px; }
.scr { position: relative; height: 990px; border-radius: 30px; border: 7px solid #1c1c1e; overflow: hidden; font-size: 14px; background: var(--paper); color: var(--fg); }

/* ── 今の画面（試作と同じ値） ── */
.nav { padding: 28px 16px 0; color: var(--accent); font-size: 15px; }
.ttl { padding: 4px 20px 0; }
.ttl b { display: block; font-size: 22px; line-height: 1.3; }
.ttl span { color: var(--muted); font-size: 12px; }
.tps { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 0; }
.tp { padding: 5px 11px; border-radius: 14px; background: var(--soft); font-size: 12px; font-weight: 600; color: var(--sub); }
.tp.add { background: transparent; border: 1.5px dashed var(--line); color: var(--accent-d); padding: 3px 11px; }
.h { margin: 20px 20px 2px; padding-bottom: 5px; border-bottom: 1px solid var(--line); color: var(--accent-d); font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
.lgd { display: flex; gap: 10px; font-size: 10px; color: var(--muted); font-weight: 400; }
.lgd i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--teacher); margin-right: 4px; vertical-align: 1px; }
.lgd i.m { background: var(--me-dot); }
.tk { padding: 10px 20px 0; font-size: 12px; font-weight: 700; color: var(--sub); }
ul { list-style: none; margin: 0; padding: 0; }
.row { position: relative; display: flex; gap: 4px; align-items: baseline; padding: 4px 20px; line-height: 1.55; font-size: 15px; }
.row .tx { flex: 1; min-width: 0; }
.row.m .tx { color: #636366; }
.row.hw .tx { font-size: 16px; font-weight: 700; }
.dot { flex: none; align-self: center; width: 20px; height: 20px; display: grid; place-items: center; margin-left: -7px; }
.dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--teacher); }
.dot.m i { background: var(--me-dot); }
.at { flex: none; margin-left: 6px; font-size: 11px; color: var(--accent-d); font-weight: 700; font-variant-numeric: tabular-nums; }
.gap { height: 26px; }
.pbar { position: absolute; left: 12px; right: 12px; bottom: 20px; display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 7px; border-radius: 18px; background: #f7f6f3; border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.pbar .pp { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
.pbar .pp svg { width: 12px; height: 12px; }
.pbar .wv { flex: 1; height: 20px; display: flex; align-items: center; gap: 2px; }
.pbar .wv i { flex: 1; background: var(--muted); opacity: .4; border-radius: 1px; }
.pbar .d { font-size: 11px; color: var(--muted); }

/* ── A：文字の左端を1本にそろえる。丸は左の余白に出す ── */
.va .row { padding-left: 20px; }
.va .dot { position: absolute; left: 4px; top: 7px; margin: 0; width: 14px; height: 14px; }
/* ── B：1つの指摘ごとに少し間をあける ── */
.vb .row { padding-top: 6px; padding-bottom: 6px; line-height: 1.6; }
.vb .row + .row { border-top: 0; }
.vb .tk { padding-top: 14px; }
/* ── C：色を減らす。時間は灰色、自分の気づきも黒い文字（違いは丸の色だけ） ── */
.vc .at { color: var(--muted); font-weight: 500; }
.vc .row.m .tx { color: var(--fg); }
/* ── 先生／自分を分けない：丸も凡例もなくす ── */
.vx .dot, .vx .lgd { display: none; }
/* 行の境目の出し方 */
.r-dot .dot { display: grid; align-self: flex-start; height: 23px; }
.r-dot .dot i, .r-dot .dot.m i { background: #aeaeb2; width: 6px; height: 6px; }
.r-line .row + .row::before { content: ""; position: absolute; left: 20px; right: 20px; top: 0; border-top: 1px solid var(--line); }
.r-line.r-dot .row + .row::before { left: 33px; }
.r-bar .row .tx { border-left: 2.5px solid #d1d1d6; padding-left: 9px; }
.r-bar .row { padding-top: 3px; padding-bottom: 3px; }
.ni { display: inline-flex; vertical-align: -1px; margin-right: 4px; color: var(--muted); }
.st { margin-left: 6px; font-size: 9px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; vertical-align: 1px; }
.ss { margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--muted); }
</style>

<div class="wrap">
<h1>レッスン画面：行の境目の出し方</h1>
<p class="lead">どれも「色を減らす」と「先生／自分を分けない」を入れた画面。左端のそろえと行の間は今のまま。曲のトピックは細い音符の絵に決定。先生／自分の青丸・黄丸をなくしたら行の境目が分かりにくくなったので、色を使わずに境目を見せる方法を4通り。</p>
<div class="phones" id="ps"></div>
</div>

<script>
const play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const hs = [5,9,6,12,8,11,7,10,12,9,6,11,10,7,12,9,5,12,8,10,11,6,9,12,7,11,8,12,6,10];
const T = { viv: 'ヴィヴァルディ 協奏曲 イ短調', wri: '手首が固まってしまう', sca: 'スケール' };
const learned = [
  ['viv', [['t', '3ポジへの移動は親指を先に動かす', '12:40'], ['t', '20小節目からは弓を多めに使ってフレーズを大きく', '25:05'], ['m', '親指を意識すると音程が安定する気がする', '39:50']]],
  ['wri', [['t', '肩を意識して動かすといい', '3:10'], ['t', '弓を返すときに手首を固めない', '4:20']]],
  ['sca', [['t', 'スケールは移弦の前に左手を準備', '33:30']]],
];
function screen(cls, note) {
  // 曲のトピックの印の出し方（note）：'sym'=♪ / 'none'=なし / 'icon'=細い音符 / 'tag'=「曲」の小さな印 / 'sub'=楽章を添える
  const SUB = { viv: '第1楽章', sca: '3オクターブ' };
  const name = (k) => { if (k === 'wri') return T[k]; if (note === 'sym') return '♪ ' + T[k]; if (note === 'icon') return '<span class="ni">' + nIcon + '</span>' + T[k]; if (note === 'tag') return T[k] + '<span class="st">曲</span>'; if (note === 'sub') return T[k] + '<span class="ss">' + SUB[k] + '</span>'; return T[k]; };
  return '<div class="scr ' + cls + '"><div class="nav">‹ 戻る</div><div class="ttl"><b>2026/11/16（月）</b><span>バイオリン · ブライアン先生</span></div>' +
    '<div class="tps">' + ['viv', 'wri', 'sca'].map((k) => '<span class="tp">' + name(k) + '</span>').join('') + '<span class="tp add">＋</span></div>' +
    '<div class="h">やること</div><ul><li class="row hw"><span class="tx">ヴィヴァルディ 20〜36小節をゆっくり</span></li><li class="row hw"><span class="tx">スケールは3オクターブをテンポ60で</span></li></ul><div class="gap"></div>' +
    '<div class="h">学んだこと<span class="lgd"><span><i></i>先生</span><span><i class="m"></i>自分</span></span></div>' +
    learned.map(([k, rows]) => '<div class="tk">' + name(k) + '</div><ul>' + rows.map(([by, tx, at]) => '<li class="row ' + (by === 'm' ? 'm' : '') + '"><span class="dot ' + by + '"><i></i></span><span class="tx">' + tx + '</span><span class="at">' + at + '</span></li>').join('') + '</ul><div class="gap"></div>').join('') +
    '<div class="pbar"><span class="pp">' + play + '</span><span class="wv">' + hs.map((h) => '<i style="height:' + h * 1.6 + 'px"></i>').join('') + '</span><span class="d">46:12</span></div></div>';
}
const nIcon = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>';
const V = [
  ['印なし（今）', '青丸をなくしただけ。行の境目が分かりにくい。', 'vc vx', 'icon'],
  ['灰色の小さな丸', '前の青丸と同じ位置に、色のない丸。見た目は前とほぼ同じで、色だけ消える。', 'vc vx r-dot', 'icon'],
  ['細い区切り線', '行と行の間に、ごく薄い線。iPhoneのメモやリマインダーの一覧と同じ。', 'vc vx r-line', 'icon'],
  ['左に短い縦線', '1行ごとに左に灰色の縦線。折り返した行も、どこまでが1つか分かる。', 'vc vx r-bar', 'icon'],
  ['丸＋細い線', '灰色の丸と、薄い区切り線を両方。', 'vc vx r-dot r-line', 'icon'],
];
document.getElementById('ps').innerHTML = V.map(([b, p, cls, note]) => '<div class="fr"><b>' + b + '</b><p>' + p + '</p>' + screen(cls, note) + '</div>').join('');
</script>
