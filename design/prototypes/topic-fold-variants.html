<title>トピックの折りたたみ案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* #6 レッスン画面：日付の下のトピックを折りたたみ、最初の数個だけ見せる。見せ方を並べて比べる */
:root {
  --page: #e9e9ee; --paper: #ffffff; --soft: #f2f2f7; --fg: #1c1c1e; --sub: #48484a; --muted: #8a8a8e; --line: #e5e5ea;
  --accent: #d29b00; --accent-d: #a87a00;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #121214; color-scheme: dark } }
:root[data-theme="dark"] { --page: #121214; color-scheme: dark }
body { background: var(--page); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; margin: 0; }
.wrap { max-width: 2000px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 24px; margin: 0 0 6px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h1, :root:not([data-theme="light"]) .lead, :root:not([data-theme="light"]) .fr > b, :root:not([data-theme="light"]) .fr > p { color: #f2f2f7; } }
:root[data-theme="dark"] h1, :root[data-theme="dark"] .lead, :root[data-theme="dark"] .fr > b, :root[data-theme="dark"] .fr > p { color: #f2f2f7; }
.lead { color: var(--sub); font-size: 14px; line-height: 1.75; margin: 0 0 20px; max-width: 76ch; }
.phones { display: flex; flex-wrap: wrap; gap: 18px; }
.fr { width: 300px; max-width: 100%; }
.fr > b { display: block; font-size: 14px; margin: 0 0 2px 4px; }
.fr > p { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 0 0 8px 4px; min-height: 58px; }
.scr { position: relative; height: 640px; border-radius: 30px; border: 7px solid #1c1c1e; overflow: hidden; font-size: 14px; background: var(--paper); color: var(--fg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* 今の画面（試作と同じ値） */
.nav { padding: 28px 16px 0; color: var(--accent); font-size: 15px; }
.ttl { padding: 4px 20px 0; }
.ttl b { display: block; font-size: 22px; line-height: 1.3; }
.ttl span { color: var(--muted); font-size: 12px; }
.tps { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 0; }
.tp { flex: none; padding: 5px 11px; border-radius: 14px; background: var(--soft); font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; }
.tp.add { background: transparent; border: 1.5px dashed var(--line); color: var(--accent-d); padding: 3px 11px; }
.tp.more { background: transparent; color: var(--accent-d); padding: 5px 4px; }
.ni { display: inline-flex; vertical-align: -1px; margin-right: 4px; color: var(--muted); }
.h { margin: 20px 20px 2px; padding-bottom: 5px; border-bottom: 1px solid var(--line); color: var(--accent-d); font-size: 15px; font-weight: 700; }
.tk { padding: 10px 20px 0; font-size: 12px; font-weight: 700; color: var(--sub); }
ul { list-style: none; margin: 0; padding: 0; }
.row { position: relative; padding: 4px 20px; line-height: 1.55; font-size: 15px; }
.row.hw { font-size: 16px; font-weight: 700; }
.row:not(.hw)::before { content: ""; position: absolute; left: 8px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: #aeaeb2; }
.gap { height: 26px; }

/* 1行に収める（はみ出した分は隠して「ほか○件」） */
.fit .tps.shut { flex-wrap: nowrap; overflow: hidden; }
/* 横にすべらせる */
.swipe .tps { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-right: 20px; }
.swipe .tps::-webkit-scrollbar { display: none; }
.swipe .tps .add { position: sticky; right: 0; background: var(--paper); box-shadow: -10px 0 8px var(--paper); }
/* 1行の文にまとめる */
.sum { display: flex; align-items: center; gap: 6px; margin: 10px 20px 0; padding: 7px 10px 7px 12px; border-radius: 10px; background: var(--soft); font-size: 12px; color: var(--sub); width: calc(100% - 40px); text-align: left; }
.sum .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.sum .ct { flex: none; color: var(--muted); }
.sum svg { flex: none; color: var(--muted); transition: transform .2s; }
.sum.open svg { transform: rotate(180deg); }
.fold { display: flex; align-items: flex-start; gap: 4px; padding: 10px 12px 0 20px; }
.fold .tps { flex: 1; min-width: 0; padding: 0; }
.fold .tps.shut { flex-wrap: nowrap; overflow: hidden; }
.chv { flex: none; width: 28px; height: 26px; display: grid; place-items: center; color: var(--muted); }
.chv svg { transition: transform .2s; }
.chv.open svg { transform: rotate(-90deg); }
.cnt { flex: none; align-self: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* トピックの主張を弱める */
.c1 .fold .tp:not(.add) { font-weight: 400; color: var(--muted); background: #f7f7f9; }
.c2 .fold .tp:not(.add) { background: transparent; border: 1px solid var(--line); font-weight: 400; color: var(--muted); padding: 3px 10px; }
.c3 .fold .tps { gap: 0; }
.c3 .fold .tp:not(.add) { background: transparent; font-weight: 400; color: var(--muted); padding: 4px 0; }
.c3 .fold .tp:not(.add) + .tp:not(.add)::before { content: "・"; color: #c7c7cc; padding: 0 2px; }
.c3 .fold .tp.add { margin-left: 8px; }
/* タグっぽく：小さく、角を少しだけ丸めた札 */
.g1 .fold .tps { gap: 4px; }
.g1 .fold .tp:not(.add) { font-size: 11px; font-weight: 500; color: var(--sub); background: transparent; border: 1px solid #dcdce1; border-radius: 5px; padding: 2px 7px 2px 6px; }
.g1 .fold .tp:not(.add)::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #c7c7cc; margin-right: 5px; vertical-align: 1px; }
.g1 .fold .tp:not(.add) .ni { display: none; }
.g2 .fold .tps { gap: 4px; }
.g2 .fold .tp:not(.add) { font-size: 11px; font-weight: 500; color: var(--sub); background: var(--soft); border-radius: 4px; padding: 3px 7px; }
.g3 .fold .tps { gap: 10px; }
.g3 .fold .tp:not(.add) { font-size: 12px; font-weight: 400; color: var(--muted); background: transparent; padding: 4px 0; }
.g3 .fold .tp:not(.add)::before { content: "#"; color: #c7c7cc; margin-right: 1px; }
.g3 .fold .tp:not(.add) .ni { display: none; }
.g1 .fold .tp.add, .g2 .fold .tp.add, .g3 .fold .tp.add { font-size: 11px; border-radius: 5px; padding: 1px 8px; }
.hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 11px; color: var(--muted); }
</style>

<div class="wrap">
<h1>レッスン画面：日付の下のトピックの折りたたみ</h1>
<p class="lead">トピックが6個あるレッスン。今はトピックが3行になり、やることが下へ押し出される。右端の「+4 ‹」を押すと全部開き、もう一度押すと閉じる。＋は開いたときだけ。トピックの札が目立ちすぎるので、文字だけ・タグっぽい見せ方を並べた。</p>
<div class="phones" id="ps"></div>
</div>

<script>
const nIcon = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>';
const chev = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const TOP = [['s', 'ヴィヴァルディ 協奏曲 イ短調'], ['f', '手首が固まってしまう'], ['s', 'スケール'], ['s', 'ユーモレスク'], ['f', '弓の配分'], ['f', 'ビブラートの幅']];
const label = ([k, t]) => (k === 's' ? '<span class="ni">' + nIcon + '</span>' : '') + t;
const chip = (x) => '<span class="tp">' + label(x) + '</span>';
const add = '<span class="tp add">＋</span>';

const body = '<div class="h">やること</div><ul><li class="row hw">ヴィヴァルディ 20〜36小節をゆっくり</li><li class="row hw">スケールは3オクターブをテンポ60で</li></ul><div class="gap"></div>' +
  '<div class="h">学んだこと</div><div class="tk"><span class="ni">' + nIcon + '</span>ヴィヴァルディ 協奏曲 イ短調</div><ul><li class="row">3ポジへの移動は親指を先に動かす</li><li class="row">20小節目からは弓を多めに使ってフレーズを大きく</li></ul>' +
  '<div class="tk">手首が固まってしまう</div><ul><li class="row">肩を意識して動かすといい</li></ul>';
const head = '<div class="nav">‹ 戻る</div><div class="ttl"><b>2026/11/16（月）</b><span>バイオリン · ブライアン先生</span></div>';

const left = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>';
// 各案：[見出し, 説明, ＋の置き方（'row'=いつも / 'open'=開いたときだけ）, 隠れている数を出すか]
const V = [
  ['今：全部並べる', 'トピックが3行になる。やることの位置がトピックの数で変わる。', null, false],
  ['前の案', '灰色の丸い札、太字。', 'open', true, ''],
  ['文字だけ', '札をやめて、名前を「・」でつないだ灰色の文字に。', 'open', true, 'c3'],
  ['ロール風', '小さな角丸の枠に、灰色の小さな丸。Discordのロールのような見た目。', 'open', true, 'g1'],
  ['ラベル風', '小さな角丸の札。GitHubのラベルのような見た目。', 'open', true, 'g2'],
  ['ハッシュタグ風', '「#」を付けた灰色の文字。札も枠もなし。', 'open', true, 'g3'],
];
function topics(v, open) {
  if (!v[2]) return '<div class="tps">' + TOP.map(chip).join('') + add + '</div>';
  const plus = v[2] === 'row' || open;
  return '<div class="fold"><div class="tps' + (open ? '' : ' shut') + '">' + TOP.map(chip).join('') + (plus ? add : '') + '</div>' +
    (v[3] && !open ? '<span class="cnt"></span>' : '') + '<button class="chv' + (open ? ' open' : '') + '" data-t>' + left + '</button></div>';
}
// 閉じているとき：はみ出したチップを後ろから隠す（＋は残す）
function fitMeasure(scr) {
  const row = scr.querySelector('.tps.shut'); if (!row) return;
  const chips = [...row.querySelectorAll('.tp:not(.add)')]; const cnt = scr.querySelector('.cnt');
  let hidden = 0;
  for (let i = chips.length - 1; i > 0 && row.scrollWidth > row.clientWidth; i--) { chips[i].style.display = 'none'; hidden++; if (cnt) cnt.textContent = '+' + hidden; }
  if (cnt && !hidden) cnt.remove();
}

document.getElementById('ps').innerHTML = V.map(([b, p], i) => '<div class="fr"><b>' + b + '</b><p>' + p + '</p><div class="scr ' + (V[i][4] || '') + '" data-i="' + i + '"></div></div>').join('');
document.querySelectorAll('.scr').forEach((scr) => {
  const i = +scr.dataset.i; let open = false;
  const draw = () => {
    scr.innerHTML = head + topics(V[i], open) + body;
    fitMeasure(scr);
    scr.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { open = !open; draw(); }));
  };
  draw();
});
</script>
