<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F 組み合わせ</title>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="flows.css">
<style>
/* F：Aの見た目と画面構成に、Eの曲ページ（メッセージ風の積み上げ）と曲から録る流れを組み合わせた案 */
:root {
  --desk: #e7e7ec; --bg: #f2f2f7; --card: #ffffff; --fg: #1c1c1e; --muted: #8a8a8e; --line: #dcdce1;
  --accent: #d29b00; --on-accent: #fff; --rec: #ff3b30; --field: #ffffff; --sheet: #f2f2f7; --bullet: #c7c7cc;
}
.nav { padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between; min-height: 96px; }
.nav .bk { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; margin-left: -6px; }
.nav .act { color: var(--accent); padding: 6px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: .01em; padding: 0 16px 8px; }
.sec { font-size: 13px; color: var(--muted); padding: 22px 32px 7px; display: flex; justify-content: space-between; }
.grp { margin: 0 16px; background: var(--card); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 46px; width: 100%; text-align: left; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 17px; }
.row .s { font-size: 14px; color: var(--muted); margin-top: 2px; }
.row .chev { color: #c4c4c7; }
.card { margin: 0 16px; background: var(--card); border-radius: 12px; padding: 14px 16px 6px; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; width: 100%; text-align: left; padding-bottom: 6px; }
.card-h b { font-size: 17px; }
.card-h span { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 2px; }
.k { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 10px; }
.card ul { list-style: none; margin: 4px 0 0; padding: 0; }
.card li { position: relative; padding: 4px 0 4px 16px; line-height: 1.5; font-size: 16px; }
.card li::before { content: ""; position: absolute; left: 3px; top: 13px; width: 5px; height: 5px; border-radius: 50%; background: var(--bullet); }
.card-f { display: flex; align-items: center; justify-content: space-between; border-top: .5px solid var(--line); margin-top: 10px; padding: 10px 0 8px; }
.card-f .s { color: var(--muted); font-size: 14px; }
.card-f button { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 16px; font-weight: 600; }
.tabbar { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: .5px solid var(--line); background: rgba(249,249,249,.94); padding: 6px 0 28px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); }
.tab.on { color: var(--accent); }
.doc { padding: 0 20px 40px; }
.doc .d-date { font-size: 28px; font-weight: 700; }
.doc .d-type { color: var(--muted); font-size: 15px; margin-top: 2px; }
.doc .h { font-size: 20px; font-weight: 700; margin: 26px 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
.doc .h button { font-size: 15px; font-weight: 400; color: var(--accent); }
.songs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.songs button { padding: 6px 12px; border-radius: 8px; background: var(--card); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.songs button svg { color: var(--accent); width: 15px; height: 15px; }
.recbox { margin-top: 18px; background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.recbox .wave { flex: 1; color: var(--fg); overflow: hidden; }
.recbtn { width: 100%; margin-top: 18px; background: var(--card); border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--rec); font-weight: 600; font-size: 16px; }
.recbar { display: flex; align-items: center; gap: 10px; margin: 0 16px 6px; padding: 10px 14px; border-radius: 12px; background: #fff0ef; color: var(--rec); font-weight: 600; }
.recbar .tm { flex: 1; font-variant-numeric: tabular-nums; }
.recbar button { background: var(--rec); color: #fff; border-radius: 14px; padding: 5px 12px; font-size: 14px; }
.doc .bl { background: var(--card); border-radius: 12px; padding: 4px 14px; margin-top: 6px; }
.pr { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: .5px solid var(--line); }
.pr .dt { width: 44px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.pr .nt { flex: 1; min-width: 0; font-size: 15px; }
.pr .nt small { display: block; color: var(--muted); font-size: 13px; }
.addpr { margin-top: 10px; color: var(--accent); font-size: 16px; display: flex; align-items: center; gap: 6px; padding: 6px 0; }
.memo-in { display: flex; gap: 8px; margin-top: 8px; }
.memo-in input { flex: 1; padding: 11px 12px; border-radius: 10px; border: 0; background: var(--card); font-size: 16px; outline: none; }
.memo-in button { color: var(--accent); font-weight: 600; padding: 0 8px; }
.memo { padding: 10px 0; border-bottom: .5px solid var(--line); }
.memo .md { font-size: 13px; color: var(--muted); }
.memo .mt { font-size: 16px; line-height: 1.5; margin-top: 2px; }
.empty { color: var(--muted); font-size: 15px; padding: 8px 0; }

.chat-h { padding: 52px 12px 8px; display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; border-bottom: .5px solid var(--line); background: rgba(242,242,247,.96); }
.chat-h .ct { text-align: center; min-width: 0; }
.chat-h .ct b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-h .ct small { color: var(--muted); font-size: 12px; }
.chat-h .bk { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; }
.log { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.div { align-self: center; font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
.lmark { align-self: center; display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 14px; padding: 6px 12px; font-size: 13px; color: var(--accent); font-weight: 600; margin: 4px 0; }
.bub { align-self: flex-end; max-width: 78%; background: #fff6d6; color: var(--fg); padding: 9px 13px; border-radius: 18px 18px 6px 18px; font-size: 15px; line-height: 1.45; }
.rbub { align-self: flex-end; max-width: 82%; background: var(--card); padding: 8px 12px 8px 8px; border-radius: 18px 18px 6px 18px; display: flex; flex-direction: column; gap: 4px; }
.rbub .rl { font-size: 12px; color: var(--muted); padding-left: 4px; }
.rbub .rt { font-size: 14px; padding-left: 4px; }
.rbub .rr { display: flex; align-items: center; gap: 8px; }
.rbub .pb { background: var(--bg); }
.rbub .wave { color: var(--accent); }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 12px 30px; border-top: .5px solid var(--line); background: rgba(249,249,249,.96); }
.composer input { flex: 1; min-width: 0; height: 40px; border-radius: 20px; border: .5px solid var(--line); padding: 0 14px; font-size: 16px; outline: none; background: var(--card); }
.composer .send { flex: none; height: 40px; padding: 0 12px; color: var(--accent); font-weight: 700; white-space: nowrap; }
.composer .rec { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--card); color: var(--rec); display: grid; place-items: center; }
.tg { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--card); font-size: 15px; text-align: left; }
.tg .bx { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; flex: none; }
.tg.on .bx { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script src="core.js"></script>
<script src="flows.js"></script>
<script>
const { D, Rec, makeNav, esc, h, I, toast } = LM;
const app = document.getElementById('app');
const stage = document.createElement('div'); stage.style.cssText = 'position:absolute;inset:0'; app.appendChild(stage);
let tab = 'home';
let recTarget = null; // 録音中のレッスン

function tabbar(nav) {
  const el = h('<div class="tabbar">' +
    [['home', 'ホーム', I.home], ['lessons', 'レッスン', I.list], ['songs', '曲', I.note]].map(([k, n, ic]) =>
      '<button class="tab' + (tab === k ? ' on' : '') + '" data-k="' + k + '">' + ic + n + '</button>').join('') + '</div>');
  el.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { if (tab !== b.dataset.k) { tab = b.dataset.k; nav.root(tab); } }));
  return el;
}
function recBar(nav) {
  if (!Rec.on || !recTarget) return null;
  const el = h('<div class="recbar"><span>●</span><span class="tm">録音中 ' + D.dur(Rec.sec) + '</span><button data-tap>停止</button></div>');
  const un = Rec.sub(() => { if (!Rec.on) return un(); el.querySelector('.tm').textContent = '録音中 ' + D.dur(Rec.sec); });
  el.querySelector('button').onclick = () => { const r = Rec.stop(); D.addRec({ kind: 'lesson', lessonId: recTarget, dur: r.dur }); recTarget = null; toast(app, 'レッスンの録音を保存'); nav.refresh(); };
  return el;
}

function recordPractice(lesson, nav) {
  LM.practiceStand(app, { lesson, onStop: (dur) => {
    setTimeout(() => LM.afterPracticeSheet(app, { lesson, dur, onSave: ({ songId, note }) => {
      D.addRec({ kind: 'practice', lessonId: lesson.id, songId, dur, note }); toast(app, '個人練を保存'); nav.refresh();
    } }), 420);
  } });
}
function recordLesson(lesson, nav) {
  recTarget = lesson.id;
  LM.recordSheet(app, { label: D.md(lesson.date) + ' ' + D.type(lesson.typeId).name + 'のレッスン', minimizable: true,
    onMin: () => nav.refresh(),
    onStop: (dur) => { D.addRec({ kind: 'lesson', lessonId: lesson.id, dur }); recTarget = null; toast(app, 'レッスンの録音を保存'); nav.refresh(); } });
}

// 曲から録る。直近のレッスン後の個人練として扱うのが既定
const check = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
function recordSong(s, nav) {
  LM.recordSheet(app, { label: s.title, onStop: (dur) => setTimeout(() => {
    const l = D.latest(s.typeId); let link = !!l; let note = '';
    LM.sheet(app, (el, close) => {
      const draw = () => {
        el.innerHTML = '<div class="ap"><div class="ap-head"><span class="ap-title">' + esc(s.title) + '</span><span class="ap-dur">' + D.dur(dur) + '</span></div>' +
          '<div class="ap-k">一言</div><input id="f-note" class="ap-note" placeholder="例：テンポ60で通せた" autocomplete="off">' +
          (l ? '<button class="tg press' + (link ? ' on' : '') + '" data-act="tg"><span class="bx">' + (link ? check : '') + '</span><span>' + D.fmtDate(l.date) + 'のレッスン後の個人練にする</span></button>' : '') +
          '<button class="ap-save press" data-act="save">保存</button></div>';
        const ni = el.querySelector('#f-note'); ni.value = note; ni.oninput = () => (note = ni.value);
        const tg = el.querySelector('[data-act=tg]'); if (tg) tg.onclick = () => { link = !link; draw(); };
        el.querySelector('[data-act=save]').onclick = () => { close(); D.addRec(link ? { kind: 'practice', lessonId: l.id, songId: s.id, dur, note } : { kind: 'song', songId: s.id, dur, note }); toast(app, '録音を保存'); nav.refresh(); };
      };
      draw();
    }, { modal: true });
  }, 420) });
}

const screens = {
  home(el, a, nav) {
    el.appendChild(h('<div class="nav"><span></span><button class="act" data-act="new" aria-label="新しいレッスン">' + I.compose + '</button></div>'));
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    sc.appendChild(h('<div class="big">ホーム</div>'));
    const rb = recBar(nav); if (rb) sc.appendChild(rb);
    D.S.types.forEach((t) => {
      const l = D.latest(t.id);
      sc.appendChild(h('<div class="sec"><span>' + esc(t.name) + ' · ' + esc(t.teacher) + '</span></div>'));
      if (!l) { sc.appendChild(h('<div class="card"><div class="empty">まだレッスンがありません</div></div>')); return; }
      const pr = D.practiceOf(l.id);
      const card = h('<div class="card">' +
        '<button class="card-h" data-act="open"><b>' + D.fmtDate(l.date) + 'のレッスン</b><span>' + D.rel(l.date) + I.chev + '</span></button>' +
        '<div class="k">学んだこと</div><ul>' + l.learned.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' +
        '<div class="k">宿題</div><ul>' + l.homework.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' +
        '<div class="card-f"><span class="s">個人練 ' + pr.length + '回' + (pr.length ? ' · 最後は' + D.rel(pr[pr.length - 1].date) : '') + '</span>' +
        '<button class="press" data-act="pr">' + I.mic + '個人練を記録</button></div></div>');
      card.querySelector('[data-act=open]').onclick = () => nav.push('lesson', { id: l.id });
      card.querySelector('[data-act=pr]').onclick = () => recordPractice(l, nav);
      sc.appendChild(card);
    });
    sc.appendChild(h('<div style="height:30px"></div>'));
    el.appendChild(tabbar(nav));
    el.querySelector('[data-act=new]').onclick = () => LM.typePicker(app, { onPick: (tid) => { const l = D.addLesson(tid); nav.push('lesson', { id: l.id, fresh: true }); } });
  },
  lessons(el, a, nav) {
    el.appendChild(h('<div class="nav"><span></span><button class="act" data-act="new">' + I.compose + '</button></div>'));
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    sc.appendChild(h('<div class="big">レッスン</div>'));
    D.S.types.forEach((t) => {
      sc.appendChild(h('<div class="sec"><span>' + esc(t.name) + ' · ' + esc(t.teacher) + '</span></div>'));
      const g = h('<div class="grp"></div>');
      D.lessonsOf(t.id).forEach((l) => {
        const r = h('<button class="row" data-tap><div class="grow"><div class="t">' + D.fmtDate(l.date, true) + '</div><div class="s">' + esc(l.learned[0] || '（まだ何も書いていない）') + '</div></div><span class="chev">' + I.chev + '</span></button>');
        r.onclick = () => nav.push('lesson', { id: l.id }); g.appendChild(r);
      });
      sc.appendChild(g);
    });
    sc.appendChild(h('<div class="sec"><button style="color:var(--accent)" data-act="type">＋ 種類を追加</button></div>'));
    sc.querySelector('[data-act=type]').onclick = () => LM.addTypeSheet(app, { onAdd: () => nav.refresh() });
    el.appendChild(tabbar(nav));
    el.querySelector('[data-act=new]').onclick = () => LM.typePicker(app, { onPick: (tid) => { const l = D.addLesson(tid); nav.push('lesson', { id: l.id, fresh: true }); } });
  },
  songs(el, a, nav) {
    el.appendChild(h('<div class="nav"><span></span><span></span></div>'));
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    sc.appendChild(h('<div class="big">曲</div>'));
    D.S.types.forEach((t) => {
      sc.appendChild(h('<div class="sec"><span>' + esc(t.name) + '</span></div>'));
      const g = h('<div class="grp"></div>');
      D.songsOf(t.id).forEach((s) => {
        const la = D.lastActivity(s.id);
        const r = h('<button class="row" data-tap><div class="grow"><div class="t">' + esc(s.title) + '</div><div class="s">' + esc(s.sub) + (la ? ' · ' + D.rel(la) : '') + '</div></div><span class="chev">' + I.chev + '</span></button>');
        r.onclick = () => nav.push('song', { id: s.id }); g.appendChild(r);
      });
      sc.appendChild(g);
    });
    sc.appendChild(h('<div style="height:30px"></div>'));
    el.appendChild(tabbar(nav));
  },
  lesson(el, a, nav) {
    const l = D.lesson(a.id); const t = D.type(l.typeId);
    const nb = h('<div class="nav"><button class="bk">' + I.back + '戻る</button><span></span></div>'); nb.querySelector('.bk').onclick = () => nav.back();
    el.appendChild(nb);
    const rb = recBar(nav); if (rb) el.appendChild(rb);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const doc = h('<div class="doc"><div class="d-date">' + D.fmtDate(l.date, true) + '</div><div class="d-type">' + esc(t.name) + ' · ' + esc(t.teacher) + '</div></div>');
    sc.appendChild(doc);
    const songs = h('<div class="songs">' + l.songIds.map((id) => '<button data-s="' + id + '">' + I.note + esc(D.song(id).title) + '</button>').join('') + '<button data-act="songs" style="color:var(--accent)">' + (l.songIds.length ? '編集' : '＋ 扱った曲') + '</button></div>');
    songs.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => nav.push('song', { id: b.dataset.s })));
    songs.querySelector('[data-act=songs]').onclick = () => LM.songPicker(app, l, () => nav.refresh());
    doc.appendChild(songs);
    const lr = D.lessonRec(l.id);
    if (lr) { const box = h('<div class="recbox"></div>'); box.appendChild(LM.playBtn(lr)); box.insertAdjacentHTML('beforeend', LM.wave(lr.id, 46)); doc.appendChild(box); }
    else if (!(Rec.on && recTarget === l.id)) { const b = h('<button class="recbtn press">' + I.mic + 'レッスンを録音</button>'); b.onclick = () => recordLesson(l, nav); doc.appendChild(b); }
    doc.appendChild(h('<div class="h">学んだこと</div>')); doc.appendChild(LM.bullets(l, 'learned'));
    doc.appendChild(h('<div class="h">宿題</div>')); doc.appendChild(LM.bullets(l, 'homework'));
    doc.appendChild(h('<div class="h">このレッスン後の個人練</div>'));
    const prs = D.practiceOf(l.id);
    if (!prs.length) doc.appendChild(h('<div class="empty">まだ個人練の記録がありません</div>'));
    prs.forEach((r) => {
      const row = h('<div class="pr"><span class="dt">' + D.md(r.date) + '</span><div class="nt">' + (esc(r.note) || '（一言なし）') + (r.songId ? '<small>' + esc(D.song(r.songId).title) + '</small>' : '') + '</div></div>');
      row.appendChild(LM.playBtn(r)); doc.appendChild(row);
    });
    const ap = h('<button class="addpr press">' + I.mic + '個人練を記録</button>'); ap.onclick = () => recordPractice(l, nav); doc.appendChild(ap);
  },
  song(el, a, nav) {
    const s = D.song(a.id);
    const hd = h('<div class="chat-h"><button class="bk">' + I.back + '戻る</button><div class="ct"><b>' + esc(s.title) + '</b><small>' + esc(s.sub) + '</small></div><span></span></div>');
    hd.querySelector('.bk').onclick = () => nav.back(); el.appendChild(hd);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const log = h('<div class="log"></div>');
    const ord = { lesson: 0, memo: 1, rec: 2 };
    const items = D.songTimeline(s.id).slice().sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : ord[x.t] - ord[y.t]));
    let last = '';
    items.forEach((it) => {
      if (it.date !== last) { last = it.date; log.appendChild(h('<div class="div">' + D.fmtDate(it.date, true) + '</div>')); }
      if (it.t === 'lesson') { const b = h('<button class="lmark press">' + esc(D.type(it.l.typeId).name) + 'のレッスン' + I.chev + '</button>'); b.onclick = () => nav.push('lesson', { id: it.l.id }); log.appendChild(b); }
      if (it.t === 'memo') log.appendChild(h('<div class="bub">' + esc(it.m.text) + '</div>'));
      if (it.t === 'rec') {
        const r = it.r; const lab = r.kind === 'practice' ? D.md(D.lesson(r.lessonId).date) + 'のレッスン後の個人練' : '録音';
        const b = h('<div class="rbub"><span class="rl">' + lab + '</span>' + (r.note ? '<span class="rt">' + esc(r.note) + '</span>' : '') + '<div class="rr"></div></div>');
        b.querySelector('.rr').appendChild(LM.playBtn(r)); b.querySelector('.rr').insertAdjacentHTML('beforeend', LM.wave(r.id, 18));
        log.appendChild(b);
      }
    });
    if (!items.length) log.appendChild(h('<div class="div">まだ記録がありません</div>'));
    sc.appendChild(log);
    const cp = h('<div class="composer"><button class="rec press" aria-label="録音">' + I.mic + '</button><input id="f-memo" placeholder="メモ" autocomplete="off"><button class="send press">追加</button></div>');
    const add = () => { if (D.addMemo(s.id, cp.querySelector('input').value)) nav.refresh(); };
    cp.querySelector('.send').onclick = add; cp.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) add(); };
    cp.querySelector('.rec').onclick = () => recordSong(s, nav);
    el.appendChild(cp);
    requestAnimationFrame(() => { sc.scrollTop = sc.scrollHeight; });
  },
};
const nav = makeNav(stage, screens);
LM.chrome(app, () => { const l = recTarget && D.lesson(recTarget); if (l) recordLesson(l, nav); });
nav.root('home');
window.__nav = nav;
</script>
</body>
</html>
