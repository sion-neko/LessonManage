<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B スレッド</title>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="flows.css">
<style>
/* B：レッスンを親、個人練を返信のようにつなぐスレッド。白地に細い線、種類ごとの色の点 */
:root {
  --desk: #e6e9ec; --bg: #ffffff; --card: #f5f6f8; --fg: #1d2327; --muted: #7c858c; --line: #e3e6e9;
  --accent: #2f6fde; --on-accent: #fff; --rec: #e5484d; --field: #f5f6f8; --sheet: #ffffff;
  --c1: #2f6fde; --c2: #d4537e; --bullet: #b8bfc5;
}
.top { padding: 56px 20px 8px; display: flex; justify-content: space-between; align-items: center; }
.top h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .02em; }
.top .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--fg); }
.bk { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; }
.pins { display: flex; gap: 10px; overflow-x: auto; padding: 6px 20px 14px; scrollbar-width: none; scroll-snap-type: x mandatory; }
.pins::-webkit-scrollbar { display: none; }
.pin { flex: 0 0 82%; scroll-snap-align: start; border-radius: 18px; padding: 14px 16px 12px; background: var(--card); text-align: left; display: flex; flex-direction: column; gap: 6px; }
.pin .ph { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.pin .pk { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin-top: 2px; }
.pin ul { margin: 0; padding: 0 0 0 16px; font-size: 15px; line-height: 1.5; }
.pin .pf { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.pin .pf span { font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; background: var(--fg); color: var(--bg); font-size: 14px; font-weight: 600; }
.feed-h { font-size: 13px; font-weight: 700; color: var(--muted); padding: 8px 20px 4px; letter-spacing: .04em; }
.th { position: relative; padding: 12px 20px 4px 58px; }
.th::before { content: ""; position: absolute; left: 35px; top: 46px; bottom: 0; width: 2px; background: var(--line); }
.th:last-child::before { display: none; }
.node { position: absolute; left: 20px; top: 14px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
.lsn { width: 100%; text-align: left; }
.lsn .lh { display: flex; justify-content: space-between; align-items: baseline; }
.lsn .lh b { font-size: 17px; }
.lsn .lh span { font-size: 13px; color: var(--muted); }
.lsn .lt { font-size: 13px; color: var(--muted); margin-top: 1px; }
.lsn .lb { margin-top: 8px; font-size: 15px; line-height: 1.55; color: var(--fg); }
.lsn .lb .k { color: var(--muted); font-size: 12px; font-weight: 700; display: block; margin-top: 6px; letter-spacing: .04em; }
.reply { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.reply::before { content: ""; position: absolute; left: -23px; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid var(--line); transform: translateY(-50%); }
.reply .rd { font-size: 13px; color: var(--muted); width: 38px; font-variant-numeric: tabular-nums; }
.reply .rn { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; }
.reply .rn small { display: block; color: var(--muted); font-size: 12px; }
.reply-add { position: relative; color: var(--accent); font-size: 14px; font-weight: 600; padding: 8px 0 14px; display: flex; align-items: center; gap: 6px; }
.reply-add::before { content: ""; position: absolute; left: -23px; top: 13px; width: 9px; height: 9px; border-radius: 50%; border: 2px dashed var(--accent); background: #fff; }
.fab { position: absolute; right: 20px; bottom: 34px; width: 58px; height: 58px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.18); z-index: 20; }
.page { padding: 4px 20px 60px; }
.page .pt { font-size: 26px; font-weight: 800; }
.page .ps { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tag { padding: 5px 11px; border-radius: 14px; background: var(--card); font-size: 13px; }
.tag.add { color: var(--accent); }
.lrec { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px; border-radius: 14px; background: var(--card); }
.lrec .wave { flex: 1; overflow: hidden; color: var(--fg); }
.lrec-btn { width: 100%; margin-top: 16px; padding: 14px; border-radius: 14px; border: 1.5px dashed var(--rec); color: var(--rec); font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; }
.sh { font-size: 13px; font-weight: 700; color: var(--muted); margin: 24px 0 2px; letter-spacing: .04em; }
.recbar { display: flex; align-items: center; gap: 10px; margin: 0 20px 6px; padding: 10px 14px; border-radius: 14px; background: #fdeced; color: var(--rec); font-weight: 600; }
.recbar .tm { flex: 1; font-variant-numeric: tabular-nums; }
.recbar button { background: var(--rec); color: #fff; border-radius: 14px; padding: 5px 12px; font-size: 14px; }
.thread { position: relative; margin-top: 6px; padding-left: 26px; }
.thread::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.ev { position: relative; padding: 10px 0; }
.ev::before { content: ""; position: absolute; left: -24px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid var(--line); }
.ev.l::before { background: var(--accent); border-color: var(--accent); }
.ev .ed { font-size: 12px; color: var(--muted); }
.ev .et { font-size: 15px; line-height: 1.5; margin-top: 2px; }
.ev .er { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.ev button.lk { color: var(--accent); font-size: 15px; font-weight: 600; text-align: left; }
.memo-in { display: flex; gap: 8px; margin-top: 12px; }
.memo-in input { flex: 1; padding: 11px 12px; border-radius: 12px; border: 0; background: var(--card); font-size: 16px; outline: none; }
.memo-in button { padding: 0 14px; border-radius: 12px; background: var(--card); color: var(--accent); font-weight: 600; }
.songlist button { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); text-align: left; }
.songlist small { color: var(--muted); display: block; font-size: 13px; }
.seg { display: flex; gap: 6px; padding: 0 20px 6px; }
.seg button { padding: 7px 14px; border-radius: 16px; background: var(--card); font-size: 14px; }
.seg button.on { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
<div id="app"></div>
<script src="core.js"></script>
<script src="flows.js"></script>
<script>
const { D, Rec, makeNav, esc, h, I, toast } = LM;
const app = document.getElementById('app');
const stage = document.createElement('div'); stage.style.cssText = 'position:absolute;inset:0'; app.appendChild(stage);
const color = (tid) => (tid === 't1' ? 'var(--c1)' : tid === 't2' ? 'var(--c2)' : '#8b6fd6');
let recTarget = null;

function recBar(nav) {
  if (!Rec.on || !recTarget) return null;
  const el = h('<div class="recbar"><span>●</span><span class="tm">録音中 ' + D.dur(Rec.sec) + '</span><button data-tap>停止</button></div>');
  const un = Rec.sub(() => { if (!Rec.on) return un(); el.querySelector('.tm').textContent = '録音中 ' + D.dur(Rec.sec); });
  el.querySelector('button').onclick = () => { const r = Rec.stop(); D.addRec({ kind: 'lesson', lessonId: recTarget, dur: r.dur }); recTarget = null; toast(app, 'レッスンの録音を保存'); nav.refresh(); };
  return el;
}
function recordPractice(lesson, nav) {
  LM.practiceStand(app, { lesson, onStop: (dur) => setTimeout(() => LM.afterPracticeSheet(app, { lesson, dur, onSave: ({ songId, note }) => { D.addRec({ kind: 'practice', lessonId: lesson.id, songId, dur, note }); toast(app, '個人練を保存'); nav.refresh(); } }), 420) });
}
function recordLesson(lesson, nav) {
  recTarget = lesson.id;
  LM.recordSheet(app, { label: D.md(lesson.date) + ' ' + D.type(lesson.typeId).name + 'のレッスン', minimizable: true, onMin: () => nav.refresh(),
    onStop: (dur) => { D.addRec({ kind: 'lesson', lessonId: lesson.id, dur }); recTarget = null; toast(app, 'レッスンの録音を保存'); nav.refresh(); } });
}
function newLesson(nav) { LM.typePicker(app, { onPick: (tid) => { const l = D.addLesson(tid); nav.push('lesson', { id: l.id }); } }); }

function threadBlock(l, nav, expanded) {
  const t = D.type(l.typeId);
  const box = h('<div class="th"><span class="node" style="background:' + color(l.typeId) + '">' + D.md(l.date) + '</span></div>');
  const body = h('<button class="lsn" data-tap><div class="lh"><b>' + esc(t.name) + 'のレッスン</b><span>' + D.rel(l.date) + '</span></div><div class="lt">' + esc(t.teacher) + (l.songIds.length ? ' · ' + l.songIds.map((i) => esc(D.song(i).title)).join('、') : '') + '</div>' +
    '<div class="lb">' + (expanded
      ? '<span class="k">学んだこと</span>' + l.learned.map(esc).join('<br>') + '<span class="k">宿題</span>' + l.homework.map(esc).join('<br>')
      : esc(l.learned[0] || '')) + '</div></button>');
  body.onclick = () => nav.push('lesson', { id: l.id });
  box.appendChild(body);
  D.practiceOf(l.id).forEach((r) => {
    const rp = h('<div class="reply"><span class="rd">' + D.md(r.date) + '</span><div class="rn">' + (esc(r.note) || '（一言なし）') + (r.songId ? '<small>' + esc(D.song(r.songId).title) + '</small>' : '') + '</div></div>');
    rp.appendChild(LM.playBtn(r)); box.appendChild(rp);
  });
  if (expanded) { const ad = h('<button class="reply-add press">' + I.mic + '個人練を記録</button>'); ad.onclick = () => recordPractice(l, nav); box.appendChild(ad); }
  return box;
}

let filter = 'all';
const screens = {
  home(el, a, nav) {
    const top = h('<div class="top"><h1>レッスン帳</h1><button class="ic" data-act="songs" aria-label="曲">' + I.note + '</button></div>');
    top.querySelector('[data-act=songs]').onclick = () => nav.push('songs');
    el.appendChild(top);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const rb = recBar(nav); if (rb) sc.appendChild(rb);
    const pins = h('<div class="pins"></div>');
    D.S.types.forEach((t) => {
      const l = D.latest(t.id); if (!l) return;
      const pr = D.practiceOf(l.id);
      const p = h('<div class="pin"><div class="ph"><span class="dot" style="background:' + color(t.id) + '"></span>' + esc(t.name) + ' · ' + D.fmtDate(l.date) + 'の宿題</div>' +
        '<ul>' + l.homework.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' +
        '<div class="pf"><span>個人練 ' + pr.length + '回</span><button class="pill press" data-act="pr">' + I.mic + '個人練</button></div></div>');
      p.querySelector('[data-act=pr]').onclick = () => recordPractice(l, nav);
      pins.appendChild(p);
    });
    sc.appendChild(pins);
    const seg = h('<div class="seg">' + [['all', 'すべて'], ...D.S.types.map((t) => [t.id, t.name])].map(([k, n]) => '<button class="press' + (filter === k ? ' on' : '') + '" data-f="' + k + '">' + esc(n) + '</button>').join('') + '</div>');
    seg.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { filter = b.dataset.f; nav.refresh(); }));
    sc.appendChild(seg);
    const ls = D.S.lessons.filter((l) => filter === 'all' || l.typeId === filter).sort((a, b) => (a.date < b.date ? 1 : -1));
    const latestIds = D.S.types.map((t) => D.latest(t.id)).filter(Boolean).map((l) => l.id);
    const feed = h('<div></div>');
    ls.forEach((l) => feed.appendChild(threadBlock(l, nav, latestIds.includes(l.id))));
    sc.appendChild(feed);
    sc.appendChild(h('<div style="height:110px"></div>'));
    const fab = h('<button class="fab press" aria-label="新しいレッスン">' + I.plus + '</button>'); fab.onclick = () => newLesson(nav); el.appendChild(fab);
  },
  songs(el, a, nav) {
    const top = h('<div class="top"><button class="bk">' + I.back + '戻る</button><span></span></div>'); top.querySelector('.bk').onclick = () => nav.back(); el.appendChild(top);
    const sc = h('<div class="scroll"><div class="page" style="padding-bottom:8px"><div class="pt">曲</div></div></div>'); el.appendChild(sc);
    D.S.types.forEach((t) => {
      sc.appendChild(h('<div class="sh" style="padding:0 20px">' + esc(t.name) + '</div>'));
      const list = h('<div class="songlist"></div>');
      D.songsOf(t.id).forEach((s) => { const la = D.lastActivity(s.id); const b = h('<button data-tap><span><b>' + esc(s.title) + '</b><small>' + esc(s.sub) + (la ? ' · ' + D.rel(la) : '') + '</small></span>' + I.chev + '</button>'); b.onclick = () => nav.push('song', { id: s.id }); list.appendChild(b); });
      sc.appendChild(list);
    });
  },
  lesson(el, a, nav) {
    const l = D.lesson(a.id); const t = D.type(l.typeId);
    const top = h('<div class="top"><button class="bk">' + I.back + '戻る</button><span></span></div>'); top.querySelector('.bk').onclick = () => nav.back(); el.appendChild(top);
    const rb = recBar(nav); if (rb) el.appendChild(rb);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const pg = h('<div class="page"><div class="pt">' + D.fmtDate(l.date, true) + '</div><div class="ps"><span class="dot" style="background:' + color(l.typeId) + '"></span>' + esc(t.name) + ' · ' + esc(t.teacher) + '</div></div>');
    sc.appendChild(pg);
    const tags = h('<div class="tags">' + l.songIds.map((id) => '<button class="tag press" data-s="' + id + '">' + esc(D.song(id).title) + '</button>').join('') + '<button class="tag add press" data-act="songs">' + (l.songIds.length ? '曲を編集' : '＋ 扱った曲') + '</button></div>');
    tags.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => nav.push('song', { id: b.dataset.s })));
    tags.querySelector('[data-act=songs]').onclick = () => LM.songPicker(app, l, () => nav.refresh());
    pg.appendChild(tags);
    const lr = D.lessonRec(l.id);
    if (lr) { const box = h('<div class="lrec"></div>'); box.appendChild(LM.playBtn(lr)); box.insertAdjacentHTML('beforeend', LM.wave(lr.id, 44)); pg.appendChild(box); }
    else if (!(Rec.on && recTarget === l.id)) { const b = h('<button class="lrec-btn press">' + I.mic + 'レッスンを録音</button>'); b.onclick = () => recordLesson(l, nav); pg.appendChild(b); }
    pg.appendChild(h('<div class="sh">学んだこと</div>')); pg.appendChild(LM.bullets(l, 'learned'));
    pg.appendChild(h('<div class="sh">宿題</div>')); pg.appendChild(LM.bullets(l, 'homework'));
    pg.appendChild(h('<div class="sh">このレッスン後の個人練</div>'));
    const th = h('<div class="thread"></div>');
    D.practiceOf(l.id).forEach((r) => { const ev = h('<div class="ev"><div class="ed">' + D.fmtDate(r.date) + (r.songId ? ' · ' + esc(D.song(r.songId).title) : '') + '</div><div class="et">' + (esc(r.note) || '（一言なし）') + '</div><div class="er"></div></div>'); ev.querySelector('.er').appendChild(LM.playBtn(r)); th.appendChild(ev); });
    const ad = h('<div class="ev"><button class="lk press">＋ 個人練を記録</button></div>'); ad.querySelector('button').onclick = () => recordPractice(l, nav); th.appendChild(ad);
    pg.appendChild(th);
  },
  song(el, a, nav) {
    const s = D.song(a.id);
    const top = h('<div class="top"><button class="bk">' + I.back + '戻る</button><button class="ic" data-act="rec" aria-label="録音">' + I.mic + '</button></div>');
    top.querySelector('.bk').onclick = () => nav.back();
    top.querySelector('[data-act=rec]').onclick = () => LM.recordSheet(app, { label: s.title, onStop: (dur) => setTimeout(() => LM.afterPracticeSheet(app, { title: '曲の録音', typeId: s.typeId, songId: s.id, dur, onSave: ({ songId, note }) => { D.addRec({ kind: 'song', songId: songId || s.id, dur, note }); toast(app, '録音を保存'); nav.refresh(); } }), 420) });
    el.appendChild(top);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const pg = h('<div class="page"><div class="pt">' + esc(s.title) + '</div><div class="ps">' + esc(s.sub) + '</div></div>'); sc.appendChild(pg);
    const mi = h('<div class="memo-in"><input id="memo-in" placeholder="今日のメモ" autocomplete="off"><button data-tap>追加</button></div>');
    const add = () => { if (D.addMemo(s.id, mi.querySelector('input').value)) { toast(app, D.md(D.TODAY) + 'のメモとして追加'); nav.refresh(); } };
    mi.querySelector('button').onclick = add; mi.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) add(); };
    pg.appendChild(mi);
    pg.appendChild(h('<div class="sh">これまで</div>'));
    const th = h('<div class="thread"></div>');
    D.songTimeline(s.id).forEach((it) => {
      if (it.t === 'memo') th.appendChild(h('<div class="ev"><div class="ed">' + D.fmtDate(it.date, true) + ' · メモ</div><div class="et">' + esc(it.m.text) + '</div></div>'));
      if (it.t === 'rec') { const r = it.r; const ev = h('<div class="ev"><div class="ed">' + D.fmtDate(it.date, true) + ' · ' + (r.kind === 'practice' ? '個人練' : '録音') + '</div><div class="et">' + (esc(r.note) || '') + '</div><div class="er"></div></div>'); ev.querySelector('.er').appendChild(LM.playBtn(r)); th.appendChild(ev); }
      if (it.t === 'lesson') { const ev = h('<div class="ev l"><div class="ed">' + D.fmtDate(it.date, true) + '</div><button class="lk press" data-tap>レッスン</button></div>'); ev.querySelector('button').onclick = () => nav.push('lesson', { id: it.l.id }); th.appendChild(ev); }
    });
    pg.appendChild(th);
  },
};
const nav = makeNav(stage, screens);
LM.chrome(app, () => { const l = recTarget && D.lesson(recTarget); if (l) recordLesson(l, nav); });
nav.root('home');
window.__nav = nav;
</script>
</body>
</html>
