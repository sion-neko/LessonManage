<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D 録音が先</title>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="flows.css">
<style>
/* D：まず録る、何の録音かはあとで選ぶ。夜の紺とはちみつ色 */
:root {
  --desk: #10151f; --bg: #141b27; --card: #1d2635; --fg: #eef1f6; --muted: #8b97aa; --line: #2b3546;
  --accent: #f2b544; --on-accent: #1a1406; --rec: #ff5a52; --field: #1d2635; --sheet: #182131; --bullet: #f2b544;
}
.statusbar { color: var(--fg); }
.top { padding: 54px 20px 4px; display: flex; justify-content: space-between; align-items: flex-end; }
.top .dt { font-size: 13px; color: var(--muted); }
.top h1 { margin: 2px 0 0; font-size: 24px; font-weight: 700; }
.top .ics { display: flex; gap: 8px; }
.top .ics button { width: 38px; height: 38px; border-radius: 12px; background: var(--card); display: grid; place-items: center; color: var(--fg); }
.bk { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; }
.now { display: grid; gap: 10px; padding: 12px 20px 4px; }
.nc { background: var(--card); border-radius: 16px; padding: 13px 15px; text-align: left; width: 100%; }
.nc .nh { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.nc .nh b { color: var(--accent); font-weight: 700; }
.nc ul { margin: 6px 0 0; padding: 0 0 0 16px; font-size: 15px; line-height: 1.5; }
.nc .nl { margin-top: 6px; font-size: 13px; color: var(--muted); }
.grp-h { font-size: 13px; color: var(--muted); padding: 18px 20px 6px; font-weight: 600; }
.rr { display: flex; align-items: center; gap: 12px; padding: 11px 20px; border-bottom: 1px solid var(--line); }
.rr .rk { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.rr .rb { flex: 1; min-width: 0; }
.rr .rb b { font-size: 15px; font-weight: 600; display: block; }
.rr .rb small { color: var(--muted); font-size: 13px; }
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 0 30px; background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; justify-content: center; z-index: 20; }
.big-rec { width: 78px; height: 78px; border-radius: 50%; border: 4px solid var(--fg); display: grid; place-items: center; }
.big-rec span { width: 60px; height: 60px; border-radius: 50%; background: var(--rec); transition: all .3s ease; }
.big-rec.on span { width: 30px; height: 30px; border-radius: 8px; }
.dock .lbl { position: absolute; bottom: 10px; font-size: 12px; color: var(--muted); }
.live { position: absolute; left: 16px; right: 16px; bottom: 120px; background: var(--card); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 21; color: var(--rec); font-weight: 600; }
.live .tm { flex: 1; font-variant-numeric: tabular-nums; color: var(--fg); }
.page { padding: 4px 20px 60px; }
.page .pt { font-size: 26px; font-weight: 700; }
.page .ps { color: var(--muted); font-size: 14px; margin-top: 2px; }
.sh { font-size: 13px; color: var(--accent); margin: 24px 0 4px; font-weight: 700; letter-spacing: .04em; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { padding: 5px 11px; border-radius: 10px; background: var(--card); font-size: 13px; }
.tag.add { color: var(--accent); }
.lrec { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px; border-radius: 14px; background: var(--card); }
.lrec .wave { flex: 1; overflow: hidden; color: var(--accent); }
.pr { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pr .d { width: 40px; color: var(--muted); font-size: 13px; }
.pr .n { flex: 1; min-width: 0; font-size: 15px; }
.pr .n small { display: block; color: var(--muted); font-size: 12px; }
.memo-in { display: flex; gap: 8px; margin-top: 8px; }
.memo-in input { flex: 1; padding: 11px 12px; border-radius: 12px; border: 0; background: var(--card); font-size: 16px; outline: none; }
.memo-in button { padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.memo { padding: 10px 0; border-bottom: 1px solid var(--line); }
.memo .d { font-size: 12px; color: var(--muted); }
.memo .t { font-size: 15px; line-height: 1.5; }
.cls { display: flex; flex-direction: column; gap: 8px; }
.cls .q { font-size: 19px; font-weight: 700; display: flex; justify-content: space-between; }
.cls .q span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.opt { text-align: left; padding: 13px 15px; border-radius: 14px; background: var(--card); border: 2px solid transparent; }
.opt b { display: block; font-size: 15px; }
.opt small { color: var(--muted); font-size: 13px; }
.opt.on { border-color: var(--accent); }
.cls .k { font-size: 13px; color: var(--muted); margin-top: 8px; }
.list a, .list button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 20px; border-bottom: 1px solid var(--line); text-align: left; color: var(--fg); }
.list small { display: block; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="core.js"></script>
<script src="flows.js"></script>
<script>
const { D, Rec, makeNav, esc, h, I, toast, sheet } = LM;
const app = document.getElementById('app');
const stage = document.createElement('div'); stage.style.cssText = 'position:absolute;inset:0'; app.appendChild(stage);
const kindColor = { lesson: 'var(--accent)', practice: '#6fb6ff', song: '#b48cff' };
function recLabel(r) {
  if (r.kind === 'lesson') { const l = D.lesson(r.lessonId); return [D.type(l.typeId).name + 'のレッスン', D.type(l.typeId).teacher]; }
  if (r.kind === 'practice') { const l = D.lesson(r.lessonId); return [(r.note || '個人練'), '個人練 · ' + D.md(l.date) + 'のレッスン後' + (r.songId ? ' · ' + D.song(r.songId).title : '')]; }
  return [(r.note || '曲の録音'), D.song(r.songId).title];
}

// 録音を止めたあとに「何の録音か」を選ぶ
function classify(dur, nav, preset) {
  let choice = preset || null; let song = null; let note = '';
  sheet(app, (el, close) => {
    const draw = () => {
      const opts = [];
      D.S.types.forEach((t) => { const l = D.latest(t.id); if (l) opts.push({ k: 'p:' + l.id, b: '個人練 · ' + t.name, s: D.fmtDate(l.date) + 'のレッスンの後' }); });
      D.S.types.forEach((t) => opts.push({ k: 'l:' + t.id, b: t.name + 'のレッスン', s: '今日の新しいレッスンとして' }));
      opts.push({ k: 's', b: '曲だけ', s: 'レッスンとは関係なく' });
      let typeId = null, lesson = null;
      if (choice && choice.startsWith('p:')) { lesson = D.lesson(choice.slice(2)); typeId = lesson.typeId; }
      if (choice === 's') typeId = null;
      const songs = choice === 's' ? D.S.songs : typeId ? (lesson.songIds.length ? lesson.songIds.map(D.song).concat(D.songsOf(typeId).filter((s) => !lesson.songIds.includes(s.id))) : D.songsOf(typeId)) : [];
      el.innerHTML = '<div class="cls"><div class="q">何の録音？<span>' + D.dur(dur) + '</span></div>' +
        opts.map((o) => '<button class="opt press' + (choice === o.k ? ' on' : '') + '" data-k="' + o.k + '"><b>' + esc(o.b) + '</b><small>' + esc(o.s) + '</small></button>').join('') +
        (songs.length ? '<div class="k">曲</div><div class="chips">' + songs.map((s) => '<button class="chip press' + (song === s.id ? ' on' : '') + '" data-s="' + s.id + '">' + esc(s.title) + '</button>').join('') + '</div>' : '') +
        (choice && !choice.startsWith('l:') ? '<div class="k">一言</div><input id="cls-note" class="ap-note" placeholder="例：移動は安定してきた">' : '') +
        '<button class="ap-save press" data-act="save"' + (choice ? '' : ' disabled style="opacity:.4"') + '>保存</button></div>';
      const ni = el.querySelector('#cls-note'); if (ni) { ni.value = note; ni.oninput = () => (note = ni.value); }
      el.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { choice = b.dataset.k; song = null; draw(); }));
      el.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => { song = song === b.dataset.s ? null : b.dataset.s; draw(); }));
      el.querySelector('[data-act=save]').onclick = () => {
        if (!choice) return; close();
        if (choice.startsWith('p:')) { D.addRec({ kind: 'practice', lessonId: choice.slice(2), songId: song, dur, note }); toast(app, '個人練を保存'); nav.refresh(); }
        else if (choice.startsWith('l:')) { const l = D.addLesson(choice.slice(2)); D.addRec({ kind: 'lesson', lessonId: l.id, dur }); setTimeout(() => nav.push('lesson', { id: l.id }), 380); }
        else { if (!song) { toast(app, '曲を選んでください'); return; } D.addRec({ kind: 'song', songId: song, dur, note }); toast(app, '録音を保存'); nav.refresh(); }
      };
    };
    draw();
  }, { modal: true });
}

function startRec(nav, preset) {
  LM.recordSheet(app, { label: '録音', minimizable: true, ctx: { preset }, onMin: () => nav.refresh(), onStop: (dur) => setTimeout(() => classify(dur, nav, preset), 420) });
}

const screens = {
  home(el, a, nav) {
    const top = h('<div class="top"><div><div class="dt">' + D.fmtDate(D.TODAY) + '</div><h1>いまの宿題</h1></div><div class="ics"><button data-act="lessons" aria-label="レッスン">' + I.list + '</button><button data-act="songs" aria-label="曲">' + I.note + '</button></div></div>');
    top.querySelector('[data-act=lessons]').onclick = () => nav.push('lessons');
    top.querySelector('[data-act=songs]').onclick = () => nav.push('songs');
    el.appendChild(top);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const now = h('<div class="now"></div>');
    D.S.types.forEach((t) => {
      const l = D.latest(t.id); if (!l) return; const pr = D.practiceOf(l.id);
      const c = h('<button class="nc press"><div class="nh"><b>' + esc(t.name) + '</b><span>' + D.fmtDate(l.date) + ' · 個人練 ' + pr.length + '回</span></div><ul>' + l.homework.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></button>');
      c.onclick = () => nav.push('lesson', { id: l.id }); now.appendChild(c);
    });
    sc.appendChild(now);
    let last = '';
    D.allRecs().slice(0, 12).forEach((r) => {
      if (r.date !== last) { last = r.date; sc.appendChild(h('<div class="grp-h">' + D.fmtDate(r.date) + '</div>')); }
      const [b, s] = recLabel(r);
      const row = h('<div class="rr"><span class="rk" style="background:' + kindColor[r.kind] + '"></span><div class="rb"><b>' + esc(b) + '</b><small>' + esc(s) + '</small></div></div>');
      row.appendChild(LM.playBtn(r)); sc.appendChild(row);
    });
    sc.appendChild(h('<div style="height:140px"></div>'));
    if (Rec.on) {
      const lv = h('<div class="live"><span>●</span><span class="tm">録音中 ' + D.dur(Rec.sec) + '</span><button class="pb" data-tap>ひらく</button></div>');
      const un = Rec.sub(() => { if (!Rec.on) return un(); lv.querySelector('.tm').textContent = '録音中 ' + D.dur(Rec.sec); });
      lv.querySelector('button').onclick = () => startRec(nav, Rec.ctx && Rec.ctx.preset);
      el.appendChild(lv);
    }
    const dock = h('<div class="dock"><button class="big-rec press' + (Rec.on ? ' on' : '') + '" aria-label="録音"><span></span></button></div>');
    dock.querySelector('button').onclick = () => startRec(nav);
    el.appendChild(dock);
  },
  lessons(el, a, nav) {
    const top = h('<div class="top"><button class="bk">' + I.back + '戻る</button><span></span></div>'); top.querySelector('.bk').onclick = () => nav.back(); el.appendChild(top);
    const sc = h('<div class="scroll"><div class="page" style="padding-bottom:6px"><div class="pt">レッスン</div></div></div>'); el.appendChild(sc);
    D.S.types.forEach((t) => {
      sc.appendChild(h('<div class="grp-h">' + esc(t.name) + ' · ' + esc(t.teacher) + '</div>'));
      const list = h('<div class="list"></div>');
      D.lessonsOf(t.id).forEach((l) => { const b = h('<button data-tap><span>' + D.fmtDate(l.date, true) + '<small>' + esc(l.learned[0] || '') + '</small></span>' + I.chev + '</button>'); b.onclick = () => nav.push('lesson', { id: l.id }); list.appendChild(b); });
      sc.appendChild(list);
    });
  },
  songs(el, a, nav) {
    const top = h('<div class="top"><button class="bk">' + I.back + '戻る</button><span></span></div>'); top.querySelector('.bk').onclick = () => nav.back(); el.appendChild(top);
    const sc = h('<div class="scroll"><div class="page" style="padding-bottom:6px"><div class="pt">曲</div></div></div>'); el.appendChild(sc);
    D.S.types.forEach((t) => {
      sc.appendChild(h('<div class="grp-h">' + esc(t.name) + '</div>'));
      const list = h('<div class="list"></div>');
      D.songsOf(t.id).forEach((s) => { const la = D.lastActivity(s.id); const b = h('<button data-tap><span>' + esc(s.title) + '<small>' + esc(s.sub) + (la ? ' · ' + D.rel(la) : '') + '</small></span>' + I.chev + '</button>'); b.onclick = () => nav.push('song', { id: s.id }); list.appendChild(b); });
      sc.appendChild(list);
    });
  },
  lesson(el, a, nav) {
    const l = D.lesson(a.id); const t = D.type(l.typeId);
    const top = h('<div class="top"><button class="bk">' + I.back + '戻る</button><span></span></div>'); top.querySelector('.bk').onclick = () => nav.back(); el.appendChild(top);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const pg = h('<div class="page"><div class="pt">' + D.fmtDate(l.date, true) + '</div><div class="ps">' + esc(t.name) + ' · ' + esc(t.teacher) + '</div></div>'); sc.appendChild(pg);
    const tags = h('<div class="tags">' + l.songIds.map((id) => '<button class="tag press" data-s="' + id + '">' + esc(D.song(id).title) + '</button>').join('') + '<button class="tag add press" data-act="songs">' + (l.songIds.length ? '曲を編集' : '＋ 扱った曲') + '</button></div>');
    tags.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => nav.push('song', { id: b.dataset.s })));
    tags.querySelector('[data-act=songs]').onclick = () => LM.songPicker(app, l, () => nav.refresh());
    pg.appendChild(tags);
    const lr = D.lessonRec(l.id);
    if (lr) { const box = h('<div class="lrec"></div>'); box.appendChild(LM.playBtn(lr)); box.insertAdjacentHTML('beforeend', LM.wave(lr.id, 44)); pg.appendChild(box); }
    pg.appendChild(h('<div class="sh">学んだこと</div>')); pg.appendChild(LM.bullets(l, 'learned'));
    pg.appendChild(h('<div class="sh">宿題</div>')); pg.appendChild(LM.bullets(l, 'homework'));
    pg.appendChild(h('<div class="sh">このレッスン後の個人練</div>'));
    D.practiceOf(l.id).forEach((r) => { const row = h('<div class="pr"><span class="d">' + D.md(r.date) + '</span><span class="n">' + (esc(r.note) || '（一言なし）') + (r.songId ? '<small>' + esc(D.song(r.songId).title) + '</small>' : '') + '</span></div>'); row.appendChild(LM.playBtn(r)); pg.appendChild(row); });
    const ad = h('<button class="bk press" style="margin-top:12px">' + I.mic + ' 個人練を記録</button>'); ad.onclick = () => LM.practiceStand(app, { lesson: l, onStop: (dur) => LM.afterPracticeSheet(app, { lesson: l, dur, onSave: ({ songId, note }) => { D.addRec({ kind: 'practice', lessonId: l.id, songId, dur, note }); toast(app, '個人練を保存'); nav.refresh(); } }) }); pg.appendChild(ad);
  },
  song(el, a, nav) {
    const s = D.song(a.id);
    const top = h('<div class="top"><button class="bk">' + I.back + '戻る</button><span></span></div>'); top.querySelector('.bk').onclick = () => nav.back(); el.appendChild(top);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const pg = h('<div class="page"><div class="pt">' + esc(s.title) + '</div><div class="ps">' + esc(s.sub) + '</div></div>'); sc.appendChild(pg);
    pg.appendChild(h('<div class="sh">メモ</div>'));
    const mi = h('<div class="memo-in"><input id="memo-in" placeholder="今日のメモ" autocomplete="off"><button data-tap>追加</button></div>');
    const add = () => { if (D.addMemo(s.id, mi.querySelector('input').value)) { toast(app, D.md(D.TODAY) + 'のメモとして追加'); nav.refresh(); } };
    mi.querySelector('button').onclick = add; mi.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) add(); };
    pg.appendChild(mi);
    D.memosOf(s.id).forEach((m) => pg.appendChild(h('<div class="memo"><div class="d">' + D.fmtDate(m.date, true) + '</div><div class="t">' + esc(m.text) + '</div></div>')));
    pg.appendChild(h('<div class="sh">録音</div>'));
    D.recsOfSong(s.id).forEach((r) => { const row = h('<div class="pr"><span class="d">' + D.md(r.date) + '</span><span class="n">' + (esc(r.note) || '（一言なし）') + '<small>' + (r.kind === 'practice' ? D.md(D.lesson(r.lessonId).date) + 'のレッスン後' : '曲の録音') + '</small></span></div>'); row.appendChild(LM.playBtn(r)); pg.appendChild(row); });
    pg.appendChild(h('<div class="sh">扱ったレッスン</div>'));
    D.lessonsOfSong(s.id).forEach((l) => { const b = h('<button class="pr" style="width:100%;text-align:left" data-tap><span class="n">' + D.fmtDate(l.date, true) + '</span>' + I.chev + '</button>'); b.onclick = () => nav.push('lesson', { id: l.id }); pg.appendChild(b); });
  },
};
const nav = makeNav(stage, screens);
LM.chrome(app, () => startRec(nav, Rec.ctx && Rec.ctx.preset));
nav.root('home');
window.__nav = nav;
</script>
</body>
</html>
