<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E 曲が軸</title>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="flows.css">
<style>
/* E：曲ごとのページをメッセージのように積み上げる。白地に深い緑 */
:root {
  --desk: #e5ebe8; --bg: #ffffff; --card: #f3f6f4; --fg: #17221d; --muted: #7d8b84; --line: #e2e8e5;
  --accent: #1f7a57; --on-accent: #fff; --rec: #e5484d; --field: #f3f6f4; --sheet: #ffffff; --bullet: #9fb7ab;
  --bub: #1f7a57; --bub-fg: #ffffff;
}
.top { padding: 54px 20px 6px; display: flex; justify-content: space-between; align-items: center; }
.top h1 { margin: 0; font-size: 30px; font-weight: 800; }
.top .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--accent); }
.bk { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; }
.hwk { margin: 6px 20px 0; border-radius: 18px; background: var(--card); padding: 4px 16px; }
.hwk button { display: block; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.hwk button:last-child { border-bottom: 0; }
.hwk .hh { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.hwk .hh b { color: var(--accent); }
.hwk ul { margin: 4px 0 0; padding: 0 0 0 16px; font-size: 15px; line-height: 1.5; }
.sec { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 20px 8px; }
.sec b { font-size: 19px; }
.sec span { font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; }
.sc { position: relative; text-align: left; border-radius: 18px; border: 1px solid var(--line); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; background: var(--bg); }
.sc .st { font-size: 16px; font-weight: 700; line-height: 1.3; }
.sc .ss { font-size: 12px; color: var(--muted); }
.sc .sm { font-size: 13px; line-height: 1.45; color: var(--fg); opacity: .85; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sc .sf { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.sc .mic { width: 30px; height: 30px; border-radius: 50%; background: var(--card); color: var(--accent); display: grid; place-items: center; }
.sc .mic svg { width: 16px; height: 16px; }
.tabbar { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); padding: 6px 0 28px; background: var(--bg); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); }
.tab.on { color: var(--accent); }
/* 曲ページ：メッセージ風 */
.chat-h { padding: 52px 12px 8px; display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
.chat-h .ct { text-align: center; }
.chat-h .ct { min-width: 0; }
.chat-h .ct b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-h .ct small { color: var(--muted); font-size: 12px; }
.log { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.div { align-self: center; font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
.lmark { align-self: center; display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 14px; padding: 6px 12px; font-size: 13px; color: var(--accent); font-weight: 600; margin: 4px 0; }
.bub { align-self: flex-end; max-width: 78%; background: var(--bub); color: var(--bub-fg); padding: 9px 13px; border-radius: 18px 18px 6px 18px; font-size: 15px; line-height: 1.45; }
.rbub { align-self: flex-end; max-width: 82%; background: var(--card); padding: 8px 12px 8px 8px; border-radius: 18px 18px 6px 18px; display: flex; flex-direction: column; gap: 4px; }
.rbub .rl { font-size: 12px; color: var(--muted); padding-left: 4px; }
.rbub .rt { font-size: 14px; padding-left: 4px; }
.rbub .rr { display: flex; align-items: center; gap: 8px; }
.rbub .wave { color: var(--accent); }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 12px 30px; border-top: 1px solid var(--line); background: var(--bg); }
.composer .send, .composer .rec { flex: none; white-space: nowrap; }
.composer input { min-width: 0; flex: 1; height: 40px; border-radius: 20px; border: 1px solid var(--line); padding: 0 14px; font-size: 16px; outline: none; background: var(--bg); }
.composer .send { height: 40px; padding: 0 14px; border-radius: 20px; background: var(--accent); color: #fff; font-weight: 700; }
.composer .rec { width: 40px; height: 40px; border-radius: 50%; background: var(--card); color: var(--rec); display: grid; place-items: center; }
.page { padding: 4px 20px 60px; }
.page .pt { font-size: 26px; font-weight: 800; }
.page .ps { color: var(--muted); font-size: 14px; margin-top: 2px; }
.sh { font-size: 13px; color: var(--accent); margin: 24px 0 2px; font-weight: 700; letter-spacing: .04em; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { padding: 6px 12px; border-radius: 14px; background: var(--card); font-size: 13px; display: flex; align-items: center; gap: 4px; }
.tag.add { color: var(--accent); }
.lrec { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px; border-radius: 14px; background: var(--card); }
.lrec .wave { flex: 1; overflow: hidden; color: var(--accent); }
.lrec-btn { width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--card); color: var(--rec); font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; }
.pr { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pr .d { width: 40px; color: var(--muted); font-size: 13px; }
.pr .n { flex: 1; min-width: 0; font-size: 15px; }
.pr .n small { display: block; color: var(--muted); font-size: 12px; }
.recbar { display: flex; align-items: center; gap: 10px; margin: 6px 20px; padding: 10px 14px; border-radius: 14px; background: #fdecec; color: var(--rec); font-weight: 600; }
.recbar .tm { flex: 1; font-variant-numeric: tabular-nums; }
.recbar button { background: var(--rec); color: #fff; border-radius: 14px; padding: 5px 12px; font-size: 14px; }
.list button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 20px; border-bottom: 1px solid var(--line); text-align: left; }
.list small { display: block; color: var(--muted); font-size: 13px; }
.grp-h { font-size: 13px; color: var(--muted); padding: 18px 20px 4px; font-weight: 600; }
.fab { position: absolute; right: 20px; bottom: 96px; height: 50px; padding: 0 18px; border-radius: 25px; background: var(--accent); color: #fff; display: flex; align-items: center; gap: 6px; font-weight: 700; box-shadow: 0 6px 16px rgba(31,122,87,.3); z-index: 20; }
.tg { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--card); font-size: 15px; text-align: left; }
.tg .bx { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; flex: none; }
.tg.on .bx { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script src="core.js"></script>
<script src="flows.js"></script>
<script>
const { D, Rec, makeNav, esc, h, I, toast, sheet } = LM;
const app = document.getElementById('app');
const stage = document.createElement('div'); stage.style.cssText = 'position:absolute;inset:0'; app.appendChild(stage);
let tab = 'home'; let recTarget = null;
const check = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

function tabbar(nav) {
  const el = h('<div class="tabbar">' + [['home', 'ホーム', I.home], ['lessons', 'レッスン', I.list]].map(([k, n, ic]) => '<button class="tab' + (tab === k ? ' on' : '') + '" data-k="' + k + '">' + ic + n + '</button>').join('') + '</div>');
  el.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { if (tab !== b.dataset.k) { tab = b.dataset.k; nav.root(tab); } }));
  return el;
}
function recBar(nav) {
  if (!Rec.on || !recTarget) return null;
  const el = h('<div class="recbar"><span>●</span><span class="tm">録音中 ' + D.dur(Rec.sec) + '</span><button data-tap>停止</button></div>');
  const un = Rec.sub(() => { if (!Rec.on) return un(); el.querySelector('.tm').textContent = '録音中 ' + D.dur(Rec.sec); });
  el.querySelector('button').onclick = () => { const r = Rec.stop(); D.addRec({ kind: 'lesson', lessonId: recTarget, dur: r.dur }); recTarget = null; toast(app, 'レッスンの録音を保存'); nav.refresh(); };
  return el;
}
function recordLesson(lesson, nav) {
  recTarget = lesson.id;
  LM.recordSheet(app, { label: D.md(lesson.date) + ' ' + D.type(lesson.typeId).name + 'のレッスン', minimizable: true, onMin: () => nav.refresh(),
    onStop: (dur) => { D.addRec({ kind: 'lesson', lessonId: lesson.id, dur }); recTarget = null; toast(app, 'レッスンの録音を保存'); nav.refresh(); } });
}
// 曲から録る。直近のレッスン後の個人練として扱うのが既定
function recordSong(s, nav) {
  LM.recordSheet(app, { label: s.title, onStop: (dur) => setTimeout(() => {
    const l = D.latest(s.typeId); let link = !!l; let note = '';
    sheet(app, (el, close) => {
      const draw = () => {
        el.innerHTML = '<div class="ap"><div class="ap-head"><span class="ap-title">' + esc(s.title) + '</span><span class="ap-dur">' + D.dur(dur) + '</span></div>' +
          '<div class="ap-k">一言</div><input id="e-note" class="ap-note" placeholder="例：サビの高音が少し楽に" autocomplete="off">' +
          (l ? '<button class="tg press' + (link ? ' on' : '') + '" data-act="tg"><span class="bx">' + (link ? check : '') + '</span><span>' + D.fmtDate(l.date) + 'のレッスン後の個人練にする</span></button>' : '') +
          '<button class="ap-save press" data-act="save">保存</button></div>';
        const ni = el.querySelector('#e-note'); ni.value = note; ni.oninput = () => (note = ni.value);
        const tg = el.querySelector('[data-act=tg]'); if (tg) tg.onclick = () => { link = !link; draw(); };
        el.querySelector('[data-act=save]').onclick = () => { close(); D.addRec(link ? { kind: 'practice', lessonId: l.id, songId: s.id, dur, note } : { kind: 'song', songId: s.id, dur, note }); toast(app, '録音を保存'); nav.refresh(); };
      };
      draw();
    }, { modal: true });
  }, 420) });
}
function recordPractice(lesson, nav) {
  LM.practiceStand(app, { lesson, onStop: (dur) => setTimeout(() => LM.afterPracticeSheet(app, { lesson, dur, onSave: ({ songId, note }) => { D.addRec({ kind: 'practice', lessonId: lesson.id, songId, dur, note }); toast(app, '個人練を保存'); nav.refresh(); } }), 420) });
}

const screens = {
  home(el, a, nav) {
    el.appendChild(h('<div class="top"><h1>練習ノート</h1><span></span></div>'));
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const rb = recBar(nav); if (rb) sc.appendChild(rb);
    const hw = h('<div class="hwk"></div>');
    D.S.types.forEach((t) => {
      const l = D.latest(t.id); if (!l) return;
      const b = h('<button data-tap><div class="hh"><b>' + esc(t.name) + 'の宿題</b><span>' + D.fmtDate(l.date) + ' · 個人練 ' + D.practiceOf(l.id).length + '回</span></div><ul>' + l.homework.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></button>');
      b.onclick = () => nav.push('lesson', { id: l.id }); hw.appendChild(b);
    });
    sc.appendChild(hw);
    D.S.types.forEach((t) => {
      const songs = D.songsOf(t.id).sort((a, b) => ((D.lastActivity(b.id) || '') > (D.lastActivity(a.id) || '') ? 1 : -1));
      sc.appendChild(h('<div class="sec"><b>' + esc(t.name) + 'の曲</b><span>' + songs.length + '曲</span></div>'));
      const g = h('<div class="grid"></div>');
      songs.forEach((s) => {
        const m = D.memosOf(s.id)[0]; const la = D.lastActivity(s.id);
        const c = h('<div class="sc press" data-tap role="button"><span class="st">' + esc(s.title) + '</span><span class="ss">' + esc(s.sub) + '</span><span class="sm">' + esc(m ? m.text : '') + '</span><span class="sf"><span>' + (la ? D.rel(la) : 'まだ記録なし') + '</span><button class="mic" aria-label="録音">' + I.mic + '</button></span></div>');
        c.onclick = () => nav.push('song', { id: s.id });
        c.querySelector('.mic').onclick = (e) => { e.stopPropagation(); recordSong(s, nav); };
        g.appendChild(c);
      });
      sc.appendChild(g);
    });
    sc.appendChild(h('<div style="height:30px"></div>'));
    el.appendChild(tabbar(nav));
  },
  lessons(el, a, nav) {
    el.appendChild(h('<div class="top"><h1>レッスン</h1><span></span></div>'));
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    D.S.types.forEach((t) => {
      sc.appendChild(h('<div class="grp-h">' + esc(t.name) + ' · ' + esc(t.teacher) + '</div>'));
      const list = h('<div class="list"></div>');
      D.lessonsOf(t.id).forEach((l) => { const b = h('<button data-tap><span>' + D.fmtDate(l.date, true) + '<small>' + esc(l.learned[0] || '（まだ何も書いていない）') + '</small></span>' + I.chev + '</button>'); b.onclick = () => nav.push('lesson', { id: l.id }); list.appendChild(b); });
      sc.appendChild(list);
    });
    sc.appendChild(h('<div style="height:100px"></div>'));
    const fab = h('<button class="fab press">' + I.plus + 'レッスン</button>');
    fab.onclick = () => LM.typePicker(app, { onPick: (tid) => { const l = D.addLesson(tid); nav.push('lesson', { id: l.id }); } });
    el.appendChild(fab);
    el.appendChild(tabbar(nav));
  },
  lesson(el, a, nav) {
    const l = D.lesson(a.id); const t = D.type(l.typeId);
    const top = h('<div class="top"><button class="bk">' + I.back + '戻る</button><span></span></div>'); top.querySelector('.bk').onclick = () => nav.back(); el.appendChild(top);
    const rb = recBar(nav); if (rb) el.appendChild(rb);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const pg = h('<div class="page"><div class="pt">' + D.fmtDate(l.date, true) + '</div><div class="ps">' + esc(t.name) + ' · ' + esc(t.teacher) + '</div></div>'); sc.appendChild(pg);
    const tags = h('<div class="tags">' + l.songIds.map((id) => '<button class="tag press" data-s="' + id + '">' + esc(D.song(id).title) + I.chev + '</button>').join('') + '<button class="tag add press" data-act="songs">' + (l.songIds.length ? '曲を編集' : '＋ 扱った曲') + '</button></div>');
    tags.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => nav.push('song', { id: b.dataset.s })));
    tags.querySelector('[data-act=songs]').onclick = () => LM.songPicker(app, l, () => nav.refresh());
    pg.appendChild(tags);
    const lr = D.lessonRec(l.id);
    if (lr) { const box = h('<div class="lrec"></div>'); box.appendChild(LM.playBtn(lr)); box.insertAdjacentHTML('beforeend', LM.wave(lr.id, 44)); pg.appendChild(box); }
    else if (!(Rec.on && recTarget === l.id)) { const b = h('<button class="lrec-btn press">' + I.mic + 'レッスンを録音</button>'); b.onclick = () => recordLesson(l, nav); pg.appendChild(b); }
    pg.appendChild(h('<div class="sh">学んだこと</div>')); pg.appendChild(LM.bullets(l, 'learned'));
    pg.appendChild(h('<div class="sh">宿題</div>')); pg.appendChild(LM.bullets(l, 'homework'));
    pg.appendChild(h('<div class="sh">このレッスン後の個人練</div>'));
    D.practiceOf(l.id).forEach((r) => { const row = h('<div class="pr"><span class="d">' + D.md(r.date) + '</span><span class="n">' + (esc(r.note) || '（一言なし）') + (r.songId ? '<small>' + esc(D.song(r.songId).title) + '</small>' : '') + '</span></div>'); row.appendChild(LM.playBtn(r)); pg.appendChild(row); });
    const ad = h('<button class="bk press" style="margin-top:12px">' + I.mic + ' 個人練を記録</button>'); ad.onclick = () => recordPractice(l, nav); pg.appendChild(ad);
  },
  song(el, a, nav) {
    const s = D.song(a.id);
    const hd = h('<div class="chat-h"><button class="bk">' + I.back + '戻る</button><div class="ct"><b>' + esc(s.title) + '</b><small>' + esc(s.sub) + '</small></div><span></span></div>');
    hd.querySelector('.bk').onclick = () => nav.back(); el.appendChild(hd);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const log = h('<div class="log"></div>');
    const ord = { lesson: 0, memo: 1, rec: 2 };
    const items = D.songTimeline(s.id).slice().sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : ord[x.t] - ord[y.t]));
    let last = '';
    items.forEach((it) => {
      if (it.date !== last) { last = it.date; log.appendChild(h('<div class="div">' + D.fmtDate(it.date, true) + '</div>')); }
      if (it.t === 'lesson') { const b = h('<button class="lmark press">' + esc(D.type(it.l.typeId).name) + 'のレッスン' + I.chev + '</button>'); b.onclick = () => nav.push('lesson', { id: it.l.id }); log.appendChild(b); }
      if (it.t === 'memo') log.appendChild(h('<div class="bub">' + esc(it.m.text) + '</div>'));
      if (it.t === 'rec') {
        const r = it.r; const lab = r.kind === 'practice' ? D.md(D.lesson(r.lessonId).date) + 'のレッスン後の個人練' : '録音';
        const b = h('<div class="rbub"><span class="rl">' + lab + '</span>' + (r.note ? '<span class="rt">' + esc(r.note) + '</span>' : '') + '<div class="rr"></div></div>');
        b.querySelector('.rr').appendChild(LM.playBtn(r)); b.querySelector('.rr').insertAdjacentHTML('beforeend', LM.wave(r.id, 18));
        log.appendChild(b);
      }
    });
    sc.appendChild(log);
    const cp = h('<div class="composer"><button class="rec press" aria-label="録音">' + I.mic + '</button><input id="e-memo" placeholder="メモ" autocomplete="off"><button class="send press">追加</button></div>');
    const add = () => { if (D.addMemo(s.id, cp.querySelector('input').value)) nav.refresh(); };
    cp.querySelector('.send').onclick = add; cp.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) add(); };
    cp.querySelector('.rec').onclick = () => recordSong(s, nav);
    el.appendChild(cp);
    requestAnimationFrame(() => { sc.scrollTop = sc.scrollHeight; });
  },
};
const nav = makeNav(stage, screens);
LM.chrome(app, () => { const l = recTarget && D.lesson(recTarget); if (l) recordLesson(l, nav); });
nav.root('home');
window.__nav = nav;
</script>
</body>
</html>
