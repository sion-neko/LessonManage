<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G2 欄を分けて書き分け</title>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="flows.css">
<style>
/* G：Cの画面構成（種類ごとに1画面・宿題を大きく・個人練ボタン）を、メモ帳式の見た目で。曲ページは「まとめ」と「チャット」を切り替え */
:root {
  --desk: #e7e7ec; --bg: #f2f2f7; --card: #ffffff; --fg: #1c1c1e; --muted: #8a8a8e; --line: #dcdce1;
  --accent: #d29b00; --accent-d: #a87a00; --on-accent: #fff; --rec: #ff3b30; --field: #ffffff; --sheet: #f2f2f7; --bullet: #c7c7cc;
  --t-bg: #ffffff; --me-bg: #fff3c4; --teacher: #3a6ea5;
}
.head { padding: 54px 16px 4px; }
.types { display: flex; background: #e3e3e8; border-radius: 10px; padding: 2px; }
.types button { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--fg); }
.types button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.lh { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 32px 6px; font-size: 13px; color: var(--muted); }
.lh button { color: var(--accent); font-size: 14px; display: flex; align-items: center; }
.grp { margin: 0 16px; background: var(--card); border-radius: 12px; padding: 4px 16px; }
.hw li { font-size: 19px; font-weight: 700; line-height: 1.45; padding: 11px 0; border-bottom: .5px solid var(--line); list-style: none; }
.hw li:last-child { border-bottom: 0; }
.hw, .lr { margin: 0; padding: 0; }
.lr li { list-style: none; position: relative; padding: 8px 0 8px 0; font-size: 16px; line-height: 1.5; border-bottom: .5px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
.lr li:last-child { border-bottom: 0; }
.who { flex: none; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; line-height: 1.6; }
.who.t { color: var(--teacher); background: #e6eef7; }
.who.m { color: #8a6500; background: var(--me-bg); }
.go { display: flex; align-items: center; justify-content: center; gap: 10px; width: calc(100% - 32px); margin: 18px 16px 0; height: 56px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 4px 0 var(--accent-d); transition: transform .12s ease, box-shadow .12s ease; }
.go:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-d); }
.prs { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; scrollbar-width: none; }
.prs::-webkit-scrollbar { display: none; }
.pc { flex: 0 0 156px; background: var(--card); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.pc .d { font-size: 12px; color: var(--muted); }
.pc .n { font-size: 14px; line-height: 1.4; min-height: 40px; }
.tabbar { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: .5px solid var(--line); background: rgba(249,249,249,.94); padding: 6px 0 28px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); }
.tab.on { color: var(--accent); }
.nav { padding: 54px 16px 4px; display: flex; align-items: center; justify-content: space-between; min-height: 92px; }
.nav .bk { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; margin-left: -6px; }
.ttl { padding: 0 20px; }
.ttl b { display: block; font-size: 28px; font-weight: 700; line-height: 1.25; }
.ttl span { color: var(--muted); font-size: 15px; }
.songs { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px 0; }
.songs button { padding: 6px 12px; border-radius: 8px; background: var(--card); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.songs button svg { color: var(--accent); width: 15px; height: 15px; }
.sec { font-size: 13px; color: var(--muted); padding: 22px 32px 7px; display: flex; justify-content: space-between; align-items: baseline; }
.sec .hint { font-size: 12px; }
.recbox { margin: 0 16px; background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.recbox .wave { flex: 1; color: var(--fg); overflow: hidden; }
.recbtn { width: calc(100% - 32px); margin: 0 16px; background: var(--card); border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--rec); font-weight: 600; font-size: 16px; }
.recbar { display: flex; align-items: center; gap: 10px; margin: 0 16px 6px; padding: 10px 14px; border-radius: 12px; background: #fff0ef; color: var(--rec); font-weight: 600; }
.recbar .tm { flex: 1; font-variant-numeric: tabular-nums; }
.recbar button { background: var(--rec); color: #fff; border-radius: 14px; padding: 5px 12px; font-size: 14px; }
/* 書き分けの箇条書き */
.nl { margin: 0 16px; background: var(--card); border-radius: 12px; padding: 2px 14px; }
.nl ul { list-style: none; margin: 0; padding: 0; }
.nl li { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: .5px solid var(--line); font-size: 16px; line-height: 1.5; }
.nl li .tx { flex: 1; min-width: 0; }
.nl li .sg { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.nl li .sg.none { color: var(--accent); }
.nl li button.who { cursor: pointer; }
.nl .add { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.nl .add input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; padding: 4px 0; }
.nl .add input::placeholder { color: var(--muted); }
.nl .add .who { opacity: .9; }
.pr { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: .5px solid var(--line); }
.pr:last-child { border-bottom: 0; }
.pr .d { width: 44px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.pr .n { flex: 1; min-width: 0; font-size: 15px; }
.pr .n small { display: block; color: var(--muted); font-size: 12px; }
.addpr { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 16px; padding: 10px 0; }
.list { margin: 0 16px; background: var(--card); border-radius: 12px; overflow: hidden; }
.list button { display: flex; width: 100%; align-items: center; justify-content: space-between; text-align: left; padding: 12px 16px; border-bottom: .5px solid var(--line); }
.list button:last-child { border-bottom: 0; }
.list small { display: block; color: var(--muted); font-size: 14px; }
.list svg { color: #c4c4c7; flex: none; }
.plus { position: absolute; right: 18px; bottom: 96px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 var(--accent-d); z-index: 20; }
/* 曲ページ */
.vm { display: flex; background: #e3e3e8; border-radius: 9px; padding: 2px; margin: 14px 20px 0; }
.vm button { flex: 1; padding: 6px 0; border-radius: 7px; font-size: 13px; font-weight: 600; }
.vm button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tr li { display: flex; flex-direction: column; padding: 9px 0; border-bottom: .5px solid var(--line); list-style: none; }
.tr li:last-child { border-bottom: 0; }
.tr .d { font-size: 12px; color: var(--muted); }
.tr .t { font-size: 15px; line-height: 1.5; }
.tr { margin: 0; padding: 0; }
.memo-in { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: .5px solid var(--line); }
.memo-in input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; }
.memo-in .ok { color: var(--accent); font-weight: 600; }
.log { padding: 10px 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.div { align-self: center; font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
.lmark { align-self: center; display: flex; align-items: center; gap: 4px; background: #e3e3e8; border-radius: 14px; padding: 5px 12px; font-size: 12px; color: var(--fg); font-weight: 600; margin: 2px 0; }
.lb { align-self: flex-start; max-width: 80%; }
.lb .nm { font-size: 11px; color: var(--muted); margin: 0 0 2px 10px; }
.lb .bb { background: var(--t-bg); padding: 9px 13px; border-radius: 18px 18px 18px 6px; font-size: 15px; line-height: 1.45; }
.rb { align-self: flex-end; max-width: 80%; background: var(--me-bg); padding: 9px 13px; border-radius: 18px 18px 6px 18px; font-size: 15px; line-height: 1.45; }
.rb small { display: block; font-size: 11px; color: #8a6500; margin-bottom: 1px; }
.rrec { align-self: flex-end; max-width: 82%; background: var(--card); padding: 8px 12px 8px 8px; border-radius: 18px 18px 6px 18px; display: flex; flex-direction: column; gap: 4px; }
.rrec .rl { font-size: 11px; color: var(--muted); padding-left: 4px; }
.rrec .rt { font-size: 14px; padding-left: 4px; }
.rrec .rr { display: flex; align-items: center; gap: 8px; }
.rrec .pb { background: var(--bg); }
.rrec .wave { color: var(--accent); }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 12px 30px; border-top: .5px solid var(--line); background: rgba(249,249,249,.96); }
.composer input { flex: 1; min-width: 0; height: 40px; border-radius: 20px; border: .5px solid var(--line); padding: 0 14px; font-size: 16px; outline: none; background: var(--card); }
.composer .send { flex: none; color: var(--accent); font-weight: 700; padding: 0 6px; }
.composer .rec { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--card); color: var(--rec); display: grid; place-items: center; }
.composer .who { flex: none; font-size: 12px; padding: 5px 8px; border-radius: 8px; }
.tg { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--card); font-size: 15px; text-align: left; }
.tg .bx { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; flex: none; }
.tg.on .bx { background: var(--accent); border-color: var(--accent); }
.empty { color: var(--muted); font-size: 15px; padding: 10px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="core.js"></script>
<script src="flows.js"></script>
<script>
const VARIANT = 'split'; // toggle：項目ごとに先生／自分を切り替え、split：欄を2つに分ける
const { D, Rec, makeNav, esc, h, I, toast, sheet } = LM;
const app = document.getElementById('app');
const stage = document.createElement('div'); stage.style.cssText = 'position:absolute;inset:0'; app.appendChild(stage);

// 学んだことを「誰の話か」「どの曲の話か」付きにする（サンプル）
const sampleNotes = {
  L1: [['弓を返すときに手首を固めない', 't', 's1'], ['3ポジへの移動は親指を先に動かす', 't', 's1'], ['20小節目からは弓を多めに使ってフレーズを大きく', 't', 's1'], ['スケールは移弦の前に左手を準備', 't', 's3'], ['親指を意識すると音程が安定する気がする', 'm', 's1']],
  L2: [['冒頭の付点はもっと軽く', 't', 's1'], ['開放弦に逃げずに4の指で取る', 't', 's2'], ['付点を軽くすると弓が余る', 'm', 's1']],
  L3: [['移弦は肘の高さから先に変える', 't', 's2']],
  L4: [['高音は喉で押さずに息の量で出す', 't', 's5'], ['サビ前のブレスを半拍早めに', 't', 's5'], ['息を多めにすると喉が楽', 'm', 's5']],
  L5: [['語尾を投げずに最後まで息を流す', 't', 's6']],
};
D.S.lessons.forEach((l) => { l.notes = (sampleNotes[l.id] || []).map(([text, by, songId]) => ({ text, by, songId })); });
const sync = (l) => { l.learned = l.notes.map((n) => n.text); };
D.S.lessons.forEach(sync);
D.S.memos.forEach((m) => { m.by = /（先生）/.test(m.text) ? 't' : 'm'; m.text = m.text.replace('（先生）', ''); });
const autoSong = (l) => (l.songIds.length === 1 ? l.songIds[0] : null);
const teacherOf = (typeId) => D.type(typeId).teacher || '先生';
// 曲に出す先生・自分の書き込み
const notesOfSong = (sid) => D.S.lessons.flatMap((l) => l.notes.filter((n) => n.songId === sid).map((n) => ({ ...n, date: l.date, lesson: l })));

let cur = 't1'; let tab = 'home'; let recTarget = null; let songView = 'sum';

function tabbar(nav) {
  const el = h('<div class="tabbar">' + [['home', 'いま', I.home], ['lessons', 'レッスン', I.list], ['songs', '曲', I.note]].map(([k, n, ic]) => '<button class="tab' + (tab === k ? ' on' : '') + '" data-k="' + k + '">' + ic + n + '</button>').join('') + '</div>');
  el.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { if (tab !== b.dataset.k) { tab = b.dataset.k; nav.root(tab); } }));
  return el;
}
function typeTabs(nav) {
  const el = h('<div class="types">' + D.S.types.map((t) => '<button class="' + (cur === t.id ? 'on' : '') + '" data-t="' + t.id + '">' + esc(t.name) + '</button>').join('') + '</div>');
  el.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { cur = b.dataset.t; nav.refresh(); }));
  return el;
}
function recBar(nav) {
  if (!Rec.on || !recTarget) return null;
  const el = h('<div class="recbar"><span>●</span><span class="tm">録音中 ' + D.dur(Rec.sec) + '</span><button data-tap>停止</button></div>');
  const un = Rec.sub(() => { if (!Rec.on) return un(); el.querySelector('.tm').textContent = '録音中 ' + D.dur(Rec.sec); });
  el.querySelector('button').onclick = () => { const r = Rec.stop(); D.addRec({ kind: 'lesson', lessonId: recTarget, dur: r.dur }); recTarget = null; toast(app, 'レッスンの録音を保存'); nav.refresh(); };
  return el;
}
function recordPractice(lesson, nav) {
  LM.practiceStand(app, { lesson, onStop: (dur) => setTimeout(() => LM.afterPracticeSheet(app, { lesson, dur, onSave: ({ songId, note }) => { D.addRec({ kind: 'practice', lessonId: lesson.id, songId, dur, note }); toast(app, '個人練を保存'); nav.refresh(); } }), 200) });
}
function recordLesson(lesson, nav) {
  recTarget = lesson.id;
  LM.recordSheet(app, { label: D.md(lesson.date) + ' ' + D.type(lesson.typeId).name + 'のレッスン', minimizable: true, onMin: () => nav.refresh(),
    onStop: (dur) => { D.addRec({ kind: 'lesson', lessonId: lesson.id, dur }); recTarget = null; toast(app, 'レッスンの録音を保存'); nav.refresh(); } });
}
const check = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
function recordSong(s, nav) {
  LM.recordSheet(app, { label: s.title, onStop: (dur) => setTimeout(() => {
    const l = D.latest(s.typeId); let link = !!l; let note = '';
    sheet(app, (el, close) => {
      const draw = () => {
        el.innerHTML = '<div class="ap"><div class="ap-head"><span class="ap-title">' + esc(s.title) + '</span><span class="ap-dur">' + D.dur(dur) + '</span></div>' +
          '<div class="ap-k">一言</div><input id="g-note" class="ap-note" placeholder="例：テンポ60で通せた" autocomplete="off">' +
          (l ? '<button class="tg press' + (link ? ' on' : '') + '" data-act="tg"><span class="bx">' + (link ? check : '') + '</span><span>' + D.fmtDate(l.date) + 'のレッスン後の個人練にする</span></button>' : '') +
          '<button class="ap-save press" data-act="save">保存</button></div>';
        const ni = el.querySelector('#g-note'); ni.value = note; ni.oninput = () => (note = ni.value);
        const tg = el.querySelector('[data-act=tg]'); if (tg) tg.onclick = () => { link = !link; draw(); };
        el.querySelector('[data-act=save]').onclick = () => { close(); D.addRec(link ? { kind: 'practice', lessonId: l.id, songId: s.id, dur, note } : { kind: 'song', songId: s.id, dur, note }); toast(app, '録音を保存'); nav.refresh(); };
      };
      draw();
    }, { modal: true });
  }, 420) });
}

const whoTag = (by, asBtn) => (asBtn ? '<button class="who ' + by + '" data-who>' : '<span class="who ' + by + '">') + (by === 't' ? '先生' : '自分') + (asBtn ? '</button>' : '</span>');

// 学んだことの入力。filter を渡すとその人の分だけ（split 用）
function noteList(l, nav, filter) {
  const box = document.createElement('div'); box.className = 'nl';
  let addBy = filter || 't';
  const draw = (focus) => {
    const items = l.notes.map((n, i) => ({ n, i })).filter(({ n }) => !filter || n.by === filter);
    const multi = l.songIds.length > 1;
    box.innerHTML = '<ul>' + items.map(({ n, i }) =>
      '<li data-i="' + i + '">' + (filter ? '' : whoTag(n.by, true)) + '<span class="tx">' + esc(n.text) +
      (multi ? '<button class="sg' + (n.songId ? '' : ' none') + '" data-sg>' + (n.songId ? '♪ ' + esc(D.song(n.songId).title) : '曲を選ぶ') + '</button>' : '') + '</span></li>').join('') + '</ul>' +
      '<div class="add">' + (filter ? '' : whoTag(addBy, true).replace('data-who', 'data-addwho')) + '<input id="nl-' + l.id + '-' + (filter || 'all') + '" placeholder="＋ 追加" enterkeyhint="next" autocomplete="off"></div>';
    box.querySelectorAll('[data-who]').forEach((b) => (b.onclick = () => { const n = l.notes[+b.closest('li').dataset.i]; n.by = n.by === 't' ? 'm' : 't'; draw(false); }));
    box.querySelectorAll('[data-sg]').forEach((b) => (b.onclick = () => {
      const n = l.notes[+b.closest('li').dataset.i]; const opts = [...l.songIds, null]; n.songId = opts[(opts.indexOf(n.songId) + 1) % opts.length]; draw(false);
    }));
    const aw = box.querySelector('[data-addwho]'); if (aw) aw.onclick = () => { addBy = addBy === 't' ? 'm' : 't'; const v = box.querySelector('input').value; draw(false); box.querySelector('input').value = v; box.querySelector('input').focus(); };
    const inp = box.querySelector('input');
    const commit = (keep) => { const v = inp.value; inp.value = ''; if (!v.trim()) return; l.notes.push({ text: v.trim(), by: addBy, songId: autoSong(l) }); sync(l); if (keep) draw(true); else setTimeout(() => draw(false), 0); };
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commit(true); } });
    inp.addEventListener('blur', () => commit(false));
    if (focus) box.querySelector('input').focus();
  };
  draw(false);
  return box;
}

const screens = {
  home(el, a, nav) {
    const hd = h('<div class="head"></div>'); hd.appendChild(typeTabs(nav)); el.appendChild(hd);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    const rb = recBar(nav); if (rb) { rb.style.marginTop = '10px'; sc.appendChild(rb); }
    const l = D.latest(cur);
    if (!l) { sc.appendChild(h('<div class="lh"><span>まだレッスンがありません</span></div>')); }
    else {
      const lh = h('<div class="lh"><span>' + D.fmtDate(l.date) + 'のレッスン · ' + D.rel(l.date) + '</span><button data-tap>ひらく' + I.chev + '</button></div>');
      lh.querySelector('button').onclick = () => nav.push('lesson', { id: l.id });
      sc.appendChild(lh);
      sc.appendChild(h('<div class="sec" style="padding-top:4px">宿題</div>'));
      sc.appendChild(h('<div class="grp"><ul class="hw">' + l.homework.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>'));
      sc.appendChild(h('<div class="sec">学んだこと</div>'));
      const ord = l.notes.slice().sort((x, y) => (x.by === y.by ? 0 : x.by === 't' ? -1 : 1));
      sc.appendChild(h('<div class="grp"><ul class="lr">' + ord.map((n) => '<li>' + whoTag(n.by) + '<span>' + esc(n.text) + '</span></li>').join('') + '</ul></div>'));
      const go = h('<button class="go">' + I.mic + '個人練をはじめる</button>'); go.onclick = () => recordPractice(l, nav); sc.appendChild(go);
      const prs = D.practiceOf(l.id).slice().reverse();
      sc.appendChild(h('<div class="sec">このレッスン後の個人練<span>' + prs.length + '回</span></div>'));
      if (prs.length) { const strip = h('<div class="prs"></div>'); prs.forEach((r) => { const c = h('<div class="pc"><span class="d">' + D.fmtDate(r.date) + (r.songId ? ' · ' + esc(D.song(r.songId).title) : '') + '</span><span class="n">' + (esc(r.note) || '（一言なし）') + '</span></div>'); c.appendChild(LM.playBtn(r)); strip.appendChild(c); }); sc.appendChild(strip); }
      else sc.appendChild(h('<div style="padding:0 32px;color:var(--muted)">まだありません</div>'));
    }
    sc.appendChild(h('<div style="height:40px"></div>'));
    el.appendChild(tabbar(nav));
  },
  lessons(el, a, nav) {
    const hd = h('<div class="head"></div>'); hd.appendChild(typeTabs(nav)); el.appendChild(hd);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    sc.appendChild(h('<div class="sec">' + esc(D.type(cur).teacher) + '</div>'));
    const list = h('<div class="list"></div>');
    D.lessonsOf(cur).forEach((l) => { const b = h('<button data-tap><span>' + D.fmtDate(l.date, true) + '<small>' + esc(l.learned[0] || '（まだ何も書いていない）') + '</small></span>' + I.chev + '</button>'); b.onclick = () => nav.push('lesson', { id: l.id }); list.appendChild(b); });
    sc.appendChild(list); sc.appendChild(h('<div style="height:100px"></div>'));
    const plus = h('<button class="plus press" aria-label="新しいレッスン">' + I.plus + '</button>');
    plus.onclick = () => { const l = D.addLesson(cur); l.notes = []; nav.push('lesson', { id: l.id }); };
    el.appendChild(plus);
    el.appendChild(tabbar(nav));
  },
  songs(el, a, nav) {
    const hd = h('<div class="head"></div>'); hd.appendChild(typeTabs(nav)); el.appendChild(hd);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    sc.appendChild(h('<div class="sec">曲</div>'));
    const list = h('<div class="list"></div>');
    D.songsOf(cur).forEach((s) => { const la = D.lastActivity(s.id); const b = h('<button data-tap><span>' + esc(s.title) + '<small>' + esc(s.sub) + (la ? ' · ' + D.rel(la) : '') + '</small></span>' + I.chev + '</button>'); b.onclick = () => nav.push('song', { id: s.id }); list.appendChild(b); });
    sc.appendChild(list); sc.appendChild(h('<div style="height:30px"></div>'));
    el.appendChild(tabbar(nav));
  },
  lesson(el, a, nav) {
    const l = D.lesson(a.id); const t = D.type(l.typeId); cur = l.typeId;
    const nb = h('<div class="nav"><button class="bk">' + I.back + '戻る</button><span></span></div>'); nb.querySelector('.bk').onclick = () => nav.back(); el.appendChild(nb);
    const rb = recBar(nav); if (rb) el.appendChild(rb);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    sc.appendChild(h('<div class="ttl"><b>' + D.fmtDate(l.date, true) + '</b><span>' + esc(t.name) + ' · ' + esc(t.teacher) + '</span></div>'));
    const songs = h('<div class="songs">' + l.songIds.map((id) => '<button data-s="' + id + '">' + I.note + esc(D.song(id).title) + '</button>').join('') + '<button data-act="songs" style="color:var(--accent)">' + (l.songIds.length ? '編集' : '＋ 扱った曲') + '</button></div>');
    songs.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => nav.push('song', { id: b.dataset.s })));
    songs.querySelector('[data-act=songs]').onclick = () => LM.songPicker(app, l, () => nav.refresh());
    sc.appendChild(songs);
    sc.appendChild(h('<div class="sec">レッスン録音</div>'));
    const lr = D.lessonRec(l.id);
    if (lr) { const box = h('<div class="recbox"></div>'); box.appendChild(LM.playBtn(lr)); box.insertAdjacentHTML('beforeend', LM.wave(lr.id, 40)); sc.appendChild(box); }
    else if (Rec.on && recTarget === l.id) sc.appendChild(h('<div style="padding:0 32px;color:var(--muted)">録音中</div>'));
    else { const b = h('<button class="recbtn press">' + I.mic + 'レッスンを録音</button>'); b.onclick = () => recordLesson(l, nav); sc.appendChild(b); }
    const hint = l.songIds.length > 1 ? '<span class="hint">曲名をタップで切り替え</span>' : '';
    if (VARIANT === 'split') {
      sc.appendChild(h('<div class="sec">先生の指摘' + hint + '</div>')); sc.appendChild(noteList(l, nav, 't'));
      sc.appendChild(h('<div class="sec">自分の気づき</div>')); sc.appendChild(noteList(l, nav, 'm'));
    } else {
      sc.appendChild(h('<div class="sec">学んだこと<span class="hint">先生／自分をタップで切り替え</span></div>')); sc.appendChild(noteList(l, nav));
    }
    sc.appendChild(h('<div class="sec">宿題</div>'));
    const hw = LM.bullets(l, 'homework'); hw.style.cssText = 'margin:0 16px;background:var(--card);border-radius:12px;padding:2px 14px'; sc.appendChild(hw);
    sc.appendChild(h('<div class="sec">このレッスン後の個人練</div>'));
    const pg = h('<div class="grp"></div>');
    D.practiceOf(l.id).forEach((r) => { const row = h('<div class="pr"><span class="d">' + D.md(r.date) + '</span><span class="n">' + (esc(r.note) || '（一言なし）') + (r.songId ? '<small>' + esc(D.song(r.songId).title) + '</small>' : '') + '</span></div>'); row.appendChild(LM.playBtn(r)); pg.appendChild(row); });
    const ap = h('<button class="addpr press">' + I.mic + '個人練を記録</button>'); ap.onclick = () => recordPractice(l, nav); pg.appendChild(ap);
    sc.appendChild(pg); sc.appendChild(h('<div style="height:40px"></div>'));
  },
  song(el, a, nav) {
    const s = D.song(a.id); const tname = teacherOf(s.typeId);
    const nb = h('<div class="nav"><button class="bk">' + I.back + '戻る</button><span></span></div>'); nb.querySelector('.bk').onclick = () => nav.back(); el.appendChild(nb);
    const top = h('<div><div class="ttl"><b>' + esc(s.title) + '</b><span>' + esc(s.sub) + '</span></div><div class="vm"><button data-v="sum" class="' + (songView === 'sum' ? 'on' : '') + '">まとめ</button><button data-v="chat" class="' + (songView === 'chat' ? 'on' : '') + '">チャット</button></div></div>');
    top.querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => { songView = b.dataset.v; nav.refresh(); }));
    el.appendChild(top);
    const sc = h('<div class="scroll"></div>'); el.appendChild(sc);
    if (songView === 'sum') {
      const tn = notesOfSong(s.id).filter((n) => n.by === 't').sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0));
      sc.appendChild(h('<div class="sec">先生の指摘</div>'));
      const byDate = []; tn.forEach((n) => { const g = byDate[byDate.length - 1]; if (g && g.date === n.date) g.items.push(n); else byDate.push({ date: n.date, items: [n] }); });
      sc.appendChild(tn.length ? h('<div class="grp"><ul class="tr">' + byDate.map((g) => '<li><span class="d">' + D.fmtDate(g.date, true) + '</span>' + g.items.map((n) => '<span class="t">・' + esc(n.text) + '</span>').join('') + '</li>').join('') + '</ul></div>') : h('<div class="grp"><div class="empty">まだありません</div></div>'));
      sc.appendChild(h('<div class="sec">録音</div>'));
      const rg = h('<div class="grp"></div>');
      const recs = D.recsOfSong(s.id);
      recs.forEach((r) => { const row = h('<div class="pr"><span class="d">' + D.md(r.date) + '</span><span class="n">' + (esc(r.note) || '（一言なし）') + '<small>' + (r.kind === 'practice' ? D.md(D.lesson(r.lessonId).date) + 'のレッスン後の個人練' : '曲の録音') + '</small></span></div>'); row.appendChild(LM.playBtn(r)); rg.appendChild(row); });
      const ar = h('<button class="addpr press">' + I.mic + 'この曲を録音</button>'); ar.onclick = () => recordSong(s, nav); rg.appendChild(ar);
      sc.appendChild(rg);
      sc.appendChild(h('<div class="sec">自分のメモ</div>'));
      const mg = h('<div class="grp"></div>');
      const mi = h('<div class="memo-in"><input id="g-memo" placeholder="今日のメモ" autocomplete="off"><button class="ok" data-tap>追加</button></div>');
      const add = () => { const m = D.addMemo(s.id, mi.querySelector('input').value); if (m) { m.by = 'm'; toast(app, D.md(D.TODAY) + 'のメモとして追加'); nav.refresh(); } };
      mi.querySelector('.ok').onclick = add; mi.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) add(); };
      mg.appendChild(mi);
      const mine = [...D.memosOf(s.id).map((m) => ({ date: m.date, text: m.text, by: m.by })), ...notesOfSong(s.id).filter((n) => n.by === 'm')].sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0));
      mg.appendChild(h('<ul class="tr">' + mine.map((m) => '<li><span class="d">' + D.fmtDate(m.date, true) + (m.lesson ? ' · レッスンで' : '') + (m.by === 't' ? ' · 先生' : '') + '</span><span class="t">' + esc(m.text) + '</span></li>').join('') + '</ul>'));
      sc.appendChild(mg);
      sc.appendChild(h('<div class="sec">扱ったレッスン</div>'));
      const lg = h('<div class="list"></div>');
      D.lessonsOfSong(s.id).forEach((l) => { const b = h('<button data-tap><span>' + D.fmtDate(l.date, true) + '</span>' + I.chev + '</button>'); b.onclick = () => nav.push('lesson', { id: l.id }); lg.appendChild(b); });
      sc.appendChild(lg); sc.appendChild(h('<div style="height:40px"></div>'));
      return;
    }
    // チャット表示：先生の指摘は左、自分のメモ・気づき・録音は右
    const items = [];
    D.lessonsOfSong(s.id).forEach((l) => items.push({ t: 'lesson', date: l.date, o: 0, l }));
    notesOfSong(s.id).forEach((n) => items.push({ t: n.by === 't' ? 'tn' : 'mn', date: n.date, o: 1, n }));
    D.memosOf(s.id).forEach((m) => items.push({ t: m.by === 't' ? 'tm' : 'mm', date: m.date, o: 2, m }));
    D.recsOfSong(s.id).forEach((r) => items.push({ t: 'rec', date: r.date, o: 3, r }));
    items.sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : x.o - y.o));
    const log = h('<div class="log"></div>'); let last = ''; let prevT = '';
    items.forEach((it) => {
      if (it.date !== last) { last = it.date; prevT = ''; log.appendChild(h('<div class="div">' + D.fmtDate(it.date, true) + '</div>')); }
      const isT = it.t === 'tn' || it.t === 'tm'; const cont = isT && prevT === 'T'; prevT = isT ? 'T' : it.t;
      if (it.t === 'lesson') { const b = h('<button class="lmark press">' + esc(D.type(it.l.typeId).name) + 'のレッスン' + I.chev + '</button>'); b.onclick = () => nav.push('lesson', { id: it.l.id }); log.appendChild(b); }
      if (it.t === 'tn' || it.t === 'tm') log.appendChild(h('<div class="lb">' + (cont ? '' : '<div class="nm">' + esc(tname) + '</div>') + '<div class="bb">' + esc((it.n || it.m).text) + '</div></div>'));
      if (it.t === 'mn') log.appendChild(h('<div class="rb"><small>レッスンで</small>' + esc(it.n.text) + '</div>'));
      if (it.t === 'mm') log.appendChild(h('<div class="rb">' + esc(it.m.text) + '</div>'));
      if (it.t === 'rec') { const r = it.r; const b = h('<div class="rrec"><span class="rl">' + (r.kind === 'practice' ? D.md(D.lesson(r.lessonId).date) + 'のレッスン後の個人練' : '録音') + '</span>' + (r.note ? '<span class="rt">' + esc(r.note) + '</span>' : '') + '<div class="rr"></div></div>'); b.querySelector('.rr').appendChild(LM.playBtn(r)); b.querySelector('.rr').insertAdjacentHTML('beforeend', LM.wave(r.id, 16)); log.appendChild(b); }
    });
    sc.appendChild(log);
    let by = 'm';
    const cp = h('<div class="composer"><button class="rec press" aria-label="録音">' + I.mic + '</button><button class="who m" data-act="by">自分</button><input id="g-chat" placeholder="メモ" autocomplete="off"><button class="send press">追加</button></div>');
    cp.querySelector('[data-act=by]').onclick = (e) => { by = by === 'm' ? 't' : 'm'; e.currentTarget.className = 'who ' + by; e.currentTarget.textContent = by === 't' ? '先生' : '自分'; };
    const add = () => { const m = D.addMemo(s.id, cp.querySelector('input').value); if (m) { m.by = by; nav.refresh(); } };
    cp.querySelector('.send').onclick = add; cp.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) add(); };
    cp.querySelector('.rec').onclick = () => recordSong(s, nav);
    el.appendChild(cp);
    requestAnimationFrame(() => { sc.scrollTop = sc.scrollHeight; });
  },
};
const nav = makeNav(stage, screens);
LM.chrome(app, () => { const l = recTarget && D.lesson(recTarget); if (l) recordLesson(l, nav); });
nav.root('home');
window.__nav = nav;
</script>
</body>
</html>
